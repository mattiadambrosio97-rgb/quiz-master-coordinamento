i clienti/utenti"], "a": 1}, {"id": 10668, "s": "piat", "m": 8, "n": "7", "q": "Il ciclo PDCA:", "p": "L'approccio per processi, la Qualita in sanita e la Iso 90o1:2015", "o": ["non risulta applicabile completamente allinterno dei processi sanitari", "e definito dal Ministero della Salute", "permette all'organizzazione di assicurare che i propri processi siano adeguatamente dotati di risorse e gestiti, e che le", "non prende in considerazione l'analisi dei rischi e delle opportunita"], "a": 2}, {"id": 10669, "s": "piat", "m": 8, "n": "8", "q": "Il Risk Based Thinking permette all'organizzazione:", "p": "L'approccio per processi, la Qualita in sanita e la Is0 9001:2015", "o": ["di determinare i fattori che potrebbero fare deviare i suoi processi e il suo SGQ dai risultati pianificati, di mettere in atto controlli preventivi per minimizzare gli effetti negativi e massimizzare le opportunita, quando esse si presentano", "di evitare completamente di incorrere in errore seguendo pedissequamente la metodologia", "di determinare i fattori che potrebbero fare deviare i suoi processi e il suoSGQ dai risultati pianificati, di mettere in atto controlli preventivi per evitare qualsiasi effetto negativo e massimizzare tutte le opportunita", "di prendere in analisi esclusivamente le opportunita, che altrimenti non verrebbero valutate, derivanti dall'analisi del rischio"], "a": 0}, {"id": 10670, "s": "piat", "m": 8, "n": "9", "q": "I criteri fondanti per un'assistenza sanitaria efficace sono:", "p": "Il miglioramento continuo in ambito sanitario", "o": ["I'uguaglianza, la tutela e l'accesso ai servizi", "la presa in carico dei bisogni dei cittadini, l'efficacia delle azioni cliniche/assistenziali intraprese, l'analisi delle risorse disponibili", "la ricerca clinica, la presa in carico delle necessita organizzative, l'uso incondizionato delle risorse per il bene comune", "la prevenzione, la cura e la riabilitazione"], "a": 1}, {"id": 10671, "s": "piat", "m": 8, "n": "10", "q": "L'a iabilitativa non basata su prove di efficacia ma sull'azzardo", "l'assunzione di responsabilita da parte dei professionisti sanitari in caso di stato di necessita e/o incoscienza del paziente", "esclusivamente un'opportunita che deve essere misurata e condivisa con il paziente al fine di garantirne la sicurezza delle cure", "condizione o evento potenziale, intrinseco o estrinseco al processo, che puo modificare l'esito atteso del processo. E misurato in termini di probabilita e di conseguenze, come prodotto tra la probabilita che accada uno specifico evento (P) e la gravita del danno che ne consegue (D); nel calcolo del rischio si considera anche la capacita del fattore umano di individuare in anticipo e contenere le conseguenze dell'evento potenzialmente dannoso (fattore K)"], "a": 3}, {"id": 10675, "s": "piat", "m": 8, "n": "4", "q": "I metodi di valutazione del rischio possono basarsi su un'analisi:", "p": "Significato di rischio e metodologia di analisi", "o": ["attiva e passiva", "giuridica e giudiziale", "proattiva e reattiva", "sicura ed efficace"], "a": 2}, {"id": 10676, "s": "piat", "m": 8, "n": "5", "q": "La gestione del rischio clinico ha lo scopo di:", "p": "Significato di rischio e metodologia di analisi", "o": ["evitare completamente il verificarsi di eventi dannosi per il paziente", "evitare completamente il verificarsi di eventi rischiosi per il paziente", "contenere e/o evitare gli eventi avversi attraverso un processo sistematico di identificazione, valutazione e trattamento dei rischi attuali e potenziali connessi alle attivita svolte all'interno della struttura sanitaria garantendo la sicurezza del paziente", "supportare il paziente nella firma del consenso informato"], "a": 2}, {"id": 10677, "s": "piat", "m": 8, "n": "6", "q": "L'incident reporting e:", "p": "Significato di rischio e metodologia di analisi", "o": ["Ail dovere di segnalare tutti gli eventi che hanno causato un danno al paziente", "una modalita di raccolta delle segnalazioni di ev   if(act==='pick'){
    if(p !== d.p) return; const q = byId(d.c[p]); if(!q || d.g[q.id]) return;
    const i = parseInt(arg); const a = ansOf(q); answer(name, q.id, i, i===a); d.g[q.id].ok = (i===a); save(); renderTrain(); return;
  }
}

// ---- flashcard ----
let flipped = false;
function renderFc(){
  const v = document.getElementById('v-fc');
  const name = dn(S.fcMode==='err' ? 'fcerr' : 'fc'); const d = deck(name); sync(name);
  if(d.n===0 || (!d.c.length && pool(name).length)) fill(name);
  const nErr = errorList().length;
  let h = '<div class="seg"><button class="' + (name==='fc'?'on':'') + '" data-act="fcmode" data-arg="all">Tutte le domande</button><button class="' + (name==='fcerr'?'on':'') + '" data-act="fcmode" data-arg="err">Solo i miei errori · ' + nErr + '</button></div>' + (S.fcMode==='err' ? '' : modSel('all'));
  if(!d.c.length){ h += '<div class="card">' + (name==='fcerr' ? 'Il contenitore degli errori è vuoto.' : 'Nessuna domanda con risposta disponibile.') + '</div>'; v.innerHTML = h; return; }
  const p = vpos(name); const tot = d.c.length;
  if(p >= tot){
    const sc = cycleScore(d);
    h += '<div class="card done"><div class="tag">Mazzo completato</div><div class="big">' + (sc.n ? Math.round(sc.ok/sc.n*100) : 0) + '%</div><p>' + sc.ok + ' carte che sapevi su ' + sc.n + '.</p>'
      + '<div class="bar"><button class="btn ghost" data-act="fcback">Rivedi le ultime</button><button class="btn" data-act="fcnew">Nuovo mazzo</button></div></div>';
    v.innerHTML = h; return;
  }
  const q = byId(d.c[p]); const a = ansOf(q); const g = d.g[q.id]; const past = p < d.p; const graded = !!g;
  const show = flipped || graded;
  h += '<div class="meta"><span>Carta <b>' + (p+1) + '</b> di ' + tot + '</span><span>' + Object.keys(d.g).length + ' valutate' + (past ? ' · <span class="pill w">stai rivedendo</span>' : '') + '</span></div>';
  h += '<div class="prog"><i style="width:' + Math.round(d.p/tot*100) + '%"></i></div>';
  h += '<div class="fc-wrap"><div class="fc ' + (show?'flip':'') + '" data-act="flip">'
    + '<div class="front"><span class="tag">' + lab(q) + '</span><p class="q">' + esc(q.q) + '</p><span class="tap">Tocca la carta o premi <kbd>Spazio</kbd> per vedere la risposta</span></div>'
    + '<div class="back"><div class="ansl">' + L[a] + '</div><div class="anst">' + esc(q.o[a]) + '</div><span class="tap">' + esc(q.q) + '</span></div>'
    + '</div></div>';
  if(graded) h += '<div class="fb ' + (g.ok?'ok':'ko') + '">' + (g.ok ? 'Segnata come “la sapevo”.' : 'Segnata come “non la sapevo”: finisce nel contenitore degli errori.') + '</div>';
  h += '<div class="bar"><button class="btn ghost" data-act="fcback" ' + (p>0?'':'disabled') + '>← Indietro</button>';
  if(graded) h += '<button class="btn sec" data-act="fcundo">' + (past?'Cambia':'Annulla') + '</button><span class="sp"></span><button class="btn" data-act="fcnext">Avanti →</button>';
  else if(show) h += '<span class="sp"></span><button class="btn danger" data-act="grade" data-arg="0">Non la sapevo</button><button class="btn" style="background:var(--ok)" data-act="grade" data-arg="1">La sapevo</button>';
  else h += '<span class="sp"></span><button class="btn" data-act="flip">Mostra la risposta</button>';
  h += '</div>';
  h += '<div class="hint">' + (show && !graded ? '<kbd>1</kbd> non la sapevo, <kbd>2</kbd> la sapevo.' : 'Le carte che non sai finiscono negli errori, come nel quiz.') + '</div>';
  v.innerHTML = h;
}
function fcAct(act, arg){
  const name = dn(S.fcMode==='err' ? 'fcerr' : 'fc'); const d = deck(name); const p = vpos(name);
  if(act==='fcmode'){ S.fcMode = arg; const nn = dn(arg==='err'?'fcerr':'fc'); const dd = deck(nn); if(dd.p >= dd.c.length && pool(nn).length) fill(nn); flipped=false; save(); renderFc(); return; }
  if(act==='fcnew'){ fill(name); flipped=false; renderFc(); return; }
  if(act==='flip'){ if(p < d.c.length && !d.g[d.c[p]]) { flipped = !flipped; renderFc(); } return; }
  if(act==='grade'){ if(p!==d.p) return; const q = byId(d.c[p]); if(!q || d.g[q.id]) return; const ok = arg==='1'; answer(name, q.id, ok?1:0, ok); d.g[q.id].ok = ok; save(); flipped=false; renderFc(); return; }
  if(act==='fcback'){ if(p >= d.c.length) view[name] = d.c.length-1; else if(p>0) view[name] = p-1; flipped=false; renderFc(); return; }
  if(act==='fcnext'){ if(p < d.p) view[name] = p+1; else advance(name); flipped=false; renderFc(); return; }
  if(act==='fcundo'){ undo(name, d.c[p]); flipped=true; renderFc(); return; }
}

// ---- tastiera ----
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA') return;
  const k = e.key.toUpperCase();
  if(!document.getElementById('v-train').hidden){
    const d = deck(dn(S.mode)); const p = vpos(dn(S.mode)); if(p >= d.c.length) return;
    const g = d.g[d.c[p]];
    if(!g && k.length===1 && '1234'.includes(k)) trainAct('pick', parseInt(k)-1);
    else if(!g && k.length===1 && 'ABCD'.includes(k)) trainAct('pick', L.indexOf(k));
    else if(g && (e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){ e.preventDefault(); trainAct('next'); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); trainAct('back'); }
    else if(g && k==='Z'){ trainAct('undo'); }
  } else if(!document.getElementById('v-fc').hidden){
    const name = dn(S.fcMode==='err'?'fcerr':'fc'); const d = deck(name); const p = vpos(name); if(p >= d.c.length) return;
    const g = d.g[d.c[p]];
    if(!g && (e.key===' '||e.key==='Enter')){ e.preventDefault(); fcAct('flip'); }
    else if(!g && flipped && (k==='1'||k==='2')) fcAct('grade', k==='2'?'1':'0');
    else if(g && (e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){ e.preventDefault(); fcAct('fcnext'); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); fcAct('fcback'); }
  }
});

// ---- errori frequenti ----
function renderErrors(){
  const v = document.getElementById('v-errors');
  const list = errorList();
  let h = '<div class="note">Qui finiscono le domande sbagliate almeno una volta, in ordine di quante volte le hai sbagliate. Una domanda esce dal contenitore da sola quando la azzecchi due volte di fila; puoi anche toglierla a mano.</div>';
  h += '<div class="bar" style="margin:0 0 14px"><button class="btn" data-act="trainerr" ' + (list.length?'':'disabled') + '>Allenati solo su queste · ' + list.length + '</button><button class="btn sec" data-act="fcerr" ' + (list.length?'':'disabled') + '>Flashcard degli errori</button></div>';
  if(!list.length){ h += '<div class="card">Nessun errore registrato per ora.</div>'; v.innerHTML=h; return; }
  h += '<div class="card">';
  list.forEach(q=>{
    const s = st(q.id); const a = ansOf(q);
    h += '<div class="row"><div class="t">' + esc(q.q) + '</div>'
      + '<div class="s"><span class="pill">' + s.ko + ' ' + (s.ko===1?'errore':'errori') + '</span><span class="pill g">' + s.ok + ' giuste</span><span>' + lab(q) + ' · ultime: ' + (s.last.map(x=>x?'✓':'✗').join(' ')||'–') + '</span></div>'
      + '<details><summary>Vedi risposta</summary><div class="ans g"><span class="l">' + L[a] + '</span><span>' + esc(q.o[a]) + '</span></div></details>'
      + '<div class="bar" style="margin-top:8px"><button class="btn ghost sm" data-act="forgive" data-arg="' + q.id + '">Togli dal contenitore</button></div></div>';
  });
  h += '</div>';
  v.innerHTML = h;
}
function forgive(id){ const s = st(id); s.last.push(true,true); if(s.last.length>10) s.last = s.last.slice(-10); save(); renderErrors(); chips(); }

// ---- sfoglia ----
let bq = '', bm = 'all';
function renderBrowse(){
  const v = document.getElementById('v-browse');
  const mods = [...new Set(RAW.map(q=>mk(q)))];
  let h = '<div class="bar" style="margin:0 0 14px"><input type="search" placeholder="Cerca nel testo…" value="' + esc(bq) + '" oninput="bq=this.value;renderBrowse()" style="flex:1;min-width:200px"><select onchange="bm=this.value;renderBrowse()"><option value="all">Tutti i moduli</option><option value="pan" ' + (bm==='pan'?'selected':'') + '>Tutto il paniere</option><option value="piat" ' + (bm==='piat'?'selected':'') + '>Tutta la piattaforma</option>' + mods.map(m=>'<option value="' + m + '" ' + (bm==m?'selected':'') + '>' + mlab(m) + '</option>').join('') + '</select></div>';
  const f = RAW.filter(q => (bm==='all'||(bm==='pan'&&q.s!=='piat')||(bm==='piat'&&q.s==='piat')||mk(q)===bm) && (!bq || (q.q+' '+q.o.join(' ')+' '+(q.p||'')).toLowerCase().includes(bq.toLowerCase())));
  h += '<div class="small" style="margin-bottom:8px">' + f.length + ' domande</div><div class="card">';
  f.slice(0,300).forEach(q=>{
    const a = ansOf(q); const s = S.stats[q.id];
    h += '<div class="row"><div class="t"><span class="small">' + lab(q) + '.</span> ' + esc(q.q) + '</div>';
    q.o.forEach((o,i)=> h += '<div class="ans ' + (i===a?'g':'') + '"><span class="l">' + L[i] + '</span><span>' + esc(o) + '</span></div>');
    if(q.a<0) h += '<div class="s">' + (S.manual[q.id]!==undefined ? '<span class="pill g">risposta impostata a mano</span>' : '<span class="pill w">il paniere PDF non segna la risposta</span> impostala nella scheda “Da completare”.') + '</div>';
    else if(s) h += '<div class="s">Tue risposte: ' + s.ok + ' giuste, ' + s.ko + ' sbagliate.</div>';
    h += '</div>';
  });
  if(f.length>300) h += '<div class="small">Mostrate le prime 300: restringi con la ricerca.</div>';
  h += '</div>'; v.innerHTML = h;
  const inp = v.querySelector('input'); if(bq && inp){ inp.focus(); inp.setSelectionRange(bq.length,bq.length); }
}

// ---- da completare ----
function renderTodo(){
  const v = document.getElementById('v-todo');
  const list = RAW.filter(q=>q.a<0);
  const done = list.filter(q=>S.manual[q.id]!==undefined).length;
  let h = '<div class="note"><b>Riguarda solo il paniere del Master (il PDF).</b> Le ' + RAW.filter(q=>q.s==="piat").length + ' domande dei test di fine lezione della piattaforma hanno tutte la risposta e sono gia' in allenamento. Qui restano le ' + list.length + ' domande che il PDF del paniere non segna: impostale tu dalla dispensa e appena salvate entrano nel giro. Impostate: <b>' + done + '</b> su ' + list.length + '.</div>';
  h += '<div class="card">';
  list.forEach(q=>{
    const m = S.manual[q.id];
    h += '<div class="row"><div class="t"><span class="small">' + lab(q) + '.</span> ' + esc(q.q) + '</div>';
    q.o.forEach((o,i)=> h += '<label class="ans ' + (m===i ? 'g' : '') + '"><input type="radio" name="m' + q.id + '" ' + (m===i?'checked':'') + ' onchange="setManual(' + q.id + ',' + i + ')"> <span class="l">' + L[i] + '</span><span>' + esc(o) + '</span></label>');
    if(m!==undefined) h += '<div class="s"><span class="pill g">impostata: ' + L[m] + '</span><button class="btn ghost sm" onclick="unsetManual(' + q.id + ')">Annulla</button></div>';
    h += '</div>';
  });
  h += '</div>'; v.innerHTML = h;
}
function setManual(id,i){ S.manual[id]=i; save(); const y = window.scrollY; renderTodo(); chips(); window.scrollTo(0,y); }
function unsetManual(id){ delete S.manual[id]; save(); const y = window.scrollY; renderTodo(); chips(); window.scrollTo(0,y); }

// ---- statistiche ----
function totals(){ let ok=0, ko=0, seen=0; for(const id in S.stats){ ok+=S.stats[id].ok; ko+=S.stats[id].ko; if(S.stats[id].ok+S.stats[id].ko) seen++; } return {ok,ko,seen}; }
function renderStats(){
  const v = document.getElementById('v-stats');
  const t = totals(); const tot = ready().length; const d = deck('all');
  let h = '<div class="stats">'
    + '<div class="stat"><b>' + tot + '</b><span>domande in gioco (su ' + RAW.length + ')</span></div>'
    + '<div class="stat"><b>' + t.seen + '</b><span>domande viste almeno una volta</span></div>'
    + '<div class="stat"><b>' + (t.ok+t.ko?Math.round(t.ok/(t.ok+t.ko)*100):0) + '%</b><span>risposte giuste (' + t.ok + ' su ' + (t.ok+t.ko) + ')</span></div>'
    + '<div class="stat"><b>' + errorList().length + '</b><span>nel contenitore errori</span></div>'
    + '<div class="stat"><b>' + RAW.filter(q=>q.a<0 && S.manual[q.id]===undefined).length + '</b><span>del paniere PDF senza risposta segnata (i test della piattaforma sono tutti completi)</span></div>'
    + '<div class="stat"><b>' + d.n + '</b><span>giro in corso (' + Math.min(d.p,d.c.length) + ' di ' + d.c.length + ' fatte)</span></div>'
    + '</div>';
  const mods = {};
  RAW.forEach(q=>{ const k = mk(q); const m = mods[k] || (mods[k]={ok:0,ko:0,n:0}); m.n++; const s=S.stats[q.id]; if(s){m.ok+=s.ok;m.ko+=s.ko;} });
  h += '<div class="card"><h2>Per modulo</h2>';
  Object.keys(mods).forEach(k=>{ const m=mods[k]; const tt=m.ok+m.ko; const pc = tt?Math.round(m.ok/tt*100):0;
    h += '<div class="mbar"><span class="nm">' + mlab(k) + ' <span class="small">(' + m.n + ')</span></span><span class="tr"><i style="width:' + pc + '%"></i></span><span class="pc">' + (tt ? pc + '% su ' + tt : 'mai fatto') + '</span></div>'; });
  h += '</div>';
  h += '<div class="bar"><button class="btn sec" data-act="stnew">Nuovo giro</button><button class="btn danger" data-act="streset">Azzera statistiche</button></div>'
    + '<p class="small">I dati restano salvati in questo browser su questo dispositivo.</p>';
  v.innerHTML = h;
}

// ---- azioni e navigazione ----
document.body.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act = b.dataset.act, arg = b.dataset.arg;
  if(['mode','newcycle','back','next','skip','undo','pick'].includes(act)) return trainAct(act, arg);
  if(['fcmode','fcnew','flip','grade','fcback','fcnext','fcundo'].includes(act)) return fcAct(act, arg);
  if(act==='forgive') return forgive(parseInt(arg));
  if(act==='trainerr'){ S.mode='err'; fill('err'); save(); return show('train'); }
  if(act==='fcerr'){ S.fcMode='err'; fill('fcerr'); save(); return show('fc'); }
  if(act==='stnew'){ if(confirm('Ricominciare il giro da capo, tenendo le statistiche?')){ fill('all'); S.mode='all'; save(); renderStats(); } return; }
  if(act==='streset'){ if(confirm('Cancellare tutte le statistiche e gli errori? Le risposte impostate a mano restano.')){ S.stats={}; S.d={}; S.mode='all'; S.fcMode='all'; for(const k in view) delete view[k]; fill('all'); save(); renderStats(); chips(); } return; }
});
function chips(){
  const t = totals(); const nErr = errorList().length;
  document.getElementById('chips').innerHTML = '<span class="chip">' + ready().length + ' domande</span><span class="chip">' + (t.ok+t.ko ? Math.round(t.ok/(t.ok+t.ko)*100) + '% giuste' : 'nessuna risposta ancora') + '</span>';
  const c = document.getElementById('errcnt'); c.textContent = nErr; c.hidden = !nErr;
}
function show(v){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  ['train','fc','errors','browse','todo','stats'].forEach(k=>document.getElementById('v-'+k).hidden = k!==v);
  flipped = false;
  ({train:renderTrain, fc:renderFc, errors:renderErrors, browse:renderBrowse, todo:renderTodo, stats:renderStats})[v]();
  chips(); window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));
if(!deck(dn('all')).c.length) fill(dn('all'));
show('train');
</script>
