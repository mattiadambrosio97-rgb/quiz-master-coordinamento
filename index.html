<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5bdb">
<title>Quiz Master Coordinamento</title>
<style>
:root{
  --bg:#eef1f6;--card:#ffffff;--txt:#16213a;--mut:#66708a;--bd:#e2e6ef;--soft:#f5f7fb;
  --acc:#3b5bdb;--acc2:#6d5dfc;--accbg:#e9edfb;
  --ok:#2b8a3e;--okbg:#e9f7ec;--ko:#c92a2a;--kobg:#fdeaea;--warn:#b7791f;--warnbg:#fff7e6;
  --sh:0 1px 2px rgba(20,30,60,.05),0 10px 30px rgba(20,30,60,.07);
  --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1420;--card:#171d2b;--txt:#e8ecf4;--mut:#98a2b8;--bd:#283148;--soft:#1e2536;
  --accbg:#222b48;--okbg:#17301f;--kobg:#3a1c1c;--warnbg:#3a2e14;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
button{font-family:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* testata */
.top{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:18px 0 54px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:20px;flex:0 0 auto}
.brand b{display:block;font-size:18px;line-height:1.2}
.brand small{display:block;opacity:.85;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 11px;font-size:12.5px;white-space:nowrap}

/* schede */
.tabs{margin-top:-36px;position:sticky;top:0;z-index:10}
.tabs .wrap>div{display:flex;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:5px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap>div::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:none;background:transparent;color:var(--mut);padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .15s,color .15s}
.tab svg{width:17px;height:17px;flex:0 0 auto}
.tab.on{background:var(--accbg);color:var(--acc)}
.tab .cnt{background:var(--ko);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px;font-weight:700}

main{padding:20px 0 40px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:16px}
.card.flat{box-shadow:none;border:1px solid var(--bd)}
h2{font-size:17px;margin:0 0 12px}
.small{font-size:13px;color:var(--mut)}
.note{background:var(--warnbg);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px}

/* selettore modalità */
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;margin-bottom:14px;max-width:100%}
.seg button{border:none;background:transparent;color:var(--mut);padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.modsel{margin:0 0 14px 8px;vertical-align:top}
@media (max-width:640px){.modsel{margin-left:0;width:100%}}

/* domanda */
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:8px}
.prog{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px;transition:width .3s}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--acc);background:var(--accbg);padding:3px 9px;border-radius:999px;margin-bottom:12px}
.q{font-size:19px;font-weight:650;margin:0 0 18px;line-height:1.4;overflow-wrap:anywhere}
.ans,.row .t{overflow-wrap:anywhere}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;overflow-wrap:anywhere;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font-size:15.5px;color:var(--txt);transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--soft)}
.opt:active:not(:disabled){transform:scale(.995)}
.opt .l{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft);color:var(--acc);border:1px solid var(--bd)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ko{background:var(--kobg);border-color:var(--ko)}
.opt.ko .l{background:var(--ko);color:#fff;border-color:var(--ko)}
.opt:disabled{cursor:default;opacity:.92}
.opt.dim{opacity:.55}
.fb{display:flex;align-items:center;gap:10px;font-weight:600;margin-top:14px;padding:11px 14px;border-radius:12px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.ko{background:var(--kobg);color:var(--ko)}
.fb.rev{background:var(--soft);color:var(--mut)}
.fb .k{font-weight:400;font-size:13px;margin-left:auto;white-space:nowrap}

/* pulsanti */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.bar .sp{flex:1}
.btn{border:none;background:var(--acc);color:#fff;padding:10px 18px;border-radius:11px;font-size:14.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.sec{background:var(--soft);color:var(--txt);border:1px solid var(--bd)}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.btn.danger{background:var(--ko)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
kbd{border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px;background:var(--soft);font-family:inherit}
.hint{font-size:12.5px;color:var(--mut);margin-top:10px}

/* fine giro */
.done{text-align:center;padding:36px 22px}
.done .big{font-size:52px;font-weight:800;color:var(--acc);line-height:1}
.done .bar{justify-content:center}

/* statistiche */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);box-shadow:var(--sh);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:26px;color:var(--acc)}.stat span{font-size:12.5px;color:var(--mut)}
.row{border-bottom:1px solid var(--bd);padding:13px 0}
.row:last-child{border:none}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--mut);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--kobg);color:var(--ko);font-weight:600}
.pill.g{background:var(--okbg);color:var(--ok)}
.pill.w{background:var(--warnbg);color:var(--warn)}
.ans{margin-top:6px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.ans .l{font-weight:700;min-width:18px}
.ans.g{color:var(--ok);font-weight:600}
.mbar{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.mbar:last-child{border:none}
.mbar .nm{flex:0 0 150px}
.mbar .tr{flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.mbar .tr i{display:block;height:100%;background:var(--ok)}
.mbar .pc{flex:0 0 120px;text-align:right;color:var(--mut);font-size:12.5px}
select,input[type=search]{padding:10px 12px;border:1px solid var(--bd);border-radius:11px;font-size:14px;background:var(--card);color:var(--txt);font-family:inherit}
details summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--acc);font-size:14px}
label.ans{cursor:pointer;padding:6px 8px;border-radius:8px}
label.ans:hover{background:var(--soft)}

/* flashcard */
.fc-wrap{perspective:1400px;margin-bottom:14px}
.fc{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.fc .back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--okbg),var(--card))}
.fc .q{margin:0}
.fc .tap{position:absolute;bottom:14px;left:0;right:0;font-size:12.5px;color:var(--mut)}
.fc .ansl{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:14px}
.fc .anst{font-size:18px;font-weight:600}

@media (max-width:640px){
  .top{padding:14px 0 50px}
  .brand small{max-width:52vw}
  .chips{display:none}
  .q{font-size:17px}.opt{font-size:15px;padding:11px 12px}
  .card{padding:18px;border-radius:14px}
  .tab{padding:9px 10px;font-size:13px}
  .tab span.lbl{display:none}
  .tab.on span.lbl{display:inline}
  .mbar .nm{flex-basis:90px}.mbar .pc{flex-basis:90px}
  .fc{min-height:260px}
  .fb{flex-wrap:wrap}.fb .k{margin-left:0;white-space:normal;flex-basis:100%}
  .bar #nextBtn{flex-basis:100%;justify-content:center}
  .bar .btn.danger,.fc-wrap+.bar .btn{flex:1;justify-content:center}
}
@media (hover:none) and (pointer:coarse){.hint{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="logo">Q</div><div><b>Quiz Master</b><small>Management per le funzioni di coordinamento</small></div></div>
  <div class="chips" id="chips"></div>
</div></header>
<nav class="tabs"><div class="wrap"><div id="tabs">
  <button class="tab on" data-v="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9z"/></svg><span class="lbl">Allenamento</span></button>
  <button class="tab" data-v="fc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 4h14v12"/></svg><span class="lbl">Flashcard</span></button>
  <button class="tab" data-v="errors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span class="lbl">Errori</span><span class="cnt" id="errcnt" hidden></span></button>
  <button class="tab" data-v="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg><span class="lbl">Sfoglia</span></button>
  <button class="tab" data-v="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span class="lbl">Da completare</span></button>
  <button class="tab" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="lbl">Statistiche</span></button>
</div></div></nav>
<main class="wrap">
<section id="v-train"></section>
<section id="v-fc" hidden></section>
<section id="v-errors" hidden></section>
<section id="v-browse" hidden></section>
<section id="v-todo" hidden></section>
<section id="v-stats" hidden></section>
</main>
<script>
const RAW = [{"id": 1, "s": "pan", "m": 1, "n": 1, "q": "Le norme di riferimento per i DPI sono sia il D.Lgs. 81/08 che il D.Lgs. 475/92:", "o": ["no, solo il D.Lgs. 81/08", "Si", "no, solo il D.Lgs. 475/92", "nessuna delle 2"], "a": 1}, {"id": 2, "s": "pan", "m": 1, "n": 2, "q": "In quante categorie possono essere suddivisi i DPI:", "o": ["3", "2", "1", "4"], "a": 0}, {"id": 3, "s": "pan", "m": 1, "n": 3, "q": "I DPI vanno utilizzati solo quando i rischi sono stati ridotti al minimo:", "o": ["no, solo dopo le misure di prevenzione collettiva", "Si", "no, solo per ridurre il Rischio residuo", "no, solo dopo le misure di protezione collettiva"], "a": 1}, {"id": 4, "s": "pan", "m": 1, "n": 4, "q": "Quale categoria dei DPI si riferisce a prodotti complessi contro rischi di morte o lesioni gravi e permanenti:", "o": ["3a", "2a", "1a", "4a"], "a": 0}, {"id": 5, "s": "pan", "m": 1, "n": 5, "q": "I DPI vengono scelti dal Datore di lavoro a sua completa discrezione:", "o": ["si", "no, in collaborazione con le altre figure preposte", "no solo con gli RLS", "No"], "a": 1}, {"id": 6, "s": "pan", "m": 1, "n": 6, "q": "I dispositivi di protezione individuale devono essere marcati CE:", "o": ["Sempre", "solo se privi di altri documenti informativi", "solo per alcuni rischi particolari", "solo se importati dall'estero"], "a": 0}, {"id": 7, "s": "pan", "m": 1, "n": 7, "q": "L'utilizzo dei DPI è prioritario rispetto all'utilizzo dei DPC(dispositivi di protezione collettiva):", "o": ["solo se disponibili", "sempre", "mai", "dipende dal tipo di dispositivi di protezione collettiva"], "a": 0}, {"id": 8, "s": "pan", "m": 1, "n": 8, "q": "La partecipazione a corsi di formazione ed addestramento nell'uso dei DPI, da parte dei lavoratori:", "o": ["è un obbligo dei lavoratori", "è un obbligo dei DDL", "è obbligatorio solo per gli RLS", "è un obbligatorio solo per i lavoratori che ne hanno segnalato deficienza"], "a": 0}, {"id": 9, "s": "pan", "m": 2, "n": 1, "q": "Esempio di costo diretto", "o": ["Costi salariali corrispondenti al tempo perso della vittima", "Costi per i premi pagati per l'assicurazione degli infortuni sul lavoro", "Spese relative all'assunzione di un sostituto temporaneo o definitivo", "Costi dei lavoratori in genere"], "a": 1}, {"id": 10, "s": "pan", "m": 2, "n": 2, "q": "Rapporto tra costi indiretti e costi diretti", "o": ["I costi indiretti sono di solito sempre inferiori ai costi diretti", "I costi indiretti non sono quantificabili", "I costi indiretti possono essere anche non quantificabili", "I costi indiretti generalmente possono variare da 2,5 a 4 volte i costi diretti"], "a": 3}, {"id": 11, "s": "pan", "m": 2, "n": 3, "q": "La metodologia SHIELD si fonda sul concetto di", "o": ["Costi diretti", "Costi indiretti", "Sia costi diretti che costi indiretti", "Costi sociali"], "a": 3}, {"id": 12, "s": "pan", "m": 2, "n": 4, "q": "Esempio di costo sociale", "o": ["Costo slalariale corrispondnete al tempo perso dei colleghi costretti ad interrompere il loro lavoro", "Spese relative all'assunzione di un sostituto temporaneo o definitivo", "Inquinamento", "Costo delle ore lavorative perse per infortunio"], "a": 3}, {"id": 13, "s": "pan", "m": 2, "n": 5, "q": "La riclassificazione dei costi per natura considera", "o": ["La prevenzione dei rischi", "Il fattore produttivo", "Il tipo di beni acquistati", "L'oggetto della spesa"], "a": 1}, {"id": 14, "s": "pan", "m": 2, "n": 6, "q": "Le imprese che adottano la politica di prevenzione a rischio zero sono", "o": ["Imprese ad alta affidabilità", "Imprese poco pericolose", "Imprese poco propense a pagare multe e sanzioni", "Imprese pubbliche"], "a": 0}, {"id": 15, "s": "pan", "m": 2, "n": 7, "q": "I costi sociali considerati nella metodologia SHIELD misurano il danno inferto", "o": ["All'impresa stessa", "Al management", "A nessuno", "A terze economie"], "a": 3}, {"id": 16, "s": "pan", "m": 2, "n": 8, "q": "Come lo Stato spinge il management aziendale a considerare i costi sociali nelle decisioni di politica aziendale", "o": ["Attraverso i premi", "Tramite le sanzioni", "Mediante contributi in conto esercizio e in conto capitale", "Non incentiva in nessun modo"], "a": 1}, {"id": 17, "s": "pan", "m": 2, "n": 9, "q": "SHIELD consente a consuntivo di calcolare", "o": ["I costi totali effettivi della sicurezza", "I costi nascosti", "I costi fissi", "I costi variabili"], "a": 0}, {"id": 18, "s": "pan", "m": 2, "n": 10, "q": "Il market failure determina i", "o": ["Rischi d'impresa", "Rischi non di mercato", "Rischi ambientali", "Rischi sociali"], "a": 1}, {"id": 19, "s": "pan", "m": 3, "n": 1, "q": "La capacità di stimare il livello di SSL dovrebbe essere competenza di", "o": ["Esclusivamente economisti", "Del management", "Dei lavoratori", "Di tutti coloro che promuovono SSL"], "a": 3}, {"id": 20, "s": "pan", "m": 3, "n": 2, "q": "La valutazione economica oltre ad evidenziare i benefici finanziari considera anche", "o": ["I benefici intangibili", "I benefici occulti", "I benefici patrimoniali", "I benefici finanziari"], "a": 0}, {"id": 21, "s": "pan", "m": 3, "n": 3, "q": "I metodi moderni per misurare il rendimento aziendale", "o": ["Non cercano di definire e di misurare gli indicatori che contribuiscono al successo di un'azienda", "Cercano di definire e di misurare gli indicatori finanziari", "Considerano il cash flow come indice significativo di valutazione", "Cercano di definire e di misurare gli indicatori che contribuiscono al successo di un'azienda"], "a": 3}, {"id": 22, "s": "pan", "m": 3, "n": 4, "q": "Le analisi di costi-benefici", "o": ["Non includono né esplicitamente né implicitamente il dolore e la sofferenza", "Includono esplicitamente dolore e sofferenza", "Non sono facilmente attuabili", "Comprendono implicitamente il dolore e la sofferenza"], "a": 3}, {"id": 23, "s": "pan", "m": 3, "n": 5, "q": "Nella fase del reperimento dati c.d. fase 3 se possibile è importante", "o": ["Reperire sempre nuovi dati", "Usare i dati esistenti", "Utilizzare esclusivamente stime", "Non usare le informazioni in possesso"], "a": 1}, {"id": 24, "s": "pan", "m": 3, "n": 6, "q": "Nella fase di valutazione e calcoli c.d. fase 4 la valutazione economica porta a", "o": ["Dare un valore in denaro alle variabili e ai dati", "Esprimere il valore solo dei beni che hanno un mercato", "Escludere i beni senza mercato", "Escludere le variabili per le quali non è immediato avere un valore in denaro"], "a": 0}, {"id": 25, "s": "pan", "m": 3, "n": 7, "q": "L'indice ritorno degli investimenti", "o": ["È pari a zero quando le perdite sono coincidenti con gli utili", "Esprime il tempo necessario per quantificare gli investimenti iniziali", "Non viene mai utilizzato perché di difficile quantificazione", "È il tempo necessario perché gli utili compensino gli investimenti iniziali"], "a": 3}, {"id": 26, "s": "pan", "m": 3, "n": 8, "q": "Gli incentivi in ambito di SSL sono", "o": ["Premi in denaro", "Sconti su costi da sostenere", "Processi che premiano le organizzazioni che sviluppano e mantengono un ambiente di lavoro sano e sicuro", "Premi sia in denaro che in natura"], "a": 2}, {"id": 27, "s": "pan", "m": 3, "n": 9, "q": "La strategia di Lisbona consiste", "o": ["Nel dare maggiore importanza all'occupazione", "Nel dare la stessa importanza all'aumento dell'occupazione e della produttività attraverso una maggiore competitività", "Nel dare poco importanza alla produttività purché si raggiunga un buon livello di occupazione e SSL", "Nell'attribuire contributi in conto capitale a fondo perduto"], "a": 1}, {"id": 28, "s": "pan", "m": 3, "n": 10, "q": "Piccole e medie imprese", "o": ["Ad oggi ancora non ritengono che esistano effettivi vantaggi economici in tema di SSL", "Sono indifferenti ai vantaggi derivanti dal sistema SSL poiché danno maggiore importanza ai costi da sostenere", "Non applicano a livello normativo il sistema di SSL", "Cominciano a riconoscere con favore i vantaggi legati all'attuazione di una buona strategia di SSL"], "a": 3}, {"id": 29, "s": "pan", "m": 4, "n": 1, "q": "In base all'art. 38 del D.Lgs 81/2008, può esercitare tra gli altri attività di medico competente, il medico in possesso di:", "o": ["Specializzazione in specializzazione in igiene e medicina preventiva o in medicina legale, senza ulteriori percorsi formativi", "Docenza in medicina legale e criminologia", "Specializzazione in specializzazione in igiene e medicina preventiva o in medicina legale, previa frequenza di appositi percorsi formativi universitari", "Specializzazione in medicina fisica e riabilitativa"], "a": 2}, {"id": 30, "s": "pan", "m": 4, "n": 2, "q": "In base all'art. 25 del D.Lgs 81/2008, è un obbligo del medico competente", "o": ["La redazione del Documento di Valutazione dei rischi", "La sorveglianza fisica dei lavoratori radioesposti", "La nomina del rappresentante del servizio di prevenzione e protezione", "La collaborazione con il datore di lavoro e con il servizio di prevenzione e protezione alla valutazione dei rischi, anche ai fini della programmazione, ove necessario, della sorveglianza sanitaria"], "a": 3}, {"id": 31, "s": "pan", "m": 4, "n": 3, "q": "Secondo l'art.35 del D.Lgs 81/2008 devono essere presenti alla riunione periodica", "o": ["Il datore di lavoro o un suo rappresentante, il responsabile del servizio di prevenzione e protezione dai rischi, il medico competente, ove nominato, e il rappresentante dei lavoratori per la sicurezza", "Solo il datore di lavoro e il medico competente", "Il datore di lavoro, il medico competente e almeno 5 lavoratori", "Il datore di lavoro, il medico competente e almeno un addetto al servizio di prevenzione e protezione dai rischi"], "a": 0}, {"id": 32, "s": "pan", "m": 4, "n": 4, "q": "La sorveglianza sanitaria (ex art.41 D.Lgs 81/08)", "o": ["Deve essere sempre svolta anche in assenza di rischi", "E' svolta, tra l'altro, quando il lavoratore ne faccia richiesta e tale domanda sia ritenuta dal medico competente correlata ai rischi lavorativi", "Può essere richi e di Operatori Turistici"], "a": 1}, {"id": 42, "s": "pan", "m": 5, "n": 4, "q": "Il primo Codice di Etica per Operatori della Medicina del Lavoro è stato approvato nel:", "o": ["1980", "1991", "1954", "2005"], "a": 1}, {"id": 43, "s": "pan", "m": 5, "n": 5, "q": "La prima riunione per la redazione di un Codice di Etica per Operatori della Medicina del Lavoro si è tenuta nel 1987 a:", "o": ["Sidney", "Milano", "Parigi", "Berna"], "a": 0}, {"id": 44, "s": "pan", "m": 5, "n": 6, "q": "L'importanza e l'affidabilità del Codice Etico dell'ICOH sono state infine riconosciute dal nostro legislatore che ne fa esplicita menzione nel:", "o": ["D.Lgs 277/91", "D.Lgs 303/56", "art.4 del D.Lgs 626/94", "art. 39 del D. Lgs 81/2008"], "a": 3}, {"id": 45, "s": "pan", "m": 5, "n": 7, "q": "La struttura del Codice etico per OML è composta da:", "o": ["prefazione, introduzione e sintesi", "sommario, Introduzione e 35 principi fondamentali", "prefazione, introduzione, doveri e compiti degli operatori di Medicina del Lavoro, condizioni di svolgimento delle funzioni degli operatori di Medicina del Lavoro'", "diritti e doveri degli OML"], "a": 2}, {"id": 46, "s": "pan", "m": 5, "n": 8, "q": "Secondo il punto 1 dei 'Doveri e compiti degli operatori di medicina del lavoro':", "o": ["obiettivo primario della Medicina del Lavoro è quello di salvaguardare e promuovere la salute dei lavoratori, in un ambiente di lavoro sicuro e non nocivo e di proteggerne le capacità lavorative e l'accesso al mondo del lavoro", "obiettivo primario della Medicina del Lavoro è far lavorare sempre tutti", "obiettivo primario della Medicina del Lavoro è portare esclusivamente gli interessi dei datori di lavoro", "obiettivo primario della Medicina del Lavoro è far diminuire il tasso di disoccupazione"], "a": 0}, {"id": 47, "s": "pan", "m": 5, "n": 9, "q": "La terza ed ultima parte del Codice di Etica è intitolata 'Condizioni di svolgimento delle funzioni degli operatori di Medicina del Lavoro' comprende i punti da:" viour, ruled-based behavior, knowledge- based behaviour", "skill-based behaviour, ruled-based behavior", "skill-based behaviour, near misses"], "a": 1}, {"id": 52, "s": "pan", "m": 6, "n": 4, "q": "Come si definisce il rischio clinico:", "o": ["la probabilità che un paziente sia vittima di un evento avverso, cioè subisca un qualsiasi danno o disagio imputabile, anche se in modo involontario, alle cure mediche prestate durante il periodo di degenza, e che sia causa di un prolungamento di tale periodo, di un peggioramento delle condizioni di salute o della morte", "La probabilità che un paziente sia vittima di un evento avverso", "La probabilità che un paziente sia vittima di un evento avverso, cioè subisca un qualsiasi danno o disagio imputabile", "la probabilità che un paziente sia vittima di un evento avverso, cioè che sia causa di un prolungamento di tale periodo, di un peggioramento delle condizioni di salute o della morte"], "a": 0}, {"id": 53, "s": "pan", "m": 6, "n": 5, "q": "Quali sono gli ambiti di rischio nelle organizzazioni sanitarie:", "o": ["sicurezza del paziente, sicurezza del personale, sicurezza delle emergenze esterne", "sicurezza del personale, sicurezza delle emergenze esterne; sicurezza degli ambienti e attrezzature; rischi finanziari per danni alle persone", "sicurezza del paziente, sicurezza del personale, sicurezza delle emergenze esterne; sicurezza degli ambienti e attrezzature; rischi finanziari per danni alle persone", "sicurezza del paziente e del personale"], "a": 2}, {"id": 54, "s": "pan", "m": 6, "n": 6, "q": "Quali sono i metodi di analisi del rischio:", "o": ["La FMEA (Failure Mode Effects Analysis, tradotto \"Analisi dei modi e degli effetti dei guasti\") e l'audit", "la FMEA (Failure Mode Effects Analysis, tradotto \"Analisi dei modi e degli effetti dei guasti\") e la FMECA (Failure Mode Effects and Criticality Analysis", "L'incident reporting e la FMECA (Failure Mode Effects and Criticality Analysis", "la FMEA e la FECA"], "a": 1}, {"id": 55, "s": "pan", "m": 6, "n": 7, "q": "Cosa si intende per errore \" Knowledge-based behaviour\":", "o": ["si tratta di comportamenti messi in atto quando ci si trova davanti ad una situazione sconosciuta e si deve attuare un piano per superarla. È la situazione che richiede il maggior impiego di conoscenza e l'attivazione di una serie di processi mentali che dai simboli porteranno all'elaborazione di un piano per raggiungere gli obiettivi", "si mettono in atto dei comportamenti, prescritti da regole, che sono state definite in quanto ritenute più idonee da applicare in una particolare circostanza. Il problema che si pone all'individuo è di identificare la giusta norma per ogni specifica situazione attenendosi ad un modello mentale di tipo causale", "sono comportamenti automatici ad una data situazione. All'individuo si propone uno stimolo cui reagisce meccanicamente senza porsi problemi d'interpretazione della situazione stessa. Tale abilità si sviluppa dopo che lo stimolo si è ripetuto per più volte, sempre allo stesso modo. È un tipo di comportamento riscontrabile in situazioni di routine", "si tratta di comportamenti messi in atto quando ci si trova davanti ad una situazione che richiede il maggior impiego di conoscenza e l'attivazione di una serie di processi mentali che dai simboli porteranno all'elaborazione di un piano per raggiungere gli obiettivi"], "a": 0}, {"id": 56, "s": "pan", "m": 6, "n": 8, "q": "Secondo Reason, cosa sono gli errori latenti:", "o": ["che provocano immediate conseguenze, dagli errori latenti(latent failure)", "errori latenti: non tutti gli errori latenti producono un errore attivo, né tutti gli errori provocano un danno.", "errori latenti: non tutti gli errori latenti producono un errore attivo, né tutti gli errori provocano un danno. Infatti, perché il danno si verifichi, devono sussistere condizioni tali da permettere all'erro re di superare tutte le barriere di sicurezza tecniche e organizzative predisposte all'interno della struttura per contenere gli effetti di possibili errori", "errori latenti: non tutti gli errori latenti permettono di superare tutte le barriere di sicurezza tecniche e organizzative predisposte all'interno della struttura per contenere gli effetti di possibili errori"], "a": 2}, {"id": 57, "s": "pan", "m": 6, "n": 9, "q": "Gli approcci reattivi maggiormente utilizzati comprendono", "o": ["incident reporting, utilizzo dei dati amministrativi ed informativi, indizi, review, Root Cause Analysis", "incident reporting, review, Root Cause Analysis", "incident reporting, utilizzo dei dati amministrativi ed informativi, indizi, review", "incident reporting"], "a": 0}, {"id": 58, "s": "pan", "m": 6, "n": 10, "q": "Quali sono le fasi di valutazione del rischio:", "o": ["analisi dei processi e delle attività, identificazione delle situazioni pericolose e dei modi di errore possibili, stima della probabilità di occorrenza dell'errore e della gravità del danno, valutazione", "analisi dei processi e delle attività, stima della probabilità di occorrenza dell'errore e della gravità del danno, valutazione", "identificazione delle situazioni pericolose e dei modi di errore possibili, stima della probabilità di occorrenza dell'errore e della gravità del danno, valutazione", "stima della probabilità di occorrenza dell'errore e della gravità del danno, valutazione"], "a": 0}, {"id": 59, "s": "pan", "m": 7, "n": 1, "q": "Cosa si intende per \"gestione del rischio clinico:", "o": ["la gestione del rischio clinico (\"clinical risk management\") è uno strumento della Clinical Governance per garantire la sicurezza del paziente e migliorare la qualità dell'assistenza attraverso un processo sistematico di identificazione, valutazione e trattamento dei rischi attuali e potenziali connessi al trattamento sanitario", "la gestione del rischio clinico e migliorare la qualità dell'assistenza attraverso un processo sistematico di identificazione, valutazione e trattamento dei rischi attuali e potenziali connessi al trattamento sanitario", "la gestione del rischio clinico è uno strumento della Clinical Governance per garantire la sicurezza del paziente e migliorare la qualità dell'assistenza attraverso un processo sistematico di identificazione, valutazione e trattamento dei rischi attuali e potenziali connessi al trattamento sanitario", "la gestione del rischio clinico garantisce la sicurezza del paziente e migliorare la qualità dell'assistenza attraverso un processo sistematico di identificazione e trattamento dei rischi attuali e potenziali connessi al trattamento sanitario"], "a": 0}, {"id": 60, "s": "pan", "m": 7, "n": 2, "q": "Quali sono gli errori dei processi cognitivi di controllo sui comportamenti umani:", "o": ["la teoria del fattore umano considera gli errori quali fallimenti dei processi cognitivi di controllo sui comportamenti umani che sono di tre livelli: skill-based (abilità automatiche), rule-based (conoscenze di regole), knowledge-based (capacità di interpretazione di situazioni nuove)", "la teoria del fattore umano considera gli errori quali fallimenti dei processi cognitivi di controllo sui comportamenti umani che sono di tre livelli", "La teoria del fattore umano considera gli errori quali fallimenti dei processi cognitivi di controllo sui comportamenti umani che sono skill-based (abilità automatiche) e rule-based (conoscenze di regole)", "la teoria del fattore umano considera gli errori quali fallimenti dei processi cognitivi di controllo sui comportamenti umani"], "a": 0}, {"id": 61, "s": "pan", "m": 7, "n": 3, "q": "Quali sono le fasi dei processi di gestione del rischio clinico:", "o": ["valutazione (Clinical Audit, Root Cause Analysis, Failure Mode and Effects Analysis); trattamento (tecniche di miglioramento continuo); monitoraggio (analisi di flussi informativi, indicatori di performance)", "trattamento (tecniche di miglioramento continuo); monitoraggio (analisi di flussi informativi, indicatori di performance)", "identificazione zione di un evento avverso parte da una situazione di pericolo (hazard) per il paziente (accident)"], "a": 0}, {"id": 65, "s": "pan", "m": 7, "n": 7, "q": "In quante fasi si sviluppa la gestione del rischio clinico:", "o": ["identificazione, attivazione di un sistema di controllo, proposte di progressivo miglioramento", "identificazione, impostazione e applicazione di misure di prevenzione, attivazione di un sistema di controllo, proposte di progressivo miglioramento", "identificazione, impostazione e applicazione di misure di prevenzione", "identificazione, impostazione e attivazione di un sistema di controllo"], "a": 1}, {"id": 66, "s": "pan", "m": 7, "n": 8, "q": "Nell'ottica di ridurre gli errori è necessario:", "o": ["individuare un modello organizzativo uniforme per la gestione del rischio clinico, elaborare direttive e Linee guida per la rilevazione uniforme degli errori e dei rischi di errori nelle strutture sanitarie, promuovere eventi di formazione per diffondere la cultura della prevenzione dell'errore, promuovere la segnalazione dei near misses", "individuare un modello organizzativo uniforme per la gestione del rischio clinico, elaborare direttive e Linee guida per la rilevazione uniforme degli errori e dei rischi di errori nelle strutture sanitarie", "elaborare direttive e Linee guida per la rilevazione uniforme degli errori e dei rischi di errori nelle strutture sanitarie, promuovere eventi di formazione per diffondere la cultura della prevenzione dell'errore, promuovere la segnalazione dei near misses", "individuare un modello organizzativo uniforme"], "a": 0}, {"id": 67, "s": "pan", "m": 7, "n": 9, "q": "Quali caratteristiche dovrebbe avere l'UGR:", "o": ["la composizione della Unità di Gestione di Rischio (UGR), di cui si raccomanda l'istituzione in ogni struttura sanitaria, dovrebbe prevedere la presenza di un gruppo multidisciplinare", "la composizione della Unità di Gestione di Rischio (UGR), di cui si raccomanda l'istituzione in ogni struttura sanitaria, dovrebbe prevedere la presenza di un gruppo multidisciplinare e multiprofessionale", "la composizione della Unità di Gestione di Rischio (UGR), di cui si raccomanda l'istituzione in ogni struttura sanitaria, dovrebbe prevedere la presenza di un medico legale", "la composizione della Unità di Gestione di Rischio (UGR) dovrebbe prevedere la presenza di un gruppo prettamente medico"], "a": 1}, {"id": 68, "s": "pan", "m": 7, "n": 10, "q": "Cosa si intende per FMEA:", "o": ["la \"Failure Mode and Effects Analysis\" (FMEA)è invece un metodo sistematico per identificare e prevenire problemi nei processi assistenziali prima che questi si verifichino", "la \"Failure Mode and Effects Analysis\" (FMEA)è invece un metodo sistematico per identificare e prevenire problemi nei processi assistenziali", "la \"Failure Mode and Effects Analysis\" (FMEA)è invece un metodo sistematico per identificare e prevenire problemi nei processi assistenziali prima che questi si verifichino (pro-attività e valutazione del rischio)", "la \"Failure Mode and Effects Analysis\" (FMEA)è invece un metodo di report del rischio"], "a": 2}, {"id": 69, "s": "pan", "m": 8, "n": 1, "q": "La Legge n. 3 del 2018 (cd. \"Legge Lorenzin2\"):", "o": ["costituisce una riforma organica in ambito sanitario, intervenendo su diversi ambiti tra i quali si segnalano, in particolare, le professioni sanitarie, il riconoscimento di nuove professioni, nonché la sperimentazione clinica dei medicinali", "è un intervento limitato al riordino delle professioni sanitarie già esistenti", "ha depenalizzato il reato di esercizio abusivo della professione in ambito sanitario", "ha liberalizzato l'attività del farmacista, assimilandola a qualunque altra attività economica"], "a": 0}, {"id": 70, "s": "pan", "m": 8, "n": 2, "q": "Il Centro di coordinamento nazionale dei comitati etici territoriali:", "o": ["è una istituzione già esistente al momento dell'entrata in vigore della riforma Lorenzin", "è un ente posto alle dipendenze del Ministero della Salute", "è un ente istituito presso l'AIFA con il compito di coordinare, monitorare e indirizzare l'attività dei comitati etici territoriali", "è un ente soppresso dalla legge n. 3 del 2018"], "a": 2}, {"id": 71, "s": "pan", "m": 8, "n": 3, "q": "Gli Ordini professionali", "o": ["sono associazioni di categoria rappresentative delle professioni, aventi personalità giuridica e natura di pubblicistica", "sono enti pubblici economici, rappresentativi della singola categoria professionale, che partecipano alla contrattazione pubblica e con funzioni consultive", "sono enti ausiliari dello Stato posti a tutela delle categorie professionali rappresentate", "sono enti pubblici non economici che agiscono quali organi sussidiari dello Stato al fine di tutelare gli interessi pubblici, garantiti dall'ordinamento, connessi all'esercizio professionale"], "a": 3}, {"id": 72, "s": "pan", "m": 8, "n": 4, "q": "La \"medicina di genere\"", "o": ["costituisce una pratica discriminatoria espressamente vietata dalla riforma Lorenzin", "costituisce un approccio terapeutico che prescinde dalle differenze di sesso e genere", "è un piano, previsto dalla riforma Lorenzin, finalizzato a garantire la qualità, l'appropriatezza e l'omogeneità delle prestazioni erogate dal Servizio Sanitario Nazionale su tutto il territorio nazionale, mediante divulgazione, formazione e indicazione di pratiche sanitarie inerenti alla ricerca, alla prevenzione, alla diagnosi e alla cura basate sulle differenze derivanti dal sesso e dal genere", "è un protocollo terapeutico sconsigliato dall'Istituto Superiore di Sanità"], "a": 2}, {"id": 73, "s": "pan", "m": 8, "n": 5, "q": "L'istituzione di nuove professioni sanitarie", "o": ["è espressamente vietata dalla riforma Lorenzin", "è conseguenza immediata e diretta dei fabbisogni connessi agli obiettivi di salute previsti nel Piano sanitario nazionale o nei Piani sanitari regionali", "può avvenire nel rispetto dei princìpi fondamentali stabiliti dalla legge 43 del 2006 e previo parere tecnico- scientifico del Consiglio Superiore di Sanità, mediante uno o più accordi, sanciti in sede di Conferenza Stato- Regioni ai sensi dell'art. 4 del D Lgs. 281/1997, e recepiti con decreti del Presidente della Repubblica, previa deliberazione del Consiglio dei Ministri", "può avvenire anche su iniziativa delle associazioni professionali rappresentative di coloro che intendono ottenere tale riconoscimento e, in tal caso, la legge prevede un iter agevolato."], "a": 2}, {"id": 74, "s": "pan", "m": 8, "n": 6, "q": "L'osteopata e il chiropratico", "o": ["sono professioni sanitarie istituite dalla legge n. 3 del 2018", "sono professioni sanitarie previste dal decreto legislativo del Capo provvisorio dello Stato n. 233 del 13 settembre 1946", "sono arti sanitarie ausiliarie", "sono professioni istituite unitamente al R.D.31.05.1928, n. 1334, unitamente al Massaggiatore capo bagnino stabilimenti idroterapici"], "a": 0}, {"id": 75, "s": "pan", "m": 8, "n": 7, "q": "L'esercente la professione sanitaria", "o": ["non è mai civilmente responsabile per gli illeciti compiuti nell'esercizio dell'attività professionale, nenche in caso di dolo o colpa grave", "è esposto all'azione di responsabilità amministrativa della struttura sanitaria, in caso di dolo o colpa grave, a seguito dell'avvenuto risarcimento, in virtù di un titolo giudiziale o stragiudiziale ed entro un anno dall'avvenuto pagamento", "non è mai responsabile per i danni cagionati nell'espletamento della propria attività professionale se coperto da polizza assicurativa", "può essere condannato per responsabilità amministrativa ad una somma non superiore al quadruplo del valore maggiore della retribuzione lorda o del corrispettivo convenzionale conseguito nell'anno di inizio della condotta causa dell'evento o nell'anno immediatamente precedente o successivo"], "a": 1}, {"id": 76, "s": "pan", "m": 8, "n": 8, "q": "La riforma Lorenzin ha modificato l'art. 348 c.p. che disciplina l'esercizio abusivo di una professione:", "o": ["prevedendo la pubblicazione della sentenza di condanna e la confisca delle cose che servirono o furono destinate a commettere il reato, nonché la trasmissione, nel caso in cui il soggetto che ha commesso il reato eserciti regolarmente una professione o un'attività, al competente Ordine, Albo o Registro per l'interdizione da 1 a 3 anni dalla professione o attività regolarmente esercitata", "prevedendo che la pena sia attenuata in caso di possesso dei titoli abilitanti all'esercizio della professione, pur in mancanza dell'iscrizione all'albo professionale di appartenenza.", "derubricando la fattispecie in reato contravvenzionale, punito unicamente con pena pecuniaria", "prevedendo che tale reato sia punito con la reclusione da tre mesi a sei anni e la multa da 15.000 a 100.000 euro"], "a": 0}, {"id": 77, "s": "pan", "m": 8, "n": 9, "q": "La riforma Lorenzin ha istituito:", "o": ["l'Ordine delle Professioni ed Arti ausiliarie, tecniche, della riabilitazione e della prevenzione", "l'Ordine dei tecnici sanitari di radiologia medica e delle professioni sanitarie ausiliarie", "l'Ordine delle professioni sanitarie della prevenzione, della riabilitazione e tecnico-sanitarie", "l'ordine dei tecnici sanitari di radiologia medica e delle professioni sanitarie tecniche, della riabilitazione e della prevenzione"], "a": 3}, {"id": 78, "s": "pan", "m": 8, "n": 10, "q": "Gli accordi istitutivi di nuove professioni sanitarie dovranno individuare:", "o": ["il titolo professionale, l'ambito di attività di ciascuna professione, i criteri di valutazione dell'esperienza professionale, i criteri per il riconoscimento dei titoli equipollenti", "il titolo professionale, le eventuali attività esercitabili da più profili professionali, i criteri di valutazione dell'esperienza professionali, i criteri per il riconoscimento dei titoli equipollenti", "il titolo professionale, l'ambito di attività di ciascuna professione, i criteri di valutazione dell'esperienza professionale, i criteri per il riconoscimento dei titoli equivalenti", "l'istituzione di uno specifico corso di laurea, l'ambito di attività di ciascuna professione, i criteri di valutazione dell'esperienza professionali, i criteri per il riconoscimento dei titoli equipollenti"], "a": 0}, {"id": 79, "s": "pan", "m": 9, "n": 1, "q": "Allo stato dell'arte, l'art. 32, co. 1, Cost., è inteso come:", "o": ["norma programmatica per il legislatore", "mero diritto sociale ad essere curati", "diritto composito tra diritto di libertà e diritto di \"credito\"", "diritto al benessere esclusivamente fisico"], "a": 2}, {"id": 80, "s": "pan", "m": 9, "n": 2, "q": "L'attuale interpretazione dell'art. 32, co. 2, Cost. ha sancito:", "o": ["la concezione paternalistica del rapporto sanitario-paziente", "l'autoderdeterminazione terapeutica", "ruolo paritario tra medico e paziente per la scelta del trattamento sanitario", "la scelta del trattamento sanitario spetta esclusivamente all'operatore sanitario"], "a": 1}, {"id": 81, "s": "pan", "m": 9, "n": 3, "q": "La liceità del trattamento sanitario trova il proprio fondamento giuridico nel:", "o": ["articolo 50 - consenso dell'avente diritto", "articolo 51 - esercizio del diritto o adempimento del dovere", "articolo 54 - stato di necessità", "adempimento del dovere con il presupposto del consenso informato"], "a": 3}, {"id": 82, "s": "pan", "m": 9, "n": 4, "q": "Il consenso espresso dal paziente per considerarsi informato deve essere incentrato su:", "o": ["effetti del trattamento", "diagnosi, mezzi terapeutici disponibili, rischi della terapia ed effetti del trattamento", "rischi della terapia a cui va in corso", "sommarie informazioni del trattamento sanitario"], "a": 1}, {"id": 83, "s": "pan", "m": 9, "n": 5, "q": "In caso di incapacità del paziente, l'espressione del consenso spetta:", "o": ["al paziente incapace se è idoneo a provvedere ai propri interessi in base alla natura della decisione che egli è chiamato ad assumere", "sempre al suo legale rappresentante", "al professionista sanitario", "al paziente incapace previo accordo con il rappresentante legale"], "a": 0}, {"id": 84, "s": "pan", "m": 9, "n": 6, "q": "Secondo la dottrina maggioritaria, la responsabilità per difetto di informazione si verifica:", "o": ["quando l'obbligo di informazione viene compiuto in una fase antecedente all'eseguirsi del trattamento sanitario", "quando non si è assolto all'obbligo di informazione, ma il trattamento sanitario è perfettamente riuscito", "quando, pur rispettando l'obbligo di informazione, il trattamento sanitario non è perfettamente riuscito", "quando il paziente è stato informato di tutti i rischi/benefici e il trattamento sanitario è stato correttamente eseguito"], "a": 1}, {"id": 85, "s": "pan", "m": 9, "n": 7, "q": "In relazione al principio del consenso, il rifiuto del trattamento sanitario è:", "o": ["l'estrinsecazione in chiave negativa delle medesime coordinate normative", "il principio contrario che si legittima per coordinate normative contrarie a quelle del consenso", "distinto ed autonomo e non ha alcuna correlazione", "altrimenti detto \"abbandono terapeutico\""], "a": 0}, {"id": 86, "s": "pan", "m": 9, "n": 8, "q": "In caso di rifiuto di trattamento sanitario della madre in favore del concepito, se l'intervento medico è pregiudizievole per la salute della madre prevale:", "o": ["la volontà del madre a preferire la salute del concepito", "la discrezionalità del medico", "prevale il diritto alla salute della madre", "prevale sempre e comunque il diritto alla salute del concepito"], "a": 2}, {"id": 87, "s": "pan", "m": 9, "n": 9, "q": "Secondo una recente evoluzione giurisprudenziale, la legittimità del rifiuto sanitario del paziente in condizioni di incoscienza si rinviene:", "o": ["nel potere di rappresentanza del tutore", "nella volontà del paziente", "nella valutazione del professionista sanitario", "nel \"best interest\", come volontà presunta del paziente"], "a": 3}, {"id": 88, "s": "pan", "m": 9, "n": 10, "q": "Con la \"soggettivizzazione\" della valutazione medico- sanitaria, sancita in dottrina e giurisprudenza, il controllo dell'operatore sanitario deve essere:", "o": ["ex post, inteso come corretto espletamento del trattamento sanitario", "ex ante, incentrato sulla corretta manifestazione del consenso e dei presupposti legislativi", "completamente assente", "orientato in relazione ad una propria autonomia decisionale"], "a": 1}, {"id": 89, "s": "pan", "m": 10, "n": 1, "q": "Lo Stato è intervenuto legislativamente nel tentativo di creare un sistema sanitario pubblico, incontrando come ostacoli:", "o": ["Le condizioni sociali ed economiche del Paese, le carenti condizioni igienico sanitarie ed un inesistente sostegno pubblico della Sanità, che hanno reso vano il tentativo dello Stato di costruire un sistema sanitario strutturato", "L'inadeguatezza delle condizioni sociali, economiche ed igienico-sanitarie del Paese, evidenziando l'inesistenza dell'assistenza sanitaria pubblica. I Governi del tempo, presieduti prima da Crispi e poi da Giolitti, iniziarono a strutturare una parvenza di intervento statale, istuendo Uffici e Servizi di sanità pubblica, tuttavia sempre minoritario e succedaneo a quello dei privati, garantendo una limitata assistenza alla popolazione", "Un poco strutturata sistema sanitario, sul quale, con adeguati interventi legislativi, lo Stato è intervenuto i modo organico, creando i presupposti per un sistema sanitario, fondato sull'assistenza, prevenzione e cura", "L'arretratezza delle condizioni socio-economiche del Paese, che hanno impedito un intervento legislativo efficace, che desse impulso alla formazione di un sistema saniario di tipo assistenzialistico"], "a": 1}, {"id": 90, "s": "pan", "m": 10, "n": 2, "q": "L'intervento pubblico, prima dell'istituzione del regime fascista, si era limitato alla applicazione del T.U. n. 636/1907, non riuscendo a dare organicità al Sistema. Il Fascimo ha dato un nuovo impulso a tale azione attaverso:", "o": ["Un intervento di riordino e riorganizzazione della legislazione sanitaria, finalizzati a fornire assistenza alle categorie meno tutelate (infanzia, maternità, figli illegittimi abbandonati), per poi approvare il T.U. delle Leggi Sanitarie, su proposta di Mussolini, coordinanando le norme esistenti e a ristrutturando il comparto della sanità pubblica, con interventi in favore dei lavoratori, creando Enti mutualistici (come INPS, INAM, ENPDAP, IPAB) ed adottando una politica garantista dei luoghi di lavoro, lasciando notevole spazio alla beneficenza privata", "La ristrutturazione del Sistema Sanitario e l'introduzione di nuove norme ed un'adeguata applicazione del T.U. n. 636/1907", "La creazione di una Sanità pubblica fondata sulle Mutue private e Enti di assistenza pubblici", "La riorganizzazione della Sanità pubblica, con l'abbandono parziale dell'intervento privato e della Chiesa in materia di assistenza e cura a favore di un forte intervento statale, con un forte contributo finanziario"], "a": 0}, {"id": 91, "s": "pan", "m": 10, "n": 3, "q": "Dopo il secondo conflitto mondiale, la Riforma dell'ordinamento sanitario nasce da:", "o": ["Una compiuta organizzazione del sistema sanitario pubblico che fonda le sue radici nel riconoscimento del diritto alla salute come principio consacrato nell'art. 32 della Costituzione Italiana", "Le criticità evidenziate nel periodo pre-bellico, che hanno indotto lo Stato ad intervenire sull'impianto legislativo esistente per ristrutturare tutta la sanità, partendo proprio dalla Carta costituzionale del 1948, individuando nell'art. 117 della stessa i principi fondamentali per decentrare competenze e funzioni", "Una profonda riorganizzazione della Sanità pubblica, che passa dal primario riconoscimento della salute quale diritto fondamentale dell'individuo ed interesse della collettività, consacrati nel combinato disposto dagli art. 32 e 117 della Costituzione Italian, che attribuisce alle Regioni un ruolo primario all'interno del sistema sanitario, in appilcazione al decentramento politico e amministrativo", "La necessità di adeguare la sanità pubbliche al nuovo contesto politico, sociale ed economico del Paese"], "a": 2}, {"id": 92, "s": "pan", "m": 10, "n": 4, "q": "Con la L. n. 296/1958, il nostro legislatore, nel prendere atto della disorganizzazione e delle carenze evidenziate dal servizio sanitario, ha istituito:", "o": ["L'Alto Commissariato per l'Igiene e la Sanità Pubblica, in modo da sotrarre tutta la materia sanitaria al Ministero dell'Interno, attribuendo a tale organismo la tutela della salute pubblica, lnonchè il compito di coordinare e vigilare sulle organizzazioni sanitarie e sugli enti mutualistici cui era assegnata la funzione di contrastare e prevenire le malattie sociali", "Il Ministero della Sanità e l'Alto Commissariato per l'Igiene e la Sanità Pubblica, in modo da sotrarre tutta la materia sanitaria al Ministero dell'Interno, centralizzando sul primo la potestà legislativa in materia sanitaria e attribuendo al secondo l'azione esecutiva in ambito igienico-sanitario", "Il Ministero della Sanità, coadiuvato dall'Alto Commissariato per l'Igiene e la Sanità Pubblica, dal Consiglio superiore di sanità e dall'Istituto superiore di sanità, ripartendo, tra gli stessi, ruoli, funzioni e competenze", "Il Ministero della Sanità, riunendo in questa unica struttura ministeriale le competenze dell'Alto Commissariato e delle altre amministrazioni centrali preposte alla sanità pubblica, coadiuvato nelle sue funzioni, in ambito nazionale, dal Consiglio superiore di sanità e dall'Istituto superiore di sanità, ed in quello periferico dal Medico Provinciale e dagli Ufficiali sanitari comunali"], "a": 3}, {"id": 93, "s": "pan", "m": 10, "n": 5, "q": "La Riforma ospedaliera posta in essere con la L. n. 132/68, la cd. Legge Mariotti, ha esteso a tutti i cittadini il diritto all'assistenza ospedaliera. Gli obiettivi raggiunti e le criticità evidenziate hanno costituito la premessa per:", "o": ["La nascita del Servizio Sanitario Nazionale (SSN). Con la Legge Mariotti venne superato il sistema assicurativo su base mutualistica della sanità pubblica, basato sulla assistenza e beneficenza caritatevole. Gli ospedali diventano enti autonomi, gli enti pubblici vengono sciolti e sostituiti dalle Casse Mutue, le quali, nel tempo, hanno privilegi per le classi di lavoratori e loro familiari che potevano fruire di cura e assistenza perché iscritti alla Mutua di riferimento. Con l'istituzione del SSN, si vuole porre rimedio a tali problematiche", "La nascita del Servizio Sanitario Nazionale. La legge Mariotti ha contribuito alla razionalizzazione delle strutture ospedaliere, diventate enti autonomi, che costituiranno le fondamenta per la riforma della Sanità pubblica", "La costituzione di un Servizio Sanitario Nazionale, scevro da implicazioni di natura privatistica e proiettato verso un'assistenza sanitaria garantista per utti i cittadini di ogni ordine e grado", "Per la riorganizzazione degli enti ospedalieri, diventati strutture autonome, capaci di assicurare assistenza, prevenzione e cura a tutti i cittadini"], "a": 0}, {"id": 94, "s": "pan", "m": 10, "n": 6, "q": "La Legge istitutiva del SSN, la n. 833/78, ha introdotto e prodotto:", "o": ["Partendo dai principi costituzionali della salute quale diritto fondamentale dell'individuo ed interesse della collettività, servizi essenziali per tutti coloro stanziati nel territorio nazionale, razionalizzando l'organizzazione, sia centrale che periferica, e la spesa sanitaria, efficentando i servizi, anche con controlli economico-finanziari, promuovendo la salute dell'individuo in tutti i suoi aspetti", "Prendendo atto delle criticità della Legge Mariotti e dell'indebitamento degli Enti pubblici mutualistici, una riorganizzazione della sanità pubblica, riducendone la spesa, tentando di assicurare assistenza, prevenzione e cura a gran parte dei cittadini", "Servizi essenziali ai cittadini con l'obiettivo di assicurare assistenza sanitaria, a prescindere dall'indebitamento del sistema", "Una riforma strutturale dell'intero comparto della sanità pubblica, non riuscendo ad attuare i principi consacrati nel combinato disposto dagli artt. 32 e 117 della Costituzione Italiana"], "a": 0}, {"id": 95, "s": "pan", "m": 10, "n": 7, "q": "Gli strumenti della Legge di Riforma del SSN risiedono:", "o": ["In un graduale abbandono del decentramento amministrattivo ed un accentramento di potere degli organi ministeriali", "Nel decentramento politico-amministrativo, con razionalizzazione di risorse, competenze e funzioni tra organi centrali (Ministeriali e Comitati) e periferici (USL) ed in una intensa e adeguata azione di pianificazione e programmazione (sempre a livello centrale e periferico) con l'istituzione sia di un Piano Sanitario Nazionale che Regionale (PSR)", "In una ridistribuzione delle competenze tra organismi centrali e su base territoriale, razionalizzando le risorse finanziarie messe a disposizione dal governo", "In un decentramento amministrativo, lasciando alle Regioni, individuate come Ente Locale primario, la responsabilità politico-economica per la struttuazione organizzativa ed amministrativa della Sanità pubblica, divenuta ormai periferica"], "a": 1}, {"id": 96, "s": "pan", "m": 10, "n": 8, "q": "Il legislatore, negli anni '90, successivamente alla Legge di Riforma della Sanità Pubblica, è intervenuto per adeguare tutto il sistema sanitario alle mutate e mutanti condizioni politiche, socieli ed economiche del Paese, attraverso:", "o": ["La L. n. 833/78, il D.Lgs. n. 502/92, il D.Lgs. n. 517/93 ed il D.Lvo n. 229/99", "La legge di riforma della 833/78 ed il D.Lgs. n. 517/93", "Il D.Lgs. n. 517/93 e la Riforma Bindi", "Il D.Lgs. n. 502/92, in attuazione alla Legge delega del Governo Amato n. 421/92, cd. Riforma delle riforme, il D.Lgs. n. 517/93 ed il D.Lvo n. 229/99, la cd. Riforma Bindi, che introdussero l'aziendalizzazione delle USL. oramai regionalizzate e dotate di personalità giuridica, di propria autonomia organizzativa, amministrativa e finanziaria, ed i livelli uniformi di assistenza"], "a": 3}, {"id": 97, "s": "pan", "m": 10, "n": 9, "q": "Le modifiche introdotte dal Titolo V della Costituzione hanno ridisegnato:", "o": ["Le competenze di Stato e Regioni nella sanità pubblica, attribuendo al primo una competenza esclusiva leglislativa in materia di assistenza, prevenzione e cura, ed ale seconde, in via subordinata, la pianificazione dell'attuazione di igiene e profilassi.", "Le competenze di Stato e Regioni in materia sanitaria, in un sistema di legilsazione concorrente, pur mantenendo in capo allo Stato \"una clausola di supremazia\", consentendo all'autorità statale di intervenire in materie non riservate alla legislazione esclusiva regionale in presenza di un interesse nazionale da tutelare. Fatti salvi i principi della Riforma, hanno previsto l'erogazione per tutti i cittadini di prestazioni e servizi ricompresi nei Livelli Essenziali di Assistenza (LEA).", "L'impianto della Sanità pubblica, nascondendo dietro una legislazione esclusiva concorrente tra Stato e Regioni, un accentramento di competenze e funzioni allo Stato. Ciò ha determinato una perdita progressiva di un azione coordinata tra organismi centrali e locali, non garantendo l'attuazione dei principi ispiratori della riforma.", "L'art. 117 della Costituzione, con il quale il legislatore ha inteso creare un federalismo solidale, garante di una applicazione uniforme di prestazioni e servizi in tutto il Paese"], "a": 1}, {"id": 98, "s": "pan", "m": 10, "n": 10, "q": "Con l'istituzione del Ministero della Salute, L. n. 371/2001, il nostro ordinamento ha voluto garantire la tutela della salute ed il contenimento della spesa sanitaria, costituendo:", "o": ["I Livelli essenziali di assistenza (LEA), in concetto introdotti dalla legge di riforma costituzionale del Titolo V, la n. 3/2001, la cui determinazione è affidata alla legislazione esclusiva dello Stato. Aggiornati nel 2017, sono il nucleo del diritto alla salute e della sua tutela, ovvero l'insieme di prestazioni e servizi che il SSN fornisce sul territorio nazionale agli individui in esso stanziali, in via gratuita o dietro pagamento di una quota di partecipazione (ticket). La relativa copertura finanziaria è assicurata dal gettito fiscale. Le Regioni, con risorse proprie, possono garantire prestazioni ulteriori rispetto a quelle incluse nei LEA", "I Livelli minimi essenziali delle prestazioni concernenti i diritti civili e sociali che devono essere garantiti sul territorio Nazionale, individuati con legge dello Stato", "Una potestà legislativa esclusiva in capo alle Regioni, in applicazione al decentramento amministrativo di cui all'art. 117 dell Costituzione, in relazione alla individuazione dei livelli minimi essenziali delle prestazioni sanitarie", "In capo cittadini e associazioni di pazienti, alle istituzioni vigilate dal Ministero della Sanità, Aziende sanitarie e ospedaliere, Società scientifiche, IRCCS, Policlinici universitari, professionisti del SSN e loro associazioni, Aziende produttrici di tecnologie sanitarie e loro associazioni, l'individuazione dei livelli di assistenza minimi, ponendo interamente a carico del SSN i loro costi"], "a": 0}, {"id": 99, "s": "pan", "m": 11, "n": 1, "q": "Il concetto di \"salute\" come bene primario è frutto di una lunga evoluzione storica e sociale:", "o": ["Che, pur avendo trovato consacrazione nell'art. 32 della Costituzione Italiana, non è riuscito ad affermarsi né negli ordinamenti europei e continentali né nei principali atti promanati dai più importanti organismi internazionali", "Che ha trovato la sua consacrazione nell'art. 32 della nostra Costituzione del 1948, diventandone principio cardine in duplice veste sia quale diritto dell'individuo, sacro ed inviolabile sia come bene comune. Tale principio, lo troviamo espresso anche nella Costituzione dell'Organzizzazione mondiale della Sanità e nella Dichiarazione Universale dei Diritti Umani delle Nazioni Unite, entrambe del 1948", "Che, inteso solo quale tutela della salute fisica dell'individuo, non ha trovato adeguato riconoscimento negli ordinamenti dei vari Stati europei e continentali", "Che ha trovato la sua consacrazione nell'art. 32 della nostra Costituzione del 1948, diventandone principio cardine in duplice veste sia quale diritto dell'individuo, sacro ed inviolabile sia come bene comune, ovvero un interesse collettivo, da garantire e tutelare"], "a": 1}, {"id": 100, "s": "pan", "m": 11, "n": 2, "q": "L'art. 32 della Costituzione Italiana ha fatto assurgere la salute e la sua tutela come diritto, qualificandolo:", "o": ["Come principio di rilevanza e rango costituzionale. Con tale norma, il Costituente ha indicato il postulato ispiratore di tutta la materia, affermando l'assolutezza del diritto alla salute ed alla sua duplice rilevanza, individuale e collettiva, ponendo, al contempo, in capo alla Repubblica, l'obbligo di tutelare tale diritto, nei suoi diversi aspetti, assumendo addirittura carattere precettivo in riferimento alla tutela dei più bisognosi", "Quale fonte ispiratrice di tutta la sanità pubblica, lasciando tuttavia al la discrezionalità del legislatore l'adozione di norme finalizzate all'applicazione di tale diritto", "Come principio fondamentale, perno del sistema legislativo afferente la Sanità pubblica, finalizzato a garantire assistenza, prevenzione e cura ai cittadini capaci di produrre reddito. Tale norma avalla il concetto di salute quale interesse diffuso collettivo", "Malgrado il suo duplice aspetto di diritto individuale e bene collettivo, come un comune interesse collettivo, degno tuttavia di tutela"], "a": 0}, {"id": 101, "s": "pan", "m": 11, "n": 3, "q": "Il nostro legislatore, nel tentativo di costruire nel periodo post-Costituzione un sistema sanitario adeguato ai tempi e condizioni politico-sociali del Paese, ha posto in essere diversi interventi legislativi caratterizzati:", "o": ["Dall'applicazione farraginosa dei principi costituzionali, non dando strutturazione organica alla Sanità pubblica", "Il sistema sanitario è diventato lo strumento per garantire assistenza, cura e prevenzione a tutti gli individui stanziati nel nostro territorio. Pertanto, la Sanità pubblica, accentrata al MInistero della Sanità, con la L. n. 296/58, è stata finalizzata a garantire tali principi, attraverso: la riforma ospedaliera del '68; la prima riforma della Sanità pubblica, L. n. 833/78; il dentramento politico-amministrativo di funzioni e competenze; la Riforma bis, la cd. Riforma delle Riforme, il D.Lgs. 502/92; la Riforma ter, D.Lgs. n. 229/99, meglio conosciuta come riforma Bindi", "Dalla volontà di rendere fruibili la salute e la sua tutela a tutti i cittadini", "Dalla necessità di strutturare un sistema sanitario capace di garantire assistenza, cura e prevenzione, attraverso strumenti quali il decentramento territoriale di competenze e funzioni nella materia, con la creazione delle USL comunali, in applicazione alla Legge di riforma di tutto il comparto, ovvero la n. 616/77"], "a": 1}, {"id": 102, "s": "pan", "m": 11, "n": 4, "q": "Il Servizio sanitario nazionale, nell'esercizio delle sue attività istituzionali persegue:", "o": ["Il decentramento politico-amministrativo, attraverso l'interazione di Stato, Regioni ed enti locali, su competenze e funzioni ridefinite dalla normativa, avvalendosi, per la realizzazione di tali fini, di una struttura organizzata su tre livelli, statale, regionale e locale, in grado di offrire, gratuitamente o dietro pagamento di un ticket, per mezzo delle USL territoriali, eguali prestazioni assistenziali, curative e preventive a tutti gli individui stanziati nel Paese.", "Il superamento degli squilibri territoriali nelle condizioni socio- sanitarie del paese; La sicurezza del lavoro; La tutela della maternità e dell'infanzia; La realizzazione di adeguati servizi medico-scolastici per la tutela della salute nell'età evolutiva; La tutela sanitaria delle attività sportive; La tutela della salute degli anziani; La tutela della salute mentale", "Il principio dell'accentramento di competenze e funzioni allo Stato, che poi delega, con specifici interventi normativi, a Regioni ed Enti locali", "Una attività di pianificazione e programmazione, attraverso il Piano Sanitario Nazionale, che, stante la necessità di razionalizzare la spesa, determina gli strumenti attraverso i quali garantire l'assistenza, cura e prevenzione ai cittadini residenti nel Paese, produttori di reddito"], "a": 0}, {"id": 103, "s": "pan", "m": 11, "n": 5, "q": "Con la modifica della Parte II del Titolo V della Costituzione, il legislatore ha inteso:", "o": ["Ridistribuire le funzioni in materia sanitaria, accentrandone la governance agli uffici statali", "Ridistribuire le funzioni in materia sanitaria, accentrandone la governance agli uffici comunali", "Ridistribuire le funzioni in materia sanitaria, accentrandone la governance agli uffici delle Province e Città Metropolitane", "Dare garanzia costituzionale al decentramento amminnistrativo della Sanità pubblica, ponendo sempre più la regione come fulcro organizzativo essenziale del SSN e responsabile del governo della Sanità"], "a": 3}, {"id": 104, "s": "pan", "m": 11, "n": 6, "q": "Il Piano Sanitario Nazionale è:", "o": ["Il principale strumento di programmazione sanitaria, attraverso il quale, per un periodo temporale di tre anni, vengono definiti gli obiettivi da raggiungere attraverso l'individuazione di attività e strategie strumentali alla realizzazione delle prestazioni istituzionali del SSN, ovvero i LEA", "Il principale strumento di programmazione sanitaria, con il quale lo Stato, annualmente, individua i livelli essenziali ed uniformi di assistenzanza", "Uno strumento di programmazione del Ministero della Salute, correlato al Piano Generale Sanitario, attraverso il quale vengono individuati gli obiettivi del SSN", "Lo strumento della pianificazione sanitaria triennale del Ministero della Salute, che deve essere adottato seguendo le direttive e gli obiettivi individuati dai piani sanitari regionali"], "a": 0}, {"id": 105, "s": "pan", "m": 11, "n": 7, "q": "Gli obiettivi del PSN, tutt'oggi in vigore, sono:", "o": ["L'aziendalizzazione degli ospedali e la radicalizzazione nel territorio dele USL, per consentire così l'accesso ad eguali prestazioni per tutti i cittadini", "la tutela della salute in tutte le sue forme; l'umanizzazione dell'ospedale e le cure palliative; la prevenzione e la presa in carico della malattie invalidanti; la tutela della salute nelle prime fasi di vita, infanzia e adolescenza; la tutela della salute mentale e la prevenzione e presa in carico delle dipendenze; la salute delle fasce sociali marginali", "la promozione della salute e la lotta alle malattie trasmissibili, alle grandi patologie, al dolore e alla sofferenza nei percorsi di cura; l'umanizzazione dell'ospedale e le cure palliative; la prevenzione e la presa in carico della non autosufficienza; la tutela della salute nelle prime fasi di vita, infanzia e adolescenza; la tutela della salute mentale e la prevenzione e presa in carico delle dipendenze; la salute delle fasce sociali marginali", "la promozione della salute e la lotta alle malattie trasmissibili, alle grandi patologie, al dolore e alla sofferenza nei percorsi di cura; l'umanizzazione dell'ospedale e le cure palliatie; la prevenzione e la presa in carico della non autosufficienza; la tutela dei soggetti portatori di reddito; la tutela della salute nelle prime fasi di vita, infanzia e adolescenza; la tutela della salute mentale e la prevenzione e presa in carico delle dipendenze; la salute delle fasce sociali marginali"], "a": 2}, {"id": 106, "s": "pan", "m": 11, "n": 8, "q": "Il diritto alla tutela della salute è il presupposto per:", "o": ["Il riconoscimento di un diritto sanitario europeo, quale competenza trasversale dell'UE", "Attestare la competenza sovranazionale dell'UE, così sancendo l'obbligatorietà di Convenzioni e Trattati negli ordinamenti degli Stati membri", "Il riconoscimento di una competenza formale nell'adozione di misure sanitarie", "Il riconoscimento di una competenza implicita nell'adozione di misure sanitarie"], "a": 0}, {"id": 107, "s": "pan", "m": 11, "n": 9, "q": "Il primo riferimento alla salute in ambito europeo si ha:", "o": ["Nel Trattato di Maastricht", "Nel Trattato sul Funzionamento dell'Unione Europea (TFEU)", "Nella Convenzione europea per la salvaguardia dei Diritti dell'Uomo e delle Libertà fondamentali o CEDU", "Nella Carta Sociale Europea"], "a": 2}, {"id": 108, "s": "pan", "m": 11, "n": 10, "q": "La Pandemia da Covid-19 ha evidenziato:", "o": ["L'incapacità dell'UE di adottare e gestire una politica unitaria di contrasto alla diffusione del virus", "La capacità dell'UE di adottare e gestire una politica unitaria di contrasto alla diffusione del virus", "Il ruolo centralizzato assunto dall'UE nella politica sanitaria europea", "Nel fronteggiarne la diffusione, la necessità della interconnessione tra diritto alla salute, protezione dell'ambiente, tutela della salute e della sicurezza sui luoghi di lavoro, benessere della collettività, con la sostenibilità economica e sociale"], "a": 3}, {"id": 109, "s": "pan", "m": 12, "n": 1, "q": "I diritti umani appartengono:", "o": ["Alla categoria dei diritti inalienabili dell'uomo e rappresentano l'insieme dei diritti fondamentali di ogni individuo, inscindibili dalla sua natura", "Alla categoria dei diritto giuridici costituiti dallo Stato in capo a ciascun individuo sin dalla nascita", "Alla categoria dei diritti sociali attribuiti dalla Stato sin dalla nascita dell'essere umano", "Alla categoria dei diritti alienabili dell'uomo e rappresentano l'insieme dei diritti fondamentali di ogni individuo, inscindibili dalla sua natura"], "a": 0}, {"id": 110, "s": "pan", "m": 12, "n": 2, "q": "La fine della II Guerra mondiale ha visto il proliferare di interventi legislativi a livello internazionale con esplicito riferimento ai Diritti Umani che:", "o": ["Rraccordandosi tra loro, hanno visto codificate nei diversi ordinamenti statali, sotto forme diverse (trattati, convenzioni, patti, etc.), tali fondamentali principi. Trattandosi di norme espresse in forme diverse, ebbero diversa forza ed obbligatorietà, mantenendo in ogni caso carattere giuridicamente non vincolanti", "Non coordinandosi tra loro, hanno dato luogo ad interventi normativi disorganici nei diversi ordinamenti statali, senza alcuna forma di obbligatorietà nè dal carattere vincolante", "Rraccordandosi tra loro, hanno visto codificate nei diversi ordinamenti statali, sotto forme diverse (trattati, convenzioni, patti, etc.), tali fondamentali principi. Trattandosi di norme espresse in forme diverse, è chiaro che ebbero diversa forza ed obbligatorietà, distinguendosi in strumenti giuridicamente non vincolanti e vincolanti", "Pur coordinandosi tra loro, hanno dato luogo ad interventi normativi disorganici nei diversi ordinamenti statali, senza alcuna forma di obbligatorietà nè dal carattere vincolante"], "a": 2}, {"id": 111, "s": "pan", "m": 12, "n": 3, "q": "La Dichiarazione Universale di Diritti Umani nasce come:", "o": ["Carta dei Diritti dell'Uomo, fondamentale per tutte le legislazioni internazionali", "Codice dei Diritti Umani, sacri ed inviolabili, rimasto inosservato da gran parte degli Stati membri", "Un codice etico di importanza storica fondamentale, poiché per la prima volta nella storia dell'umanità vedeva la luce un documento che considerava tutti gli individui senza alcuna forma di distinzione, codificando che esistono diritti, sacri ed inviolabili, di cui ogni essere umano deve poter godere per la sola ragione di esistere", "Un codice etico, nato consuetudinario e fonte di successive Convenzioni, poiché per la prima volta nella storia dell'umanità vedeva la luce un documento che considerava tutti gli individui senza alcuna forma di distinzione, i programmazione/controllo e programmazione - orientati su processi organizzativi, che si ispirano alla responsabilizzazione del management e alla valutazione dei risultati", "improntati sui principi di economicità - strutturati sul processo virtuoso di programmazione/controllo e programmazione - orientati su processi organizzativi, che si ispirano alla responsabilizzazione del management e alla valutazione dei risultati"], "a": 0}, {"id": 250, "s": "pan", "m": 26, "n": 2, "q": "Al termine \"Performance\" possono essere assegnati almeno tre distinti significati:", "o": ["risultato ottenuto - modalità con le quali le azioni di un'organizzazione vengono percepite al suo interno e nel suo contesto operativo di riferimento", "risultato ottenuto - processo costruito per raggiungerlo - modalità con le quali le azioni di un'organizzazione vengono percepite al suo interno e nel suo contesto operativo di riferimento", "processo costruito per raggiungerlo - modalità con le quali le azioni di un'organizzazione vengono percepite al suo interno e nel suo contesto operativo di riferimento", "risultato da ottenere - processo costruito per raggiungerlo - modalità con le quali le azioni di un'organizzazione vengono percepite al suo interno e nel suo contesto operativo di riferimento"], "a": 1}, {"id": 251, "s": "pan", "m": 26, "n": 3, "q": "Un sistema di gestione delle performance o Performance Management (PM) può essere inteso come:", "o": ["un processo volto a creare un'idea condivisa di che cosa si voglia ottenere e a gestire il personale in modo tale da aumentare le probabilità di ottenere i risultati desiderati", "un continuo processo di misurazione e sviluppo delle performance di individui e gruppi e di allineamento di tali performance con gli obiettivi strategici dell'organizzazione", "un processo volto a creare un'idea condivisa di che cosa si voglia ottenere (e come) e a gestire il personale in modo tale da aumentare le probabilità di ottenere i risultati desiderati", "un c
