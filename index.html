sviluppa in tre step successivi:", "o": ["la definizione degli obiettivi organizzativi - la definizione di indicatori di performance individuali - la costruzione di un'infrastruttura di supporto che consenta la raccolta, l'acquisizione, l'analisi, l'interpretazione e la diffusione dei dati e dei giudizi prodotti", "la definizione degli obiettivi organizzativi - la definizione di indicatori di performance individuali - la costruzione di un'infrastruttura di supporto che consenta l'acquisizione, l'analisi, l'interpretazione e la diffusione dei dati e dei giudizi prodotti", "la definizione degli obiettivi organizzativi - la definizione di indicatori di performance individuali - la costruzione di un'infrastruttura di supporto che consenta la raccolta, l'analisi, l'interpretazione e la diffusione dei dati e dei giudizi prodotti", "la definizione degli obiettivi organizzativi - la definizione di indicatori di performance individuali - la costruzione di un'infrastruttura di supporto che consenta la raccolta, l'acquisizione, l'interpretazione e la diffusione dei dati e dei giudizi prodotti"], "a": 0}, {"id": 255, "s": "pan", "m": 26, "n": 7, "q": "Quanti sono i quesiti del Performance Management System (PMS) framework:", "o": ["22", "12", "14", "16"], "a": 1}, {"id": 256, "s": "pan", "m": 26, "n": 8, "q": "A fine di ordinare e semplificare la grande mole di dati eterogenei, La soluzione ottimale per il settore sanitario consiste nell'adottare degli strumenti digitali a supporto del controllo, dell'analisi dei dati e dei kpi utili, in particolare:", "o": ["meccanismi di feedback e meccanismi di feedforward", "soluzioni di goal clarity e soluzioni di goal commitment", "soluzioni di data warehouse e soluzioni di business intelligence", "meccanismi di role clarity e meccanismi di role commitment"], "a": 2}, {"id": 257, "s": "pan", "m": 26, "n": 9, "q": "Alcuni dei KPI maggiormente monitorati dalla BI nell'ambito sanitario sono:", "o": ["processi aziendali esterni - controllo dei costi - risorse umane - performance del pronto soccorso - tasso occupazione posti letto", "processi aziendali interni - controllo dei costi - risorse umane - performance della rianimazione - tasso occupazione posti letto", "processi aziendali interni - gestione dei costi - risorse umane - performance del pronto soccorso - tasso occupazione posti letto", "processi aziendali interni - controllo dei costi - risorse umane - performance del pronto soccorso - tasso occupazione posti letto"], "a": 3}, {"id": 258, "s": "pan", "m": 26, "n": 10, "q": "Sono due le analisi (Cruscotti di Business Intelligence) attualmente in auge per monitorare il controllo di gestione delle aziende sanitarie:", "o": ["cruscotto DRG e cruscotto mobilità", "cruscotto SDO e cruscotto mobilità", "cruscotto DRG e cruscotto trasferimenti", "cruscotto SDO e cruscotto trasferimenti"], "a": 0}, {"id": 259, "s": "pan", "m": 27, "n": 1, "q": "Il Balanced Scorecard (BSC) è un sistema di amministrazione che consente alle organizzazioni di tradurre la missione e le strategie aziendali in obiettivi e misure tangibili, è uno strumento multidimensionale che traduce:", "o": ["la strategia in elementi misurabili che comunichino univocamente l'indirizzo di un'organizzazione", "la strategia in elementi non misurabili che comunichino univocamente l'indirizzo di un'organizzazione", "la strategia in elementi misurabili che comunichino biunivocamente l'indirizzo di un'organizzazione", "la BSC in elementi misurabili che comunichino univocamente l'indirizzo di un'organizzazione"], "a": 0}, {"id": 260, "s": "pan", "m": 27, "n": 2, "q": "Il BSC ha l'obiettivo di evidenziare contestualmente gli elementi \"hard\" (misurabili e tangibili) e gli elementi \"soft\" (difficilmente misurabili), attraverso un sistema di elementi flessibili che traduce la Vision e la strategia di un'azienda sanitaria in una serie logica di misure della performance (obiettivi e misure) articolate in quattro prospettive diverse:", "o": ["prospettiva economico/finanziaria - processi aziendali interni - formazione e crescita", "prospettiva economico/finanziaria - orientamento al paziente/cliente - processi aziendali interni - formazione e crescita", "prospettiva economico/finanziaria - orientamento al paziente/cliente - formazione e crescita", "prospettiva economico/finanziaria - orientamento al paziente/cliente - processi aziendali interni"], "a": 1}, {"id": 261, "s": "pan", "m": 27, "n": 3, "q": "Lo sviluppo del BSC nelle organizzazioni sanitarie richiede mediamente:", "o": ["3 anni", "4 anni", "2 anni", "1 anno"], "a": 2}, {"id": 262, "s": "pan", "m": 27, "n": 4, "q": "Gli attributi tipicamente associabili alla realtà delle organizzazioni sanitarie sono:", "o": ["development - customer - innovation and learning - internal business processes", "financial - innovation and learning - internal business processes", "financial - customer - fund raising - internal business processes", "financial - customer - innovation and learning - internal business processes"], "a": 3}, {"id": 263, "s": "pan", "m": 27, "n": 5, "q": "Gli indicatori di performance di più frequente utilizzo nell'ambito della prospettiva economico - finanziaria del BSC sono:", "o": ["lo sviluppo - il contenimento dei costi - l'economicità - il fund raising", "lo sviluppo - il contenimento dei costi - il financial - il fund raising", "l'innovazione - il contenimento dei costi - l'economicità - il fund raising", "l'internal business - il contenimento dei costi - l'economicità - il fund raising"], "a": 0}, {"id": 264, "s": "pan", "m": 27, "n": 6, "q": "Gli indicatori solitamente associati alle aree - chiave di risultato fanno riferimento a:", "o": ["sviluppo - produttività ed efficienza clinica - tempestività", "qualità - produttività ed efficienza clinica - tempestività", "qualità - produttività ed efficacia clinica - economicità", "qualità - produttività ed efficienza clinica – tempestività"], "a": 1}, {"id": 265, "s": "pan", "m": 27, "n": 7, "q": "Gl  termini di volumi che di mix, la raccolta delle risorse destinate a finanziare le attività istituzionali"], "a": 3}, {"id": 267, "s": "pan", "m": 27, "n": 9, "q": "Le aree di performance che, in virtù dei rapporti con le differenti categorie di stakeholder vengono associate alla dimensione di analisi Customer Perspective del BSC sono relative a:", "o": ["gli outcome di tipo clinico rilevati a seguito del completamento dei percorsi assistenziali - la qualità dell'assistenza ricevuta - le informazioni ricevute dai pazienti e dai loro familiari in merito ai servizi erogati, allo stato di salute all'inizio e al termine del percorso di cura, all'eventuale follow up di tale percorso - l'adeguatezza delle prestazioni erogate - il rispetto delle condizioni di sicurezza e la corretta gestione del rischio clinico - la capacità di trasferire con tempestività le metodiche innovative - le condizioni di accessibilità dei servizi offerti - l'immagine che la struttura può vantare nei confronti della propria comunità di riferimento", "gli outcome di tipo clinico rilevati a seguito del completamento dei percorsi assistenziali - le informazioni ricevute dai pazienti e dai loro familiari in merito ai servizi erogati, allo stato di salute all'inizio e al termine del percorso di cura, all'eventuale follow up di tale percorso - l'adeguatezza delle prestazioni erogate - il rispetto delle condizioni di sicurezza e la corretta gestione del rischio clinico - la capacità di trasferire con tempestività le metodiche innovative - le condizioni di accessibilità dei servizi offerti - l'immagine che la struttura può vantare nei confronti della propria comunità di riferimento", "gli outcome di tipo clinico rilevati a seguito del completamento dei percorsi assistenziali - la qualità dell'assistenza ricevuta - l'adeguatezza delle prestazioni erogate - il rispetto delle condizioni di sicurezza e la corretta gestione del rischio clinico - la capacità di trasferire con tempestività le metodiche innovativ e standard di riferimento che determina \"rewards\" o correzioni di linea di azione", "processo di identificazione dei risultati da comparare con un qualche standard di riferimento che determina \"rewards\" o correzioni di linea di azione", "processo di sviluppo dei risultati da comparare con un qualche standard di riferimento che determina \"rewards\" o correzioni di linea di azione"], "a": 0}, {"id": 270, "s": "pan", "m": 28, "n": 2, "q": "Sono fondamentali i sistemi di valutazione dei risultati che possono essere classificati in tre tipologie di riferimento:", "o": ["i development systems - i target systems - i ranking systems", "gli intelligence systems - i target systems - i ranking systems", "gli intelligence systems - i target systems - i racing systems", "gli intelligence systems - i target systems - i rewards systems"], "a": 1}, {"id": 271, "s": "pan", "m": 28, "n": 3, "q": "I diversi principi che sottendono i sistemi di misurazione e valutazione determinano la struttura dei sistemi ed il processo con cui vengono costruiti o gestiti. Ad esempio l'OMS individua quattro dimensioni:", "o": ["migliorare lo stato di salute - garantire la rispondenza del servizio alle esigenze degli utenti - garantire l'accessibilità ai servizi offerti", "migliorare lo stato di salute - garantire l'equità finanziaria - garantire la rispondenza del servizio alle esigenze degli utenti", "migliorare lo stato di salute - garantire l'equità finanziaria - garantire la rispondenza del servizio alle esigenze degli utenti - garantire l'accessibilità ai servizi offerti", "garantire l'equità finanziaria - garantire la rispondenza del servizio alle esigenze degli utenti - garantire l'accessibilità ai servizi offerti"], "a": 2}, {"id": 272, "s": "pan", "m": 28, "n": 4, "q": "Sono stati individuati sei descrittori sulla base dei quali declinare gli elementi di comunanza o di diversità e identificare nel dettaglio le specificità regionali di ciascun elemento. Questi descrittori sono:", "o": ["f 28, "n": 9, "q": "L'economicità di un processo sanitario si misura attraverso un confronto tra le risorse impiegate ed i risultati ottenuti, e può essere misurata attraverso:", "o": ["l'efficacia oppure la produttività", "l'efficienza oppure la produttività", "l'appropriatezza oppure la produttività", "l'economicità oppure la produttività"], "a": 0}, {"id": 278, "s": "pan", "m": 28, "n": 10, "q": "La cura deve essere:", "o": ["basata sulla conoscenza scientifica ed utile - focalizzata sul paziente - erogata in tempi appropriati rispetto alle condizioni del singolo paziente", "basata sulla conoscenza scientifica ed utile - sicura - focalizzata sul paziente - erogata in tempi appropriati rispetto alle condizioni del singolo paziente", "basata sulla conoscenza scientifica ed utile - sicura - erogata in tempi appropriati rispetto alle condizioni del singolo paziente", "sicura - focalizzata sul paziente - erogata in tempi appropriati rispetto alle condizioni del singolo paziente"], "a": 1}, {"id": 279, "s": "pan", "m": 29, "n": 1, "q": "Il mobbing:", "o": ["si esplica attraverso aggressioni fisiche", "riguarda soltanto le istituzioni pubbliche", "riguarda soltanto il privato sociale", "comprende una serie di comportamenti aggressivi e persecutori che uno o più colleghi, superiori o sottoposti, possono indirizzare contro un loro simile"], "a": 3}, {"id": 280, "s": "pan", "m": 29, "n": 2, "q": "Il mobbing è un fenomeno:", "o": ["che riguarda soltanto il soggetto mobizzante e la vittima", "che coinvolge l'intera azienda, la quale diviene un sistema perverso", "poco diffuso", "che non è alimentato dal gruppo"], "a": 1}, {"id": 281, "s": "pan", "m": 29, "n": 3, "q": "In casi di mobbing:", "o": ["tutti sono consapevoli delle cause che hanno dato origine ai conflitti", "il soggetto mobizzante non ha bisogno di adepti", "le cause che hanno originato i conflitti vengono rimosse e tutti sono invasi dall'ansia", "facilmente i colleghi difendono la vittima"], "a": 2}, {"id": 282, "s": "pan", "m": 29, "n": 4, "q": "La malafede:", "o": ["si fonda sull'ambiguità ed è espressione di una micro- patologia sociale", "come la menzogna, presuppone la verità", "si differenzia facilmente dalla menzogna", "si fonda sulla rimozione della realtà"], "a": 0}, {"id": 283, "s": "pan", "m": 29, "n": 5, "q": "Il compromesso di identità:", "o": ["riguarda l'accordo armonico e maturo tra diverse parti di sé", "è una strategia difensiva che consente l'evitamento del conflitto e del senso di colpa", "riguarda l'accordo tra le diverse personalità che operano nell'istituzione", "consente l'elaborazione dei conflitti interiori"], "a": 1}, {"id": 284, "s": "pan", "m": 29, "n": 6, "q": "Il comportamento del free-rider:", "o": ["è irrazionale", "mira al bene comune", "mira alla massimizzazione dei benefici e all'azzeramento dei costi", "non necessita della cooperazione degli altri"], "a": 2}, {"id": 285, "s": "pan", "m": 29, "n": 7, "q": "Il Broker:", "o": ["è un abile manipolatore esperto di relazioni umane che mira ad ottenere consensi", "si impegna affinché ci sia una sana competizione tra i lavoratori", "si occupa di tutelare gli interessi dei lavoratori", "interviene a sostegno delle vittime"], "a": 0}, {"id": 286, "s": "pan", "m": 29, "n": 8, "q": "L'impostore:", "o": ["si presenta in maniera aggressiva", "è in grado di tollerare le critiche", "non ha l'obiettivo di sedurre gli altri", "si presenta con modi affidabili ma non è in grado di gestire l'aggressività e tende ad eludere i propri conflitti interiori"], "a": 3}, {"id": 287, "s": "pan", "m": 29, "n": 9, "q": "Le vittime:", "o": ["sanno di avere di fronte un impostore ma non possono difendersi", "talvolta inconsciamente sono complici dei soggetti mobbizzanti", "possono contare sul supporto dei colleghi", "non hanno alcun ruolo"], "a": 1}, {"id": 288, "s": "pan", "m": 29, "n": 10, "q": "Il pettegolezzo:", "o": ["è un arma contro il soggetto mobbizzante", "ha luogo nell'ambito di legami solidi", "ha anche l'obiettivo di distogliere l'attenzione degli interlocutori dai veri problemi", "coinvolge la vittima e il soggetto mobbizzante"], "a": 3}, {"id": 289, "s": "pan", "m": 30, "n": 1, "q": "Quando si effettua la progettazione di un evento formativo si definiscono:", "o": ["unicamente il gruppo di lavoro, i contenuti del corso, la tempistica ed i docenti", "il gruppo di lavoro, le ore di formazione, le risorse necessarie, i contenuti e modalità di erogazione, i materiali didattici, l'individuazione degli esperti per le attività, la tempistica dell'evento, la costruzione della piattaforma", "l'individuazione degli esperti per le attività, i contenuti e le modalità di erogazione, le ore di formazione, la tempistica dell'evento", "solo i contenuti dell'evento, i docenti e le ore dedicate alla formazione"], "a": 1}, {"id": 290, "s": "pan", "m": 30, "n": 2, "q": "Nella rilevazione dei bisogni si devono avere presenti:", "o": ["le caratteristiche organizzative dell'azienda e le tipologie professionali operanti", "l'anzianità di servizio dei lavoratori ed il titolo di studio di ciascuno di essi", "le caratteristiche strutturali, le dinamiche dell'organizzazione ed i bisogni espressi dagli individui in termini di motivazioni, conoscenze e competenze", "solo dei bisogni dei lavoratori in termini di motivazioni, conoscenze e competenze"], "a": 2}, {"id": 291, "s": "pan", "m": 30, "n": 3, "q": "Esistono diverse metodologie per l'analisi dei fabbisogni e si incentrano solitamente su strumenti di carattere qualitativo:", "o": ["ne esistono 3 - questionari, interviste e focus group", "ne esistono 2 - questionari e interviste", "ne esistono 4 - questionari, interviste, osservazioni sul campo e focus group", "ne esistono 3 - questionari, osservazioni sul campo e focus group"], "a": 0}, {"id": 292, "s": "pan", "m": 30, "n": 4, "q": "Le competenze vengono individuate da indicatori di valutazione e strumenti quali:", "o": ["test psico-attitudinale; test competenze culturali di base e/o tecnico p en analysis, anche detta analisi costi-volumi- risultati o analisi del punto di pareggio è un'analisi operativa di breve periodo", "la Break even analysis, anche detta analisi costi-volumi- risultati o analisi del punto di pareggio è un'analisi operativa di un lungo periodo", "la Break even analysis, e l' analisi del punto di pareggio sono due processi diversificati che insieme consentono un'analisi operativa di breve periodo"], "a": -1}, {"id": 470, "s": "pan", "m": 48, "n": 2, "q": "La determinazione del punto di pareggio si fonda sulla distinzione dei costi in fissi e variabili. In breve pe costi fissi si intende:", "o": ["i costi fissi sono quei costi che, per qualsiasi quantità tra zero e il massimo che riesco a realizzare con la capacità produttiva esistente, non variano nel loro ammontare totale", "i costi fissi sono zero per un volume di produzione o vendita nullo, e non crescono proporzionalmente al crescere della quantità", "i costi fissi sono quei costi che, solo per determinate quantità tra zero e il massimo che riesco a realizzare con la capacità produttiva esistente, non variano nel loro ammontare totale", "i costi fissi sono zero per un volume di produzione o vendita nullo, e non crescono mai al crescere della quantità"], "a": -1}, {"id": 471, "s": "pan", "m": 48, "n": 3, "q": "Un'impresa può superare il punto di pareggio:", "o": ["no", "sì, sempre", "sì, solo se il valore monetario delle vendite è pari al costo", "sì, solo se il valore monetario delle vendite è superiore al costo"], "a": -1}, {"id": 472, "s": "pan", "m": 48, "n": 4, "q": "Quale fra queste formule è corretta:", "o": ["Risultato Economico = Ricavi totali - Costi totali", "Risultato Economico = Ricavi totali + Costi totali", "Risultato Economico = Ricavi totali x Costi totali", "Risultato Economico = Ricavi totali - Costi singoli"], "a": -1}, {"id": 473, "s": "pan", "m": 48, "n": 5, "q": "Leggendo questa formula: RE = P*Q - (CVu*Q + CF) la determinazione della quantità richiesta (Q) è d e solo se i dati sono corretti; non è semplicistica", "la break-even analysis gioca un ruolo importante nelle decisioni commerciali ma non è in grado di prevedere la domanda; non è affidabile solo se i dati sono corretti; non è semplicistica"], "a": -1}, {"id": 478, "s": "pan", "m": 48, "n": 10, "q": "Contiuna il periodo in modo corretto…….\" la break- even analysis\"…..:", "o": ["la break-even analysis è in grado di fornire una comprensione solida delle condizioni di base di una Azienda e rappresenta rappresenta l'unica ricerca da compiere prima di avviare un'attività", "la break-even analysis è in grado di fornire una comprensione solida delle condizioni di base di una Azienda ma non rappresenta l'unica ricerca da compiere prima di avviare un'attività", "la break-even analysis non è in grado di fornire una comprensione solida delle condizioni di base di una Azienda prima di avviare un'attività", "la break-even analysis è in grado di fornire una comprensione parziale delle condizioni di base di una Azienda"], "a": -1}, {"id": 479, "s": "pan", "m": 49, "n": 1, "q": "Quale Definizone è coretta:", "o": ["il controllo di gestione è definibile come uno strumento, finalizzat ad attivare un processo di programmazione degli obiettivi da conseguire e di verifica della rispondenza dell'andamento gestionale rispetto agli obiettivi prefissati, al fine di consentire ad una organizzazione di conseguire i propri obiettivi con la massima efficacia e con la massima efficienza possibile", "il controllo di gestione è definibile come insieme coordinato e integrato di criteri, strumenti, procedure finalizzati ad attivare un processo interattivo di programmazione degli obiettivi da conseguire", "il controllo di gestione è definibile come insieme coordinato e integrato di criteri, strumenti, procedure finalizzati ad attivare un processo interattivo di programmazione degli obiettivi da conseguire e di verifica della rispondenza dell'andamento gestionale rispetto agli obiettivi prefissati, al fine di consentire ad una organizzazione di conseguire i propri obiettivi con la massima efficacia e con la massima efficienza possibile", "il controllo di gestione è definibile come insieme coordinato e integrato di criteri, strumenti, procedure finalizzati ad attivare un processo interattivo di programmazione degli obiettivi da conseguire prefissati, con la massima efficacia e con la massima efficienza possibile"], "a": -1}, {"id": 480, "s": "pan", "m": 49, "n": 2, "q": "Con il termine OUTCOMES si vuole indicare:", "o": ["la ridefinizione dei livelli quantitativi/qualitativi delle attività/prestazioni/servizi", "la ridefinizione dei risultati finali", "la ridefinizione della struttura organizzativa o dei meccanismi operativi adottati nei processi di produzione", "la ridefinizione dei livelli quanti/qualitativi di risorse"], "a": -1}, {"id": 481, "s": "pan", "m": 49, "n": 3, "q": "Quali sono le Fasi del controllo di gestione:", "o": ["pianificazione-esecuzione", "pianificazione-esecuzione-valutazione", "pianificazione-esecuzione-reporting", "pianificazione-esecuzione-reporting-valutazione"], "a": -1}, {"id": 482, "s": "pan", "m": 49, "n": 4, "q": "Nel sistema di programmazione e controllo di gestione, la responsabilità del sistema informativo di supporto al processo deve essere attribuita:", "o": ["ad un ufficio costituito ad hoc, denominato ufficio programmazione e controllo di gestione (servizio controllo interno di gestione, ex articolo 20 decreto legislativo 29/1993)", "al Direttore Generale", "al Direttore Amministrativo", "ad un ufficio costituito ad hoc, denominato ufficio programmazione e controllo di gestione (servizio controllo interno di gestione, ex articolo 2 decreto legislativo 30/1995)"], "a": -1}, {"id": 483, "s": "pan", "m": 49, "n": 5, "q": "Il sistema di contabilità direzionale si articola nei sottosistemi:", "o": ["contabilità per prestazione; budget; analisi delle variazioni", "contabilità generale; contabilità per centri di costo; contabilità per prestazione; budget; analisi delle variazioni", "contabilità generale; contabilità per prestazione; budget; analisi delle variazioni", "contabilità generale; contabilità per centri di costo; contabilità per prestazione; budget"], "a": -1}, {"id": 484, "s": "pan", "m": 49, "n": 6, "q": "La Previsione di bilancio si divide in:", "o": ["accertamento, reversale, incasso, stanziamento, impegno, liquidazione, mandato, pagamento", "accertamento, incasso, stanziamento, impegno, liquidazione, mandato, pagamento", "accertamento, reversale, incasso, impegno, liquidazione, mandato, pagamento", "accertamento, incasso, stanziamento, impegno, liquidazione, pagamento"], "a": -1}, {"id": 485, "s": "pan", "m": 49, "n": 7, "q": "Quale mese dell'anno è favorevole per stilare l'ipotetico bilancio successivo aziendale:", "o": ["Dicembre", "Settembre", "Novembre", "Ottobre"], "a": -1}, {"id": 486, "s": "pan", "m": 49, "n": 8, "q": "Quale affemazione è corretta:", "o": ["il decreto legislativo 50/1994 ha delineato il sistema di controllo sugli atti, sugli organi e sulle attività delle aziende sanitarie distinguendo i controlli esterni esercitati principalmente dalla regione e dalla Corte dei Conti da quelli interni esercitati principalmente dal direttore generale e dal collegio sindacale", "il decreto legislativo 502/1992 ha delineato il sistema di controllo sugli atti, sugli organi e sulle attività delle aziende sanitarie distinguendo i controlli esterni esercitati principalmente dalla Corte dei Conti da quelli interni esercitati principalmente dal direttore generale e dal collegio sindacale", "l'art 18. della Legge 402/1990 ha delineato il sistema di controllo sugli atti, sugli organi e sulle attività delle aziende sanitarie distinguendo i controlli esterni esercitati principalmente dalla regione e dalla Corte dei Conti da quelli interni esercitati principalmente dal direttore generale e dal collegio sindacale", "il decreto legislativo 502/1992 ha delineato il sistema di controllo sugli atti, sugli organi e sulle attività delle aziende sanitarie distinguendo i controlli esterni esercitati principalmente dalla regione e dalla Corte dei Conti da quelli interni esercitati principalmente dal direttore generale e dal collegio sindacale"], "a": -1}, {"id": 487, "s": "pan", "m": 49, "n": 9, "q": "Cosa prevede la riforma costituzionale del titolo V:", "o": ["riserva alle regioni specifiche funzioni legislative in materia di assistenza sanitaria ed ospedaliera", "riserva alle regioni specifiche funzioni legislative ed amministrative in materia di assistenza sanitaria ed ospedaliera", "riserva alle regioni specifiche funzioni legislative ed amministrative nel campo della ricerca sperimentale", "riserva alle regioni specifiche funzioni giuridiche ed amministrative nel campo della ricerca sperimentale"], "a": -1}, {"id": 488, "s": "pan", "m": 49, "n": 10, "q": "Ai sensi della Legge Finanziaria anno 2005 n:", "o": ["266 del 23/05/2005 le sezioni regionali di controllo della Corte dei Conti verificano, sulla base delle relazioni dei rispettivi organi di revisione, il rispetto da parte di province, comuni ed enti del SSN degli obiettivi posti dal patto di stabilità interno e dell'osservanza del vincolo previsto in materia di indebitamento dall'art. 119 ultimo comma della Costituzione", "166 del 23/05/2005 le sezioni regionali di controllo della Corte dei Conti verificano, sulla base delle relazioni dei rispettivi organi di revisione, il rispetto da parte di province, comuni ed enti del SSN degli obiettivi posti dal patto di stabilità interno e dell'osservanza del vincolo previsto in materia di indebitamento dall'art. 119 ultimo comma della Costituzione", "200 del 23/06/2005 le sezioni regionali di controllo della Corte dei Conti verificano, sulla base delle relazioni dei rispettivi organi di revisione, il rispetto da parte di province, comuni ed enti del SSN degli obiettivi posti dal patto di stabilità interno e dell'osservanza del vincolo previsto in materia di indebitamento dall'art. 119 ultimo comma della Costituzione", "266 del 23/05/2005 le sezioni regionali di controllo della Corte dei Conti verificano, sulla base delle relazioni dei rispettivi organi di revisione, il rispetto da parte di province, comuni ed enti del SSN degli obiettivi posti dal patto di stabilità interno e dell'osservanza del vincolo previsto in materia di indebitamento dall'art. 19 ultimo comma della Costituzione"], "a": -1}, {"id": 10001, "s": "piat", "m": 1, "n": "1", "q": "Lo Stato è intervenuto legislativamente nel tentativo di creare un sistema sanitario pubblico, incontrando come ostacoli:", "p": "La storia del Servizio Sanitario Nazionale", "o": ["Le condizioni sociali ed economiche del Paese, le carenti condizioni igienico sanitarie ed un inesistente sostegno pubblico della Sanità, che hanno reso vano il tentativo dello Stato di costruire un sistema sanitario strutturato", "L'inadeguatezza delle condizioni sociali, economiche ed igienico-sanitarie del Paese, evidenziando l'inesistenza dell'assistenza sanitaria pubblica. I Governi del tempo, presieduti prima da Crispi e poi da Giolitti, iniziarono a strutturare una parvenza di intervento statale, istuendo Uffici e Servizi di sanità pubblica, tuttavia sempre minoritario e succedaneo a quello dei privati, garantendo una limitata assistenza alla popolazione", "Un poco strutturata sistema sanitario, sul quale, con adeguati interventi legislativi, lo Stato è intervenuto i modo organico, creando i presupposti per un sistema sanitario, fondato sull'assistenza, prevenzione e cura", "L'arretratezza delle condizioni socio-economiche del Paese, che hanno impedito un intervento legislativo efficace, che desse impulso alla formazione di un sistema saniario di tipo assistenzialistico"], "a": 1}, {"id": 10002, "s": "piat", "m": 1, "n": "2", "q": "L'intervento pubblico, prima dell'istituzione del regime fascista, si era limitato alla applicazione del T.U. n. 636/1907, non riuscendo a dare organicità al Sistema. Il Fascimo ha dato un nuovo impulso a tale azione attaverso:", "p": "La storia del Servizio Sanitario Nazionale", "o": ["Un intervento di riordino e riorganizzazione della legislazione sanitaria, finalizzati a fornire assistenza alle categorie meno tutelate (infanzia, maternità, figli illegittimi abbandonati), per poi approvare il T.U. delle Leggi Sanitarie, su proposta di Mussolini, coordinanando le norme esistenti e a ristrutturando il comparto della sanità pubblica, con interventi in favore dei lavoratori, creando Enti mutualistici (come INPS, INAM, ENPDAP, IPAB) ed adottando una politica garantista dei luoghi di lavoro, lasciando notevole spazio alla beneficenza privata", "La ristrutturazione del Sistema Sanitario e l'introduzione di nuove norme ed un'adeguata applicazione del T.U. n. 636/1907", "La creazione di una Sanità pubblica fondata sulle Mutue private e Enti di assistenza pubblici", "La riorganizzazione della Sanità pubblica, con l'abbandono parziale dell'intervento privato e della Chiesa in materia di assistenza e cura a favore di un forte intervento statale, con un forte contributo finanziario"], "a": 0}, {"id": 10003, "s": "piat", "m": 1, "n": "3", "q": "Dopo il secondo conflitto mondiale, la Riforma dell'ordinamento sanitario nasce da:", "p": "La Salute diventa un diritto fondamentale", "o": ["Una compiuta organizzazione del sistema sanitario pubblico che fonda le sue radici nel riconoscimento del diritto alla salute come principio consacrato nell'art. 32 della Costituzione Italiana", "Le criticità evidenziate nel periodo pre-bellico, che hanno indotto lo Stato ad intervenire sull'impianto legislativo esistente per ristrutturare tutta la sanità, partendo proprio dalla Carta costituzionale del 1948, individuando nell'art. 117 della stessa i principi fondamentali per decentrare competenze e funzioni", "Una profonda riorganizzazione della Sanità pubblica, che passa dal primario riconoscimento della salute quale diritto fondamentale dell'individuo ed interesse della collettività, consacrati nel combinato disposto dagli art. 32 e 117 della Costituzione Italian, che attribuisce alle Regioni un ruolo primario all'interno del sistema sanitario, in appilcazione al decentramento politico e amministrativo", "La necessità di adeguare la sanità pubbliche al nuovo contesto politico, sociale ed economico del Paese"], "a": 2}, {"id": 10004, "s": "piat", "m": 1, "n": "4", "q": "Con la L. n. 296/1958, il nostro legislatore, nel prendere atto della disorganizzazione e delle carenze evidenziate dal servizio sanitario, ha istituito:", "p": "La Salute diventa un diritto fondamentale", "o": ["L'Alto Commissariato per l'Igiene e la Sanità Pubblica, in modo da sotrarre tutta la materia sanitaria al Ministero dell'Interno, attribuendo a tale organismo la tutela della salute pubblica, lnonchè il compito di coordinare e vigilare sulle organizzazioni sanitarie e sugli enti mutualistici cui era assegnata la funzione di contrastare e prevenire le malattie sociali", "Il Ministero della Sanità e l'Alto Commissariato per l'Igiene e la Sanità Pubblica, in modo da sotrarre tutta la materia sanitaria al Ministero dell'Interno, centralizzando sul primo la potestà legislativa in materia sanitaria e attribuendo al secondo l'azione esecutiva in ambito igienico-sanitario", "Il Ministero della Sanità, coadiuvato dall'Alto Commissariato per l'Igiene e la Sanità Pubblica, dal Consiglio superiore di sanità e dall'Istituto superiore di sanità, ripartendo, tra gli stessi, ruoli, funzioni e competenze", "Il Ministero della Sanità, riunendo in questa unica struttura ministeriale le competenze dell'Alto Commissariato e delle altre amministrazioni centrali preposte alla sanità pubblica, coadiuvato nelle sue funzioni, in ambito nazionale, dal Consiglio superiore di sanità e dall'Istituto superiore di sanità, ed in quello periferico dal Medico Provinciale e dagli Ufficiali sanitari comunali"], "a": 3}, {"id": 10005, "s": "piat", "m": 1, "n": "5", "q": "La Riforma ospedaliera posta in essere con la L. n. 132/68, la cd. Legge Mariotti, ha esteso a tutti i cittadini il diritto all'assistenza ospedaliera. Gli obiettivi raggiunti e le criticità evidenziate hanno costituito la premessa per:", "p": "La svolta: nasce il Servizio Sanitario", "o": ["La nascita del Servizio Sanitario Nazionale (SSN). Con la Legge Mariotti venne superato il sistema assicurativo su base mutualistica della sanità pubblica, basato sulla assistenza e beneficenza caritatevole. Gli ospedali diventano enti autonomi, gli enti pubblici vengono sciolti e sostituiti dalle Casse Mutue, le quali, nel tempo, hanno privilegi per le classi di lavoratori e loro familiari che potevano fruire di cura e assistenza perché iscritti alla Mutua di riferimento. Con l'istituzione del SSN, si vuole porre rimedio a tali problematiche", "La nascita del Servizio Sanitario Nazionale. La legge Mariotti ha contribuito alla razionalizzazione delle strutture ospedaliere, diventate enti autonomi, che costituiranno le fondamenta per la riforma della Sanità pubblica", "La costituzione di un Servizio Sanitario Nazionale, scevro da implicazioni di natura privatistica e proiettato verso un'assistenza sanitaria garantista per utti i cittadini di ogni ordine e grado", "Per la riorganizzazione degli enti ospedalieri, diventati strutture autonome, capaci di assicurare assistenza, prevenzione e cura a tutti i cittadini"], "a": 0}, {"id": 10006, "s": "piat", "m": 1, "n": "6", "q": "La Legge istitutiva del SSN, la n. 833/78, ha introdotto e prodotto:", "p": "La svolta: nasce il Servizio Sanitario", "o": ["Partendo dai principi costituzionali della salute quale diritto fondamentale dell'individuo ed interesse della collettività, servizi essenziali per tutti coloro stanziati nel territorio nazionale, razionalizzando l'organizzazione, sia centrale che periferica, e la spesa sanitaria, efficentando i servizi, anche con controlli economico-finanziari, promuovendo la salute dell'individuo in tutti i suoi aspetti", "Prendendo atto delle criticità della Legge Mariotti e dell'indebitamento degli Enti pubblici mutualistici, una riorganizzazione della sanità pubblica, riducendone la spesa, tentando di assicurare assistenza, prevenzione e cura a gran parte dei cittadini", "Servizi essenziali ai cittadini con l'obiettivo di assicurare assistenza sanitaria, a prescindere dall'indebitamento del sistema", "Una riforma strutturale dell'intero comparto della sanità pubblica, non riuscendo ad attuare i principi consacrati nel combinato disposto degli artt. 32 e 117 della Costituzione Italiana"], "a": 0}, {"id": 10007, "s": "piat", "m": 1, "n": "7", "q": "Gli strumenti della Legge di Riforma del SSN risiedono:", "p": "La svolta: nasce il Servizio Sanitario", "o": ["In un graduale abbandono del decentramento amministrattivo ed un accentramento di potere degli organi ministeriali", "Nel decentramento politico-amministrativo, con razionalizzazione di risorse, competenze e funzioni tra organi centrali (Ministeriali e Comitati) e periferici (USL) ed in una intensa e adeguata azione di pianificazione e programmazione (sempre a livello centrale e periferico) con l'istituzione sia di un Piano Sanitario Nazionale che Regionale (PSR)", "In una ridistribuzione delle competenze tra organismi centrali e su base territoriale, razionalizzando le risorse finanziarie messe a disposizione dal governo", "In un decentramento amministrativo, lasciando alle Regioni, individuate come Ente Locale primario, la responsabilità politico-economica per la struttuazione organizzativa ed amministrativa della Sanità pubblica, divenuta ormai periferica"], "a": 1}, {"id": 10008, "s": "piat", "m": 1, "n": "8", "q": "Il legislatore, negli anni '90, successivamente alla Legge di Riforma della Sanità Pubblica, è intervenuto per adeguare tutto il sistema sanitario alle mutate e mutanti condizioni politiche, socieli ed economiche del Paese, attraverso:", "p": "La svolta: nasce il Servizio Sanitario", "o": ["La L. n. 833/78, il D.Lgs. n. 502/92, il D.Lgs. n. 517/93 ed il D.Lvo n. 229/99", "La legge di riforma della 833/78 ed il D.Lgs. n. 517/93", "Il D.Lgs. n. 517/93 e la Riforma Bindi", "Il D.Lgs. n. 502/92, in attuazione alla Legge delega del Governo Amato n. 421/92, cd. Riforma delle riforme, il D.Lgs. n. 517/93 ed il D.Lvo n. 229/99, la cd. Riforma Bindi, che introdussero l' aziendalizzazione delle USL. oramai regionalizzate e dotate di personalità giuridica, di propria autonomia organizzativa, amministrativa e finanziaria, ed i livelli uniformi di assistenza"], "a": 3}, {"id": 10009, "s": "piat", "m": 1, "n": "9", "q": "Le modifiche introdotte dal Titolo V della Costituzione hanno ridisegnato:", "p": "La Riforma dle Titolo V della Costituzione", "o": ["Le competenze di Stato e Regioni nella sanità pubblica, attribuendo al primo una competenza esclusiva leglislativa in materia di assistenza, prevenzione e cura, ed ale seconde, in via subordinata, la pianificazione dell'attuazione di igiene e profilassi.", "Le competenze di Stato e Regioni in materia sanitaria, in un sistema di legilsazione concorrente, pur mantenendo in capo allo Stato 'una clausola di supremazia', consentendo all'autorità statale di intervenire in materie non riservate alla legislazione esclusiva regionale in presenza di un interesse nazionale da tutelare. Fatti salvi i principi della Riforma, hanno previsto l'erogazione per tutti i cittadini di prestazioni e servizi ricompresi nei Livelli Essenziali di Assistenza (LEA).", "L'impianto della Sanità pubblica, nascondendo dietro una legislazione esclusiva concorrente tra Stato e Regioni, un accentramento di competenze e funzioni allo Stato. Ciò ha determinato una perdita progressiva di un azione coordinata tra organismi centrali e locali, non garantendo l'attuazione dei principi ispiratori della riforma.", "L'art. 117 della Costituzione, con il quale il legislatore ha inteso creare un federalismo solidale, garante di una applicazione uniforme di prestazioni e servizi in tutto il Paese"], "a": 1}, {"id": 10010, "s": "piat", "m": 1, "n": "10", "q": "Con l'istituzione del Ministero della Salute, L. n. 371/2001, il nostro ordinamento ha voluto garantire la tutela della salute ed il contenimento della spesa sanitaria, costituendo:", "p": "Da Sanit&#224; a Salute. Il ruolo della prevenzione", "o": ["I Livelli essenziali di assistenza (LEA), in concetto introdotti dalla legge di riforma costituzionale del Titolo V, la n. 3/2001, la cui determinazione è affidata alla legislazione esclusiva dello Stato. Aggiornati nel 2017, sono il nucleo del diritto alla salute e della sua tutela, ovvero l'insieme di prestazioni e servizi che il SSN fornisce sul territorio nazionale agli individui in esso stanziali, in via gratuita o dietro pagamento di una quota di partecipazione (ticket). La relativa copertura finanziaria è assicurata dal gettito fiscale. Le Regioni, con risorse proprie, possono garantire prestazioni ulteriori rispetto a quelle incluse nei LEA", "I Livelli minimi essenziali delle prestazioni concernenti i diritti civili e sociali che devono essere garantiti sul territorio Nazionale, individuati con legge dello Stato", "Una potestà legislativa esclusiva in capo alle Regioni, in applicazione al decentramento amministrativo di cui all'art. 117 dell Costituzione, in relazione alla individuazione dei livelli minimi essenziali delle prestazioni sanitarie", "In capo cittadini e associazioni di pazienti, alle istituzioni vigilate dal Ministero della Sanità, Aziende sanitarie e ospedaliere, Società scientifiche, IRCCS, Policlinici universitari, professionisti del SSN e loro associazioni, Aziende produttrici di tecnologie sanitarie e loro associazioni, l'individuazione dei livelli di assistenza minimi, ponendo interamente a carico del SSN i loro costi"], "a": 0}, {"id": 10011, "s": "piat", "m": 1, "n": "1", "q": "Il concetto di 'salute' come bene primario è frutto di una lunga evoluzione storica e sociale:", "p": "Introduzione", "o": ["Che, pur avendo trovato consacrazione nell'art. 32 della Costituzione Italiana, non è riuscito ad affermarsi né negli ordinamenti europei e continentali né nei principali atti promanati dai più importanti organismi internazionali", "Che ha trovato la sua consacrazione nell'art. 32 della nostra Costituzione del 1948, diventandone principio cardine in duplice veste sia quale diritto dell'individuo, sacro ed inviolabile sia come bene comune. Tale principio, lo troviamo espresso anche nella Costituzione del l'Organizzizazione mondiale della Sanità e nella Dichiarazione Universale dei Diritti Umani delle Nazioni Unite, entrambe del 1948", "Che, inteso solo quale tutela della salute fisica dell'individuo, non ha trovato adeguato riconoscimento negli ordinamenti dei vari Stati europei e continentali", "Che ha trovato la sua consacrazione nell'art. 32 della nostra Costituzione del 1948, diventandone principio cardine in duplice veste sia quale diritto dell'individuo, sacro ed inviolabile sia come bene comune, ovvero un interesse collettivo, da garantire e tutelare"], "a": 1}, {"id": 10012, "s": "piat", "m": 1, "n": "2", "q": "L'art. 32 della Costituzione Italiana ha fatto assurgere la salute e la sua tutela come diritto, qualificandolo:", "p": "Evoluzione legislativa del Diritto Sanitario", "o": ["Come principio di rilevanza e rango costituzionale. Con tale norma, il Costituente ha indicato il postulato ispiratore di tutta la materia, affermando l'assolutezza del diritto alla salute ed alla sua duplice rilevanza, individuale e collettiva, ponendo, al contempo, in capo alla Repubblica, l'obbligo di tutelare tale diritto, nei suoi diversi aspetti, assumendo addirittura carattere precettivo in riferimento alla tutela dei più bisognosi", "Quale fonte ispiratrice di tutta la sanità pubblica, lasciando tuttavia al la discrezionalità del legislatore l'adozione di norme finalizzate all'applicazione di tale diritto", "Come principio fondamentale, perno del sistema legislativo afferente la Sanità pubblica, finalizzato a garantire assistenza, prevenzione e cura ai cittadini capaci di produrre reddito. Tale norma avalla il concetto di salute quale interesse diffuso collettivo", "Malgrado il suo duplice aspetto di diritto individuale e bene collettivo, come un comune interesse collettivo, degno tuttavia di tutela"], "a": 0}, {"id": 10013, "s": "piat", "m": 1, "n": "3", "q": "Il nostro legislatore, nel tentativo di costruire nel periodo post-Costituzione un sistema sanitario adeguato ai tempi e condizioni politico-sociali del Paese, ha posto in essere diversi interventi legislativi caratterizzati:", "p": "Evoluzione legislativa del Diritto Sanitario", "o": ["Dall'applicazione farraginosa dei principi costituzionali, non dando strutturazione organica alla Sanità pubblica", "Il sistema sanitario è diventato lo strumento per garantire assistenza, cura e prevenzione a tutti gli individui stanziati nel nostro territorio. Pertanto, la Sanità pubblica, accentrata al MInistero della Sanità, con la L. n. 296/58, è stata finalizzata a garantire tali principi, attraverso: la riforma ospedaliera del '68; la prima riforma della Sanità pubblica, L. n. 833/78; il dentramento politico-amministrativo di funzioni e competenze; la Riforma bis, la cd. Riforma delle Riforme, il D.Lgs. 502/92; la Riforma ter, D.Lgs. n. 229/99, meglio conosciuta come riforma Bindi", "Dalla volontà di rendere fruibili la salute e la sua tutela a tutti i cittadini", "Dalla necessità di strutturare un sistema sanitario capace di garantire assistenza, cura e prevenzione, attraverso strumenti quali il decentramento territoriale di competenze e funzioni nella materia, con la creazione delle USL comunali, in applicazione alla Legge di riforma di tutto il comparto, ovvero la n. 616/77"], "a": 1}, {"id": 10014, "s": "piat", "m": 1, "n": "4", "q": "Il Servizio sanitario nazionale, nell'esercizio delle sue attività istituzionali persegue:", "p": "Il Servizio Sanitario Nazionale", "o": ["Il decentramento politico-amministrativo, attraverso l'interazione di Stato, Regioni ed enti locali, su competenze e funzioni ridefinite dalla normativa, avvalendosi, per la realizzazione di tali fini, di una struttura organizzata su tre livelli, statale, regionale e locale, in grado di offrire, gratuitamente o dietro pagamento di un ticket, per mezzo delle USL territoriali, eguali prestazioni assistenziali, curative e preventive a tutti gli individui stanziati nel Paese.", "Il superamento degli squilibri territoriali nelle condizioni socio-sanitarie del paese; La sicurezza del lavoro; La tutela della maternità e dell'infanzia; La realizzazione di adeguati servizi medico-scolastici per la tutela della salute nell'età evolutiva; La tutela sanitaria delle attività sportive; La tutela della salute degli anziani; La tutela della salute mentale", "Il principio dell'accentramento di competenze e funzioni allo Stato, che poi delega, con specifici interventi normativi, a Regioni ed Enti locali", "Una attività di pianificazione e programmazione, attraverso il Piano Sanitario Nazionale, che, stante la necessità di razionalizzare la spesa, determina gli strumenti attraverso i quali garantire l'assistenza, cura e prevenzione ai cittadini residenti nel Paese, produttori di reddito"], "a": 0}, {"id": 10015, "s": "piat", "m": 1, "n": "5", "q": "Con la modifica della Parte II del Titolo V della Costituzione, il legislatore ha inteso:", "p": "Il Servizio Sanitario Nazionale", "o": ["Ridistribuire le funzioni in materia sanitaria, accentrandone la governance agli uffici statali", "Ridistribuire le funzioni in materia sanitaria, accentrandone la governance agli uffici comunali", "Ridistribuire le funzioni in materia sanitaria, accentrandone la governance agli uffici delle Province e Città Metropolitane", "Dare garanzia costituzionale al decentramento amminnistrativo della Sanità pubblica, ponendo sempre più la regione come fulcro organizzativo essenziale del SSN e responsabile del governo della Sanità"], "a": 3}, {"id": 10016, "s": "piat", "m": 1, "n": "6", "q": "Il Piano Sanitario Nazionale è:", "p": "Il Piano Sanitario Nazionale", "o": ["Il principale strumento di programmazione sanitaria, attraverso il quale, per un periodo temporale di tre anni, vengono definiti gli obiettivi da raggiungere attraverso l'individuazione di attività e strategie strumentali alla realizzazione delle prestazioni istituzionali del SSN, ovvero i LEA", "Il principale strumento di programmazione sanitaria, con il quale lo Stato, annualmente, individua i livelli essenziali ed uniformi di assistenzanza", "Uno strumento di programmazione del Ministero della Salute, correlato al Piano Generale Sanitario, attraverso il quale vengono individuati gli obiettivi del SSN", "Lo strumento della pianificazione sanitaria triennale del Ministero della Salute, che deve essere adottato seguendo le direttive e gli obiettivi individuati dai piani sanitari regionali"], "a": 0}, {"id": 10017, "s": "piat", "m": 1, "n": "7", "q": "Gli obiettivi del PSN, tutt'oggi in vigore, sono:", "p": "Il Piano Sanitario Nazionale", "o": ["L' aziendalizzazione degli ospedali e la radicalizzazione nel territorio dele USL, per consentire così l'accesso ad eguali prestazioni per tutti i cittadini", "la tutela della salute in tutte le sue forme; l'umanizzazione dell'ospedale e le cure palliative; la prevenzione e la presa in carico della malattie invalidanti; la tutela della salute nelle prime fasi di vita, infanzia e adolescenza; la tutela della salute mentale e la prevenzione e presa in carico delle dipendenze; la salute delle fasce sociali marginali", "la promozione della salute e la lotta alle malattie trasmissibili, alle grandi patologie, al dolore e alla sofferenza nei percorsi di cura; l'umanizzazione dell'ospedale e le cure palliative; la prevenzione e la presa in carico della non autosufficienza; la tutela della salute nelle prime fasi di vita, infanzia e adolescenza; la tutela della salute mentale e la prevenzione e presa in carico delle dipendenze; la salute delle fasce sociali marginali", "la promozione della salute e la lotta alle malattie trasmissibili, alle grandi patologie, al dolore e alla sofferenza nei percorsi di cura; l'umanizzazione dell'ospedale e le cure palliatie; la prevenzione e la presa in carico della non autosufficienza; la tutela dei soggetti portatori di reddito; la tutela della salute nelle prime fasi di vita, infanzia e adolescenza; la tutela della salute mentale e la prevenzione e presa in carico delle dipendenze; la salute delle fasce sociali marginali"], "a": 2}, {"id": 10018, "s": "piat", "m": 1, "n": "8", "q": "Il diritto alla tutela della salute è il presupposto per:", "p": "La salute e la sua tutela nel diritto europeo", "o": ["Il riconoscimento di un diritto sanitario europeo, quale competenza trasversale dell'UE", "Attestare la competenza sovranazionale dell'UE, così sancendo l'obbligatorietà di Convenzioni e Trattati negli ordinamenti degli Stati membri", "Il riconoscimento di una competenza formale nell'adozione di misure sanitarie", "Il riconoscimento di una competenza implicita nell'adozione di misure sanitarie"], "a": 0}, {"id": 10019, "s": "piat", "m": 1, "n": "9", "q": "Il primo riferimento alla salute in ambito europeo si ha:", "p": "La salute e la sua tutela nel diritto europeo", "o": ["Nel Trattato di Maastricht", "Nel Trattato sul Funzionamento dell'Unione Europea (TFEU)", "Nella Convenzione europea per la salvaguardia dei Diritti dell'Uomo e delle Libertà fondamentali o CEDU", "Nella Carta Sociale Europea"], "a": 2}, {"id": 10020, "s": "piat", "m": 1, "n": "10", "q": "La Pandemia da Covid-19 ha evidenziato:", "p": "La salute e la sua tutela nel diritto europeo", "o": ["L'incapacità dell'UE di adottare e gestire una politica unitaria di contrasto alla diffusione del virus", "La capacità dell'UE di adottare e gestire una politica unitaria di contrasto alla diffusione del virus", "Il ruolo centralizzato assunto dall'UE nella politica sanitaria europea", "Nel fronteggiarne la diffusione, la necessità della interconnessione tra diritto alla salute, protezione dell'ambiente, tutela della salute e della sicurezza sui luoghi di lavoro, benessere della collettività, con la sostenibilità economica e sociale"], "a": 3}, {"id": 10021, "s": "piat", "m": 1, "n": "1", "q": "La Repubblica tutela la salute", "p": "IL DIRITTO ALLA SALUTE E LA SICUREZZA NELLE CURE 1", "o": ["come fondamentale diritto dell'individuo e interesse della collettività, e garantisce cure gratuite agli indigenti", "come diritto reale dell'individuo e interesse della collettività, e garantisce cure gratuite agli indigenti", "come diritto di credito dell'individuo e interesse della collettività, e garantisce cure gratuite agli indigenti", "come diritto potestativo dell'individuo e interesse della collettività, e garantisce cure gratuite agli indigenti"], "a": 0}, {"id": 10022, "s": "piat", "m": 1, "n": "2", "q": "Il diritto alla salute:", "p": "IL DIRITTO ALLA SALUTE E LA SICUREZZA NELLE CURE 1", "o": ["è un diritto secondario e relativo", "è un diritto secondario", "è un diritto primario e assoluto solo per i cittadini italiani", "è un diritto primario e assoluto"], "a": 3}, {"id": 10023, "s": "piat", "m": 1, "n": "1", "q": "I diritti umani appartengono:", "p": "I Diritti Umani: natura ed identit&#224;", "o": ["Alla categoria dei diritti inalienabili dell'uomo e rappresentano l'insieme dei diritti fondamentali di ogni individuo, inscindibili dalla sua natura", "Alla categoria dei diritto giuridici costituiti dallo Stato in capo a ciascun individuo sin dalla nascita", "Alla categoria dei diritti sociali attribuiti dalla Stato sin dalla nascita dell'essere umano", "Alla categoria dei diritti alienabili dell'uomo e rappresentano l'insieme dei diritti fondamentali di ogni individuo, inscindibili dalla sua natura"], "a": 0}, {"id": 10024, "s": "piat", "m": 1, "n": "2", "q": "La fine della II Guerra mondiale ha visto il proliferare di interventi legislativi a livello internazionale con esplicito riferimento ai Diritti Umani che:", "p": "La normativa di riferimento", "o": ["Rraccordandosi tra loro, hanno visto codificate nei diversi ordinamenti statali, sotto forme diverse (trattati, convenzioni, patti, etc.), tali fondamentali principi. Trattandosi di norme espresse in forme diverse, ebbero diversa forza ed obbligatorietà, mantenendo in ogni caso carattere giuridicamente non vincolanti", "Non coordinandosi tra loro, hanno dato luogo ad interventi normativi disorganici nei diversi ordinamenti statali, senza alcuna forma di obbligatorietà nè dal carattere vincolante", "Rraccordandosi tra loro, hanno visto codificate nei diversi ordinamenti statali, sotto forme diverse (trattati, convenzioni, patti, etc.), tali fondamentali principi. Trattandosi di norme espresse in forme diverse, è chiaro che ebbero diversa forza ed obbligatorietà, distinguendosi in strumenti giuridicamente non vincolanti e vincolanti", "Pur coordinandosi tra loro, hanno dato luogo ad interventi normativi disorganici nei diversi ordinamenti statali, senza alcuna forma di obbligatorietà nè dal carattere vincolante"], "a": 2}, {"id": 10025, "s": "piat", "m": 1, "n": "3", "q": "La Dichiarazione Universale di Diritti Umani nasce come:", "p": "La Dichiarazione Universale dei Diritti Umani", "o": ["Carta dei Diritti dell'Uomo, fondamentale per tutte le legislazioni internazionali", "Codice dei Diritti Umani, sacri ed inviolabili, rimasto inosservato da gran parte degli Stati membri", "Un codice etico di importanza storica fondamentale, poiché per la prima volta nella storia dell'umanità vedeva la luce un documento che considerava tutti gli individui senza alcuna forma di distinzione, codificando che esistono diritti, sacri ed inviolabili, di cui ogni essere umano deve poter godere per la sola ragione di esistere", "Un codice etico, nato consuetudinario e fonte di successive Convenzioni, poiché per la prima volta nella storia dell'umanità vedeva la luce un documento che considerava tutti gli individui senza alcuna forma di distinzione, codificando che esistono diritti, sacri ed inviolabili, di cui ogni essere umano deve poter godere per la sola ragione di esistere"], "a": 3}, {"id": 10026, "s": "piat", "m": 1, "n": "4", "q": "I diritti umani sono classificati come:", "p": "La Dichiarazione Universale dei Diritti Umani", "o": ["Diritti civili", "Diritti umani interdipendenti, caratteristica che li rende singolari perché riunisce in una sola denominazione, sia quelli civili che economici, sociali e culturali", "Diritti economici e socio-culturali", "Diritti civili e sociali"], "a": 1}, {"id": 10027, "s": "piat", "m": 1, "n": "5", "q": "Etica e Morale sono concetti simili perché:", "p": "I Principi Etici", "o": ["Attengono alla vita sociale di ciascun individuo, distinguendone i comportamenti , intrinsecamente legati ad aspetti normativi", "Costituiscono elementi del diritto consociario", "Contraddistinguono i comportamenti degli associati in materia economica", "Attengono alla vita sociale dei consociati"], "a": 0}, {"id": 10028, "s": "piat", "m": 1, "n": "6", "q": "I valori etici rappresentano:", "p": "I Principi Etici", "o": ["Regole sociali contraddistinte dalla non obbliegatorietà della loro osservanza per l'individuo", "Regole di condotta a cui ciascun individuo è libero di conformarsi", "Guide comportamentali che regolano la condotta di un individuo che, codificate in un modus operandi, assurgono a principi, da osservare per rendere fruibili a tutti i valori medesimi", "Guide comportamentali che regolano la condotta di un individuo che, sebbene codificate in un modus operandi, non assurgono a principi, da osservare per rendere fruibili a tutti i valori medesimi"], "a": 2}, {"id": 10029, "s": "piat", "m": 1, "n": "7", "q": "I valori umani costituiscono:", "p": "I Principi Etici", "o": ["Le linee guida e le norme di comportamento coerente, collegate ai valori etici", "Le proprietà, le qualità o le caratteristiche che un individuo possiede, collegate intrinsecamente con i valori etici, codificate in norme coattive", "Le regole di condotta di un individuo", "Le qualità di un soggetto, parte di una comunità di persone"], "a": 1}, {"id": 10030, "s": "piat", "m": 1, "n": "8", "q": "La conoscenza dei diritti umani è indispensabile per il riconoscimento della loro tutela:", "p": "La Tutela dei Diritti Umani e dei Principi Etici", "o": ["Ciascun essere umano, infatti, deve poter godere dei propri fondamentali diritti per la sola ragione di essere al mondo, senza distinzione alcuna, rappresentando non un ideale astratto o filosofico ma parte della realtà sociale e quotidiana", "Al fine di poterne rivendicare l'esercizio", "Ciò consente l'applicazione del principio di sussidiarietà, per il quale i principi normativi garantisti devono essere posti in essere da organismi il più possibile prossimi al cittadino", "Tale conoscenza è fondamentale per la crescita di una societa scevra da contaminazioni culturali e sociali"], "a": 0}, {"id": 10031, "s": "piat", "m": 1, "n": "9", "q": "All'interno della Organizzazione delle Nazioni Unite, sono stati previste organismi che, in relazioni alle competenze assegnate, esercitano, in via generale o specifica, un controllo sull'osservanza dei diritti umani:", "p": "La Tutela dei Diritti Umani e dei Principi Etici", "o": ["Individuando tra queste l'Assemblea Generale, il Segretario Generale, Il Consiglio di Sicurezza", "Individuando tra queste l'Assemblea Generale, l'ECOSO, il Segretario Generale, il Consiglio di Sicurezza e la Corte internazionale di Giustizia", "Iindividuando tra queste l'ECOSO, il Segretario Generale, il Consiglio di Sicurezza e la Corte internazionale di Giustizia", "Individuando tra queste l'Assemblea Generale, il Consiglio di Sicurezza, la Corte internazionale di Giustizia e la Corte Europea per i Diritti Umani"], "a": 1}, {"id": 10032, "s": "piat", "m": 1, "n": "10", "q": "La Corte Europea per i diritti u nitarie", "o": ["Solo un'autorizzazione amministrativa", "Solo accordi contrattuali con l'Azienda Usl competente", "Un'autorizzazione amministrativa ma non accordi contrattuali con l'Azienda Usl competente", "Un'autorizzazione amministrativa e specifici accordi contrattuali (ai sensi dell'articolo 8 quinquies del D.lgs 502/92) con l'Azienda Usl competente"], "a": 3}, {"id": 10071, "s": "piat", "m": 2, "n": "4", "q": "L'accreditamento sanitario è:", "p": "Modelli di gestione ed erogazione delle prestazioni sanitarie", "o": ["Il provvedimento con il quale viene riconosciuto, alle strutture sanitarie già in possesso di un'autorizzazione, lo status di potenziali erogatori di prestazioni sanitarie nell'ambito e per conto del Servizio Sanitario Nazionale", "Il provvedimento con il quale viene riconosciuto, alle strutture sanitarie prive di un'autorizzazione, lo status di potenziali erogatori di prestazioni sanitarie nell'ambito e per conto del Servizio Sanitario Nazionale", "Non è un provvedimento", "Il provvedimento con il quale viene riconosciuto, alle strutture sanitarie già in possesso di un'autorizzazione, lo status di potenziali erogatori di prestazioni sanitarie non per conto del Servizio Sanitario Nazionale"], "a": 0}, {"id": 10072, "s": "piat", "m": 2, "n": "5", "q": "Le fasi della procedura di accreditamento sono:", "p": "Modelli di gestione ed erogazione delle prestazioni sanitarie", "o": ["Autorizzazione e rilascio dell'accredimento", "Rilascio dell'accredimento e definizione di accordo/contratto tra regione con Asl e struttura accreditata", "Autorizzazione; Rilascio dell'accredimento e definizione di accordo/contratto tra regione con Asl e struttura accreditata", "La procedura di accreditamento non prevede fasi"], "a": 2}, {"id": 10073, "s": "piat", "m": 2, "n": "1", "q": "Per distretto sanitario di base si intende:", "p": "Strutturazione ed organizzazione delle Aziende sanitarie (PT. I)", "o": ["Un organo tecnico-scientifico del servizio sanitario nazionale" ornire una comprensione solida delle condizioni di base di una Azienda prima di avwviare un' attivita", "la break-even analysis é in grado di fornire una comprensione parziale delle condizioni di base di una Azienda"], "a": 1}, {"id": 10334, "s": "piat", "m": 3, "n": "1", "q": "ll rendiconto finanziario:", "p": "Il rendiconto finanziario: cenni", "o": ["e un documento obbligatorio del bilancio", "é un documento facoltativo ma tutte le imprese lo predispongono", "é un documento facoltativo e non tutte le imprese lo predispongono", "non e un documento del bilancio"], "a": 0}, {"id": 10335, "s": "piat", "m": 3, "n": "2", "q": "ll rendiconto finanziario e:", "p": "Il rendiconto finanziario: cenni", "o": ["un prospetto che evidenzia costi e ricavi", "un prospetto che evidenzia debiti e crediti", "un prospetto che evidenzia flussi in entrata e in uscita", "un prospetto che evidenzia immobilizzazioni e spese correnti"], "a": 2}, {"id": 10336, "s": "piat", "m": 3, "n": "3", "q": "I flussi del rendiconto finanziario sono:", "p": "Il rendiconto finanziario: cenni", "o": ["flusso dell'attivita operativa, di investimento e di finanziamento", "flusso dell'attivita operativa, di vendita e di finanziamento", "flusso dell'attivita operativa, di investimento e di acquisizione", "flusso dell'attivita operativa e di investimento"], "a": 0}, {"id": 10337, "s": "piat", "m": 3, "n": "4", "q": "Il flusso dell'attivita operativa puo essere calcolato:", "p": "Il rendiconto finanziario: cenni", "o": ["sia col metodo diretto che con quello indiretto", "solo col metodo diretto", "solo col metodo indiretto", "non c'e un metodo specifico"], "a": 0}, {"id": 10338, "s": "piat", "m": 3, "n": "5", "q": "ll flusso di cassa delle attivita di investimento:", "p": "Il rendiconto finanziario: cenni", "o": ["comprende tutte le operazioni legate all'attivita operativa", "comprende tutte le operazioni legate alla cessione e acquisizione di servizi", "comprende tutte le operazioni legate alla cessione e acqu  "piat", "m": 7, "n": "9", "q": "Nursing malpractice e: Paragrafo di riferimento-Introduzione", "p": "", "o": ["La formazione di un team competente per gestire la sicurezza a tutti i livelli di organizzazione", "L'acquisizione da parte degli operatori sanitari di competenze sulla sicurezza del paziente", "Si verifica nel momento in cui un soggetto erogatore di servizio (azienda ospedaliera, medico, ecc) - non rispettando le linee guida minime per la assistenza specializzata - provoca danni o lesioni gravi e permanenti (o morte) al Paziente", "Insieme di raccomandazioni ministeriali per gestire la sicurezza del paziente"], "a": 2}, {"id": 10581, "s": "piat", "m": 7, "n": "10", "q": "La normativa che ha istituito la commissione sul rischio clinico e che ha prodotto il documento Risk Management il problema degli errori in sanita e:", "p": "Introduzione", "o": ["AD.M. 5 Marzo 2003", "Legge n. 42/99", "Legge n.251/2000", "D.Lgs 43/2006"], "a": 0}, {"id": 10582, "s": "piat", "m": 7, "n": "1", "q": "Il Governo clinico e:", "p": "Governance: definizione", "o": ["E' una strategia mediante la quale le organizzazioni sanitarie si rendono responsabili del miglioramento continuo della qualita dei servizi", "ll governo dei clinici", "Un nuovo modello di autoreferenzialita o di autodifesa del sistema o dei servizi", "Il governo dei manager"], "a": 0}, {"id": 10583, "s": "piat", "m": 7, "n": "2", "q": "Obiettivi della Governance Clinico assistenziale sono:", "p": "Governance Clinico Assistenziale: obiettivi", "o": ["Aumentare ilgap che esiste tra professionisti e manager", "Impiegare gli strumenti della qualita", "Realizzare su un sistema di efficacia/efficienza", "Mettere a punto un sistema multidimensionale di indicatori per monitorare la qualita dell'assistenza sanitaria"], "a": 3}, {"id": 10584, "s": "piat", "m": 7, "n": "3", "q": "Gli strumenti della Governance Clinico Assistenziale:", "p": "Governance Clinico Assistenziale: strumenti", "o": ["Devono essere utilizzati in manie tivo desiderato\"", "I'errore e definito dal Ministero della Salute come il \"fallimento nella pianificazione e/o nell'esecuzione di una sequenza di azioni che determina il mancato raggiungimento\"", "I'errore e definito dal Ministero della Salute come il \"fallimento nella pianificazione\"", "I'errore e definito come il \"fallimento nella pianificazione e/o nell'esecuzione di una sequenza di azioni\""], "a": 0}, {"id": 10594, "s": "piat", "m": 7, "n": "3", "q": "Come si classificano gli errori:", "p": "La classificsazione degli errori", "o": ["skill-based behaviour, knowledge-based behaviour", "skill-based behaviour, ruled-based behavior, knowledge-based behaviour", "skill-based behaviour, ruled-based behavior", "skill-based behaviour, near misses"], "a": 1}, {"id": 10595, "s": "piat", "m": 7, "n": "4", "q": "Come si definisce il rischio clinico:", "p": "Il rischio clinico", "o": ["la probabilita che un paziente sia vittima di un evento avverso, cioe subisca un qualsiasi danno o disagio imputabile, anche se in modo involontario, alle cure mediche prestate durante il periodo di degenza, e che sia causa di un prolungamento di tale periodo, di un peggioramento delle condizioni di salute o della morte", "La probabilita che un paziente siavittima di un evento avverso", "La probabilita che un paziente sia vittima di un evento awverso, cioe subisca un qualsiasi danno o disagio imputabile", "la probabilita che un paziente sia vittima di un evento avverso, cioe che sia causa di un prolungamento di tale periodo, di un peggioramento delle condizioni di salute o della morte"], "a": 0}, {"id": 10596, "s": "piat", "m": 7, "n": "5", "q": "Quali sono gli ambiti di rischio nelle organizzazioni sanitarie:", "p": "Il rischio clinico", "o": ["sicurezza del paziente, sicurezza del personale, sicurezza delle emergenze esterne", "sicurezza del personale, sicurezza delle emergenze esterne; sicurezza degli ambienti e attrezzature; rischi finanziari per danni alle persone", "sicurezza del paziente, sicurezza del personale, sicurezza delle emergenze esterne; sicurezza degli ambienti e attrezzature; rischi finanziari per danni alle persone", "sicurezza del paziente e del personale"], "a": 2}, {"id": 10597, "s": "piat", "m": 7, "n": "6", "q": "Quali sono i metodi di analisi del rischio:", "p": "Il rischio clinico", "o": ["La FMEA (Failure Mode Effects Analysis, tradotto \"Analisi dei modi e degli effetti dei guasti\") e l'audit", "la FMEA (Failure Mode Effects Analysis, tradotto \"Analisi dei modi e degli effetti dei guasti\") e la FMECA (Failure Mode Effects and Criticality Analysis", "L'incident reporting e la FMECA (Failure Mode Effects and Criticality Analysis", "la FMEA e la FECA"], "a": 1}, {"id": 10598, "s": "piat", "m": 7, "n": "7", "q": "Cosa si intende per errore \" Knowledge-based behaviour\":", "p": "La classificsazione degli errori", "o": ["si tratta di comportamenti messi in atto quando ci si trova davanti ad una situazione sconosciuta e si deve attuare un piano per superarla. E la situazione che richiede il maggior impiego di conoscenza e l'attivazione di una serie di processi mentali che dai simboli porteranno all'elaborazione di un piano per raggiungere gli obiettivi", "si mettono in atto dei comportamenti, prescritti da regole, che sono state definite in quanto ritenute piu idonee da applicare in una particolare circostanza. Il problema che si pone all'individuo é di identificare la giusta norma per ogni specifica situazione attenendosi ad un modello mentale di tipo causale", "sono comportamenti automatici ad una data situazione. All'individuo si propone uno stimolo cui reagisce meccanicamente senza porsi problemi d'interpretazione della situazione stessa. Tale abilita si sviluppa dopo che lo stimolo si é ripetuto per piu volte, sempre allo stesso modo. E un tipo di comportamento riscontrabile in situazioni di routine", "si tratta di comportamenti messi in atto quando ci si trova davanti ad una situazione che richiede il maggior impiego di conoscenza e l'attivazione di una serie di processi mentali che dai simboli porteranno all'elaborazione di un piano per raggiungere gli obiettivi"], "a": 0}, {"id": 10599, "s": "piat", "m": 7, "n": "8", "q": "Secondo Reason, cosa sono gli errori latenti:", "p": "Valutazione del rischio organizzativo nei processi di cura", "o": ["che provocano immediate conseguenze, dagli errori latenti(latent failure)", "errori latenti: non tutti gli errori latenti producono un errore attivo, né tutti gli errori provocano un danno.", "errori latenti: non tutti gli errori latenti producono un errore attivo, né tutti gli errori provocano un danno. Infatti, perché il danno si verifichi, devono sussistere condizioni tali da permettere all'erro re di superare tutte le barriere di sicurezza tecniche e organizzative predisposte all'interno della struttura per contenere gli effetti di possibili errori", "errori latenti: non tutti gli errori latenti permettono di superare tutte le barriere di sicurezza tecniche e organizzative predisposte all'interno della struttura per contenere gli effetti di possibili errori"], "a": 2}, {"id": 10600, "s": "piat", "m": 7, "n": "9", "q": "Gli approcci reattivi maggiormente utilizzati comprendono", "p": "La classificazione degli errori", "o": ["incident reporting, utilizzo dei dati amministrativi ed informativi, indizi, review, Root Cause Analysis", "incident reporting, review, Root Cause Analysis", "incident reporting, utilizzo dei dati amministrativi ed informativi, indizi, review", "incident reporting"], "a": 0}, {"id": 10601, "s": "piat", "m": 7, "n": "10", "q": "Quali sono le fasi di valutazione del rischio:", "p": "La classificazione degli errori", "o": ["analisi dei processi e delle attivita, identificazione delle situazioni pericolose e dei modi di errore possibili, stima della probabilita di occorrenza dell'errore e della gravita del danno, valutazione", "analisi dei processi e delle attivita, stima della probabilita di occorrenza dell'errore e della gravita del danno, valutazione", "identificazione delle situazioni pericolose e dei modi di errore possibili, stima della probabilita di occorrenza dell'errore e della gravita del danno, valutazione", "stima della probabilita di occorrenza dell'errore e della gravita del danno, valutazione"], "a": 0}, {"id": 10602, "s": "piat", "m": 7, "n": "1", "q": "Cosa si intende per \"gestione del rischio clinico:", "p": "Introduzione", "o": ["la gestione del rischio clinico (\"clinical risk management\") é uno strumento della Clinical Governance per garantire la sicurezza del paziente e migliorare la qualita dell'assistenza attraverso un processo sistematico di identificazione, valutazione e trattamento dei rischi attuali e potenziali connessi al trattamento sanitario", "la gestione del rischio clinico e migliorare la qualita dell'assistenza attraverso un processo sistematico di identificazione, valutazione e trattamento dei rischi attuali e potenziali connessi al trattamento sanitario", "la gestione del rischio clinico é uno strumento della Clinical Governance per garantire la sicurezza del paziente e migliorare la qualita dell'assistenza attraverso un processo sistematico di identificazione, valutazione e trattamento dei rischi attuali e potenziali connessi al trattamento sanitario", "la gestione del rischio clinico garantisce la sicurezza del paziente e migliorare la qualita dell'assistenza attraverso un processo sistematico di identificazione e trattamento dei rischi attuali e potenziali connessi al trattamento sanitario"], "a": 0}, {"id": 10603, "s": "piat", "m": 7, "n": "2", "q": "Quali sono gli errori dei processi cognitivi di controllo sui comportamenti umani:", "p": "La teoria del fattore umano", "o": ["la teoria del fattore umano considera gli errori quali fallimenti dei processi cognitivi di controllo sui comportamenti umani che sono di tre livelli: skill-based (abilita automatiche), rule-based (conoscenze di regole), knowledge-based (capacita di interpretazione di situazioni nuove)", "la teoria del fattore umano considera gli errori quali fallimenti dei processi cognitivi di controllo sui comportamenti umani che sono di trelivelli", "La teoria del fattore umano considera gli errori quali fallimenti dei processi cognitivi di controllo sui comportamenti umani che sono skill-based (abilita automatiche) e rule-based (conoscenze di regole)", "la teoria del fattore umano considera gli errori quali fallimenti dei processi cognitivi di controllo sui comportamenti umani"], "a": 0}, {"id": 10604, "s": "piat", "m": 7, "n": "3", "q": "Quali sono le fasi dei processi di gestione del rischio clinico:", "p": "Processi di gestione del rischio Clinico", "o": ["valutazione (Clinical Audit, Root Cause Analysis, Failure Mode and Effects Analysis); trattamento (tecniche di miglioramento continuo); monitoraggio (analisi di flussi informativi, indicatori di performance)", "trattamento (tecniche di miglioramento continuo); monitoraggio (analisi di flussi informativi, indicatori di performance)", "identificazione (incident reporting, revisione delle cartelle), valutazione (Clinical Audit, Root Cause Analysis, Failure Mode and Effects Analysis); trattamento (tecniche di miglioramento continuo); monitoraggio (analisi di flussi informativi, indicatori di performance)", "identificazione ; trattamento (tecniche di miglioramento continuo); monitoraggio (analisi di flussi informativi, indicatori di performance)"], "a": 2}, {"id": 10605, "s": "piat", "m": 7, "n": "4", "q": "Cosa si intende per \"Failure Modeand Effects Analysis\":", "p": "La teoria del fattore umano", "o": ["la \"Failure Modeand Effects Analysis\" é un metodo sistematico per identificare e prevenire problemi nei processi assistenziali", "la \"Failure Modeand Effects Analysis\" é un metodo sistematico per identificare e prevenire problemi nei processi assistenziali prima che questi si verifichino (pro-attivita e valutazione del rischio)", "la \"Failure Modeand Effects Analysis\" é un metodo sistematico per identificare e prevenire problemi nei processi assistenziali prima che questi si verifichino", "la\"Failure Modeand Effects Analysis\"identificai problemi nei processi assistenziali"], "a": 1}, {"id": 10606, "s": "piat", "m": 7, "n": "5", "q": "Quali sono gli errori non intenzionali:", "p": "Lo studio dell'errore", "o": ["gli slip e i mistakes", "gli slip, i lapsus, i mistakes", "i lapsus e i mistakes", "gli slip, i lapsus, i near misses"], "a": 1}, {"id": 10607, "s": "piat", "m": 7, "n": "6", "q": "In cosa consiste la catena di una generazione di un evento avwverso:", "p": "La teoria del fattore umano", "o": ["la catena di una generazione di un evento avverso parte da una situazione di pericolo (hazard) che puo esitare con una probabilita (risk) minore o maggiore in un evento (incident), la cui conseguenza puo essere un danno o evento awerso per il paziente (accident)", "la catena di una generazione di un evento avverso parte da una situazione di pericolo (hazard)", "la catena di una generazione di un evento awverso parte da una situazione di pericolo (hazard) che puo esitare con una probabilita (risk)", "la catena di una generazione di un evento avwverso parte da una situazione di pericolo (hazard) per il paziente (accident)"], "a": 0}, {"id": 10608, "s": "piat", "m": 7, "n": "7", "q": "In quante fasi si sviluppa la gestione del rischio clinico:", "p": "Processi di gestione del Rischio Clinico", "o": ["identificazione, attivazione di un sistema di controllo, proposte di progressivo miglioramento", "identificazione, impostazione e applicazione di misure di prevenzione, attivazione di un sistema di controllo, proposte di progressivo miglioramento", "identificazione, impostazione e applicazione di misure di prevenzione", "identificazione, impostazione e attivazione di un sistema di controllo"], "a": 1}, {"id": 10609, "s": "piat", "m": 7, "n": "8", "q": "Nell'ottica di ridurre gli errori e necessario:", "p": "Processi di gestione del Rischio Clini vizio", "o": ["sono le regole, le istruzioni, le cogenze, che condizionano lo svolgimento delle attivita che compongono il processo", "rappresentano i risultati, voluti o non, del processo", "sono le informazioni, i materiali che vengono immessi nel processo", "sono lepersoneei mezzi utilizzati per svolgere le singole attivita di trasformazione"], "a": 2}, {"id": 10646, "s": "piat", "m": 8, "n": "5", "q": "Le dimensioni della Qualita sono:", "p": "Il Servizio", "o": ["tecnica, relazionale, d'immagine, ambientale ed organizzativa", "di processo, di esito, di performance", "primarie e di supporto", "migliore, peggiore, raggiunta e non raggiunta"], "a": 0}, {"id": 10647, "s": "piat", "m": 8, "n": "6", "q": "Il ciclo di Deming:", "p": "Il miglioramento continuo nell'erogazione dle servizio", "o": ["é statico e rigido e deve essere applicato ad un singolo processo", "é dinamico e puo essere applicato sia al singolo processo sia alla rete di processi", "deve essere applicato solo in fase di output/controllo del processo", "prevede due fasi dinamiche di realizzazione"], "a": 1}, {"id": 10648, "s": "piat", "m": 8, "n": "7", "q": "Il PDCA (Plan, Do, Check, Act):", "p": "Il miglioramento continuo nell'erogazione dle servizio", "o": ["permette di prevenire tutti i possibili errori delle organizzazioni sanitarie", "e applicabile esclusivamente in realta sanitarie", "e un modo di pensare, di agire e di essere", "é applicabile solo in processi industriali"], "a": 2}, {"id": 10649, "s": "piat", "m": 8, "n": "8", "q": "I principi fondamentali su cui si basa il ssN sono:", "p": "Il ServizioSanitario Nazionale", "o": ["l'universalita, l'uguaglianza e l'equita", "basati sulla legge n.833 del 1980", "la piena soddisfazione di tutti i bisogni dell utenza", "il risparmio ed il contenimento della spesa"], "a": 0}, {"id": 10650, "s": "piat", "m": 8, "n": "9", "q": "Il disservizio:", "p": "Il disservizio", "o": ["non e da considerarsi un fattori di analisi per le attivita di tipo sanitario" i esclusioni), interazione tra i processi, riferimento alle procedure.", "e un documento che accerta la conformita ai requisiti dello standard UNl EN IsO 9ool:2015", "e un documento che spiega il ciclo di Deming"], "a": 1}, {"id": 10657, "s": "piat", "m": 8, "n": "6", "q": "1l ciclo di Deming Paragrafo di riferimento -Certificazione Iso9ool:2015", "p": "", "o": ["spiega il contesto del l'organizzazione", "stabilisce i principi del miglioramento", "riassume le linee gui da della pianificazione", "riassume l'intera norma Iso 900l:2015-plan, do, check, act"], "a": 3}, {"id": 10658, "s": "piat", "m": 8, "n": "7", "q": "Definizione di 1OP", "p": "Documentazione", "o": ["Raccolta di tutte quelle operazioni che con frequenza periodica, giornaliera, settimanale, mensile, il laboratorio effettua per assicurare il perfetto svolgimento delle prove analitiche.", "Documento che attestalo svolgimento di una determinata attivita o processo", "documento che definisce le intenzioni intraprese dalla struttura richiedente la certificazione per eseguire e gestire i processi all'interno del sistema di gestione implementato.", "documento che contiene i risultati degli Audit Interni, non conformita, reclami e osservazioni emerse, necessita formative del personale etc."], "a": 0}, {"id": 10659, "s": "piat", "m": 8, "n": "8", "q": "Differenza tra procedura e processo", "p": "Redazione di una procedura", "o": ["una procedura é un modo specificato per svolgere un'attivita o un processo, mentre un processo descrive dettagliatamente un'attivita con l'obiettivo di mettere tutti gli operatori nella condizione di eseguirla allo stesso modo.", "una procedura descrive dettagliatamente un'attivita con l'obiettivo di mettere tutti gli operatori nella condizione di eseguirla allo stesso modo. Mantre un processo e un modo specificato per svolgere un'attivita", "una procedura é un modo specificato per svolgere un'attivita o un processo, mentre un processo é un insieme di attivita correlate o interagenti
