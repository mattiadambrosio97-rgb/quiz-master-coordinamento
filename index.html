<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Master Coordinamento</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--txt:#1d2330;--mut:#6b7280;--acc:#2f5fd0;--ok:#1e8e4a;--okbg:#e6f6ec;--ko:#c93b3b;--kobg:#fdecec;--bd:#e3e6eb;--warn:#b7791f;--warnbg:#fff7e6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 0}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--txt)}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:18px 0 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
.meta{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.q{font-size:18px;font-weight:600;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:16px;color:var(--txt);font-family:inherit}
.opt:hover{border-color:var(--acc)}
.opt .l{font-weight:700;color:var(--acc);min-width:20px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ko{background:var(--kobg);border-color:var(--ko)}
.opt.sel{border-width:2px}
.opt:disabled{cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:none;background:var(--acc);color:#fff;padding:10px 18px;border-radius:8px;font-size:15px;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--bd)}
.btn.danger{background:var(--ko)}
.btn:disabled{opacity:.5;cursor:default}
.fb{font-weight:600;margin-top:10px}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.prog{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:var(--mut)}
.row{border-bottom:1px solid var(--bd);padding:12px 0}
.row:last-child{border:none}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--mut);margin-top:4px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--kobg);color:var(--ko);font-weight:600;margin-right:6px}
.pill.g{background:var(--okbg);color:var(--ok)}
.pill.w{background:var(--warnbg);color:var(--warn)}
.note{background:var(--warnbg);border:1px solid #f0d9a8;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.ans{margin-top:8px;font-size:14px}
.ans .l{font-weight:700;margin-right:6px}
.ans.g{color:var(--ok)}
.small{font-size:13px;color:var(--mut)}
select,input[type=search]{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font-size:14px;background:var(--card);color:var(--txt);font-family:inherit}
kbd{border:1px solid var(--bd);border-radius:4px;padding:0 5px;font-size:12px;background:#f8f9fb}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
@media (max-width:600px){.q{font-size:17px}.opt{font-size:15px}}
</style>
</head>
<body>
<header><div class="wrap"><nav>
<button data-v="train" class="on">Allenamento</button>
<button data-v="errors">Errori frequenti</button>
<button data-v="browse">Sfoglia</button>
<button data-v="todo">Da completare</button>
<button data-v="stats">Statistiche</button>
</nav></div></header>
<main class="wrap">
<section id="v-train"></section>
<section id="v-errors" hidden></section>
<section id="v-browse" hidden></section>
<section id="v-todo" hidden></section>
<section id="v-stats" hidden></section>
</main>
<script>
const RAW = [{"id": 1, "m": 1, "n": 1, "q": "Le norme di riferimento per i DPI sono sia il D.Lgs. 81/08 che il D.Lgs. 475/92:", "o": ["no, solo il D.Lgs. 81/08", "Si", "no, solo il D.Lgs. 475/92", "nessuna delle 2"], "a": 1}, {"id": 2, "m": 1, "n": 2, "q": "In quante categorie possono essere suddivisi i DPI:", "o": ["3", "2", "1", "4"], "a": 0}, {"id": 3, "m": 1, "n": 3, "q": "I DPI vanno utilizzati solo quando i rischi sono stati ridotti al minimo:", "o": ["no, solo dopo le misure di prevenzione collettiva", "Si", "no, solo per ridurre il Rischio residuo", "no,solo dopo le misure di protezione collettiva"], "a": 1}, {"id": 4, "m": 1, "n": 4, "q": "Quale categoria dei DPI si riferisce a prodotti complessi contro rischi di morte o lesioni gravi e permanenti:", "o": ["3a", "2a", "1a", "4a"], "a": 0}, {"id": 5, "m": 1, "n": 5, "q": "I DPI vengono scelti dal Datore di lavoro a sua completa discrezione:", "o": ["si", "no, in collaborazione con le altre figure preposte", "no solo con gli RLS", "No"], "a": 1}, {"id": 6, "m": 1, "n": 6, "q": "I dispositivi di protezione individuale devono essere marcati CE:", "o": ["Sempre", "solo se privi di altri documenti informativi", "solo per alcuni rischi particolari", "solo se importati dall'estero"], "a": 0}, {"id": 7, "m": 1, "n": 7, "q": "L'utilizzo dei DPI è prioritario rispetto all'utilizzo dei DPC(dispositivi di protezione collettiva):", "o": ["solo se disponibili", "sempre", "mai", "dipende dal tipo di dispositivi di protezione collettiva"], "a": 0}, {"id": 8, "m": 1, "n": 8, "q": "La partecipazione a corsi di formazione ed addestramento nell'uso dei DPI, da parte dei lavoratori:", "o": ["è un obbligo dei lavoratori", "è un obbligo dei DDL", "è obbligatorio solo per gli RLS", "è un obbligatorio solo per i lavoratori che ne hanno segnalato deficienza"], "a": 0}, {"id": 9, "m": 2, "n": 1, "q": "Esempio di costo diretto", "o": ["Costi salariali corrispondenti al tempo perso della vittima", "Costi per i premi pagati per l'assicurazione degli infortuni sul lavoro", "Spese relative all'assunzione di un sostituto temporaneo o definitivo", "Costi dei lavoratori in genere"], "a": 1}, {"id": 10, "m": 2, "n": 2, "q": "Rapporto tra costi indiretti e costi diretti", "o": ["I costi indiretti sono di solito sempre inferiori ai costi diretti", "I costi indiretti non sono quantificabili", "I costi indiretti possono essere anche non quantificabili", "I costi indiretti generalmente possono variare da 2,5 a 4 volte i costi diretti"], "a": 3}, {"id": 11, "m": 2, "n": 3, "q": "La metodologia SHIELD si fonda sul concetto di", "o": ["Costi diretti", "Costi indiretti", "Sia costi diretti che costi indiretti", "Costi sociali"], "a": 3}, {"id": 12, "m": 2, "n": 4, "q": "Esempio di costo sociale", "o": ["Costo slalariale corrispondnete al tempo perso dei colleghi costretti ad interrompere il loro lavoro", "Spese relative all'assunzione di un sostituto temporaneo o definitivo", "Inquinamento", "Costo delle ore lavorative perse per infortunio"], "a": 3}, {"id": 13, "m": 2, "n": 5, "q": "La riclassificazione dei costi per natura considera", "o": ["La prevenzione dei rischi", "Il fattore produttivo", "Il tipo di beni acquistati", "L'oggetto della spesa"], "a": 1}, {"id": 14, "m": 2, "n": 6, "q": "Le imprese che adottano la politica di prevenzione a rischio zero sono", "o": ["Imprese ad alta affidabilità", "Imprese poco pericolose", "Imprese poco propense a pagare multe e sanzioni", "Imprese pubbliche"], "a": 0}, {"id": 15, "m": 2, "n": 7, "q": "I costi sociali considerati nella metodologia SHIELD misurano il danno inferto", "o": ["All'impresa stessa", "Al management", "A nessuno", "A terze economie"], "a": 3}, {"id": 16, "m": 2, "n": 8, "q": "Come lo Stato spinge il management aziendale a considerare i costi sociali nelle decisioni di politica aziendale", "o": ["Attraverso i premi", "Tramite le sanzioni", "Mediante contributi in conto esercizio e in conto capitale", "Non incentiva in nessun modo"], "a": 1}, {"id": 17, "m": 2, "n": 9, "q": "SHIELD consente a consuntivo di calcolare", "o": ["I costi totali effettivi della sicurezza", "I costi nascosti", "I costi fissi", "I costi variabili"], "a": 0}, {"id": 18, "m": 2, "n": 10, "q": "Il market failure determina i", "o": ["Rischi d'impresa", "Rischi non di mercato", "Rischi ambientali", "Rischi sociali"], "a": 1}, {"id": 19, "m": 3, "n": 1, "q": "La capacità di stimare il livello di SSL dovrebbe essere competenza di", "o": ["Esclusivamente economisti", "Del management", "Dei lavoratori", "Di tutti coloro che promuovono SSL"], "a": 3}, {"id": 20, "m": 3, "n": 2, "q": "La valutazione economica oltre ad evidenziare i benefici finanziari considera anche", "o": ["I benefici intangibili", "I benefici occulti", "I benefici patrimoniali", "I benefici finanziari"], "a": 0}, {"id": 21, "m": 3, "n": 3, "q": "I metodi moderni per misurare il rendimento aziendale", "o": ["Non cercano di definire e di misurare gli indicatori che contribuiscono al successo di un'azienda", "Cercano di definire e di misurare gli indicatori finanziari", "Considerano il cash flow come indice significativo di valutazione", "Cercano di definire e di misurare gli indicatori che contribuiscono al successo di un'azienda"], "a": 3}, {"id": 22, "m": 3, "n": 4, "q": "Le analisi di costi-benefici", "o": ["Non includono né esplicitamente né implicitamente il dolore e la sofferenza", "Includono esplicitamente dolore e sofferenza", "Non sono facilmente attuabili", "Comprendono implicitamente il dolore e la sofferenza"], "a": 3}, {"id": 23, "m": 3, "n": 5, "q": "Nella fase del reperimento dati c.d. fase 3 se possibile è importante", "o": ["Reperire sempre nuovi dati", "Usare i dati esistenti", "Utilizzare esclusivamente stime", "Non usare le informazioni in possesso"], "a": 1}, {"id": 24, "m": 3, "n": 6, "q": "Nella fase di valutazione e calcoli c.d. fase 4 la valutazione economica porta a", "o": ["Dare un valore in denaro alle variabili e ai dati", "Esprimere il valore solo dei beni che hanno un mercato", "Escludere i beni senza mercato", "Escludere le variabili per le quali non è immediato avere un valore in denaro"], "a": 0}, {"id": 25, "m": 3, "n": 7, "q": "L'indice ritorno degli investimenti", "o": ["È pari a zero quando le perdite sono coincidenti con gli utili", "Esprime il tempo necessario per quantificare gli investimenti iniziali", "Non viene mai utilizzato perché di difficile quantificazione", "È il tempo necessario perché gli utili compensino gli investimenti iniziali"], "a": 3}, {"id": 26, "m": 3, "n": 8, "q": "Gli incentivi in ambito di SSL sono", "o": ["Premi in denaro", "Sconti su costi da sostenere", "Processi che premiano le organizzazioni che sviluppano e mantengono un ambiente di lavoro sano e sicuro", "Premi sia in denaro che in natura"], "a": 2}, {"id": 27, "m": 3, "n": 9, "q": "La strategia di Lisbona consiste", "o": ["Nel dare maggiore importanza all'occupazione", "Nel dare la stessa importanza all'aumento dell'occupazione e della produttività attraverso una maggiore competitività", "Nel dare poco importanza alla produttività purché si raggiunga un buon livello di occupazione e SSL", "Nell'attribuire contributi in conto capitale a fondo perduto"], "a": 1}, {"id": 28, "m": 3, "n": 10, "q": "Piccole e medie imprese", "o": ["Ad oggi ancora non ritengono che esistano effettivi vantaggi economici in tema di SSL", "Sono indifferenti ai vantaggi derivanti dal sistema SSL poiché danno maggiore importanza ai costi da sostenere", "Non applicano a livello normativo il sistema di SSL", "Cominciano a riconoscere con favore i vantaggi legati all'attuazione di una buona strategia di SSL"], "a": 3}, {"id": 29, "m": 4, "n": 1, "q": "In base all'art. 38 del D.Lgs 81/2008, può esercitare tra gli altri attività di medico competente, il medico in possesso di:", "o": ["Specializzazione in specializzazione in igiene e medicina preventiva o in medicina legale, senza ulteriori percorsi formativi", "Docenza in medicina legale e criminologia", "Specializzazione in specializzazione in igiene e medicina preventiva o in medicina legale, previa frequenza di appositi percorsi formativi universitari", "Specializzazione in medicina fisica e riabilitativa"], "a": 2}, {"id": 30, "m": 4, "n": 2, "q": "In base all'art. 25 del D.Lgs 81/2008, è un obbligo del medico competente", "o": ["La redazione del Documento di Valutazione dei rischi", "La sorveglianza fisica dei lavoratori radioesposti", "La nomina del rappresentante del servizio di prevenzione e protezione", "La collaborazione con il datore di lavoro e con il servizio di prevenzione e protezione alla valutazione dei rischi, anche ai fini della programmazione, ove necessario, della sorveglianza sanitaria"], "a": 3}, {"id": 31, "m": 4, "n": 3, "q": "Secondo l'art.35 del D.Lgs 81/2008 devono essere presenti alla riunione periodica", "o": ["Il datore di lavoro o un suo rappresentante, il responsabile del servizio di prevenzione e protezione dai rischi, il medico competente, ove nominato, e il rappresentante dei lavoratori per la sicurezza", "Solo il datore di lavoro e il medico competente", "Il datore di lavoro, il medico competente e almeno 5 lavoratori", "Il datore di lavoro, il medico competente e almeno un addetto al servizio di prevenzione e protezione dai rischi"], "a": 0}, {"id": 32, "m": 4, "n": 4, "q": "La sorveglianza sanitaria (ex art.41 D.Lgs 81/08)", "o": ["Deve essere sempre svolta anche in assenza di rischi", "E' svolta, tra l'altro, quando il lavoratore ne faccia richiesta e tale domanda sia ritenuta dal medico competente correlata ai rischi lavorativi", "Può essere richiesta dal datore di lavoro sempre a sua discrezione", "E' disciplinata anche per i radioesposti in base al D.Lgs 81/08"], "a": 1}, {"id": 33, "m": 4, "n": 5, "q": "Sono vietate, in base al D.Lgs 81/08 e smi (D.Lgs 106/09):", "o": ["Le visite volte ad accertare uno stato di gravidanza", "Le visite in fase preassuntiva", "Le visite a richiesta del lavoratore", "Le visite per cambio mansione"], "a": 0}, {"id": 34, "m": 4, "n": 6, "q": "L'art.41 D.Lgs 81/08, consente di redarre la cartella sanitaria e di rischio:", "o": ["Solo su supporto cartaceo", "Solo su supporto elettronico", "Solo su supporto elettronico", "Anche su supporto elettronico e per la tenuta della documentazione si osservano le disposizioni di cui all'art.53"], "a": 3}, {"id": 35, "m": 4, "n": 7, "q": "Il giudizio di idoneità alla mansione specifica:", "o": ["Può essere rilasciato a discrezione del datore di lavoro", "E' l'atto conclusivo solo della visita periodica", "Deve essere rilasciato alla fine della visita di sorveglianza sanitaria e deve essere espresso per iscritto dal medico competente il quale deve copia del giudizio medesimo al lavoratore e al datore di lavoro", "Può essere comunicato anche solo verbalmente"], "a": 2}, {"id": 36, "m": 4, "n": 8, "q": "Il D.Lgs 81/08 contempla i seguenti tipi di giudizi di idoneità:", "o": ["Idoneità, idoneità parziale (temporanea o permanente, con prescrizioni o limitazioni), inidoneità temporanea, inidoneità permanente", "Idoneità totale ed inidoneità parziale", "Idoneità sospesa", "Idoneità, idoneità ufficiosa (temporanea o permanente, con prescrizioni o limitazioni), inidoneità temporanea, inidoneità permanente"], "a": 0}, {"id": 37, "m": 4, "n": 9, "q": "Avverso i giudizi del medico competente ivi compresi quelli formulati in fase preassuntiva è ammesso ricorso,all'organo di vigilanza:", "o": ["Entro quarantotto ore dalla comunicazione", "Entro sei mesi dalla ricezione", "Contestualmente alla comunicazione", "Entro trenta giorni dalla data di comunicazione del giudizio medesimo"], "a": 3}, {"id": 38, "m": 4, "n": 10, "q": "In caso di inidoneità alla mansione specifica del lavoratore, il datore di lavoro deve:", "o": ["Parlare con il medico competente per convincerlo a modificare il giudizio", "Attuare le misure indicate dal medico competente e qualora le stesse prevedano un'inidoneità alla mansione specifica adibire il lavoratore, ove possibile, a mansioni equivalenti o, in difetto, a mansioni inferiori garantendo il trattamento corrispondente alle mansioni di provenienza", "Adibire il lavoratore a mansioni a più alto rischio", "Licenziare il lavoratore"], "a": 1}, {"id": 39, "m": 5, "n": 1, "q": "Che cosa è un Codice etico?", "o": ["è un documento dal contenuto politico", "è un documento che non contiene alcun principio ispiratore", "è un documento che contiene i valori in cui una Società si riconosce e i principi comportamentali fondamentali a cui i propri soci, dipendenti ed in genere tutti i soggetti che entrano in relazione con essa, devono attenersi", "un elenco dei diritti e doveri dei lavoratori"], "a": 2}, {"id": 40, "m": 5, "n": 2, "q": "Chi sono gli stakeholders?", "o": ["tutti coloro i quali, nell'ambito di una società, non hanno potere diretto su processi e profitti, ma ne subiscono le conseguenze", "i rappresentanti sindacali dei lavoratori", "la controparte principale di un contratto", "tutti coloro che non hanno alcun interesse e alcun diritto in un contratto"], "a": 0}, {"id": 41, "m": 5, "n": 3, "q": "Che cos'è l'ICOH?", "o": ["la società olandese di diritto del lavoro", "è una società professionale non governativa internazionale il cui obiettivo è di favorire il progresso scientifico, la conoscenza e lo sviluppo della salute e della sicurezza in tutti i suoi aspetti", "una società internazionale che si occupa degli aspetti economici della medicina del lavoro", "la Commissione Internazionale di Operatori Turistici"], "a": 1}, {"id": 42, "m": 5, "n": 4, "q": "Il primo Codice di Etica per Operatori della Medicina del Lavoro è stato approvato nel:", "o": ["1980", "1991", "1954", "2005"], "a": 1}, {"id": 43, "m": 5, "n": 5, "q": "La prima riunione per la redazione di un Codice di Etica per Operatori della Medicina del Lavoro si è tenuta nel 1987 a:", "o": ["Sidney", "Milano", "Parigi", "Berna"], "a": 0}, {"id": 44, "m": 5, "n": 6, "q": "L'importanza e l'affidabilità del Codice Etico dell'ICOH sono state infine riconosciute dal nostro legislatore che ne fa esplicita menzione nel:", "o": ["D.Lgs 277/91", "D.Lgs 303/56", "art.4 del D.Lgs 626/94", "art. 39 del D. Lgs 81/2008"], "a": 3}, {"id": 45, "m": 5, "n": 7, "q": "La struttura del Codice etico per OML è composta da:", "o": ["prefazione, introduzione e sintesi", "sommario, Introduzione e 35 principi fondamentali", "prefazione, introduzione, doveri e compiti degli operatori di Medicina del Lavoro, condizioni di svolgimento delle funzioni degli operatori di Medicina del Lavoro'", "diritti e doveri degli OML"], "a": 2}, {"id": 46, "m": 5, "n": 8, "q": "Secondo il punto 1 dei 'Doveri e compiti degli operatori di medicina del lavoro':", "o": ["obiettivo primario della Medicina del Lavoro è quello di salvaguardare e promuovere la salute dei lavoratori, in un ambiente di lavoro sicuro e non nocivo e di proteggerne le capacità lavorative e l'accesso al mondo del lavoro", "obiettivo primario della Medicina del Lavoro è far lavorare sempre tutti", "obiettivo primario della Medicina del Lavoro è portare esclusivamente gli interessi dei datori di lavoro", "obiettivo primario della Medicina del Lavoro è far diminuire il tasso di disoccupazione"], "a": 0}, {"id": 47, "m": 5, "n": 9, "q": "La terza ed ultima parte del Codice di Etica è intitolata 'Condizioni di svolgimento delle funzioni degli operatori di Medicina del Lavoro' comprende i punti da:", "o": ["5 a 6", "1 a 30", "16 a 26", "28 a 40"], "a": 2}, {"id": 48, "m": 5, "n": 10, "q": "In base al Codice etico per OML:", "o": ["gli OML dovranno agire considerando sempre come prioritario l'interesse della salute e della sicurezza dei lavoratori", "gli OML dovranno agire considerando sempre come prioritario l'interesse della comunità", "gli OML dovranno agire considerando sempre come prioritario l'interesse degli RSPP", "gli OML dovranno agire considerando sempre come prioritario l'interesse dei sindacati"], "a": 0}, {"id": 49, "m": 6, "n": 1, "q": "Cosa si intende per \"Risk Management\":", "o": ["rappresenta l'insieme di varie azioni complesse", "rappresenta l'insieme di varie azioni complesse messe in atto per migliorare la qualità delle prestazioni sanitarie", "rappresenta l'insieme di varie azioni complesse messe in atto per migliorare la qualità delle prestazioni sanitarie e garantire la sicurezza del paziente, sicurezza basata sull'apprendere dall'errore", "rappresenta l'insieme di varie azioni complesse messe in atto per garantire la sicurezza del paziente"], "a": 2}, {"id": 50, "m": 6, "n": 2, "q": "Come si definisce l'errore in Sanità:", "o": ["l'errore è definito dal Ministero della Salute come il \"fallimento nella pianificazione e/o nell'esecuzione di una sequenza di azioni che determina il mancato raggiungimento, non attribuibile al caso, dell'obiettivo desiderato\"", "l'errore è definito dal Ministero della Salute come il \"fallimento nella pianificazione e/o nell'esecuzione di una sequenza di azioni che determina il mancato raggiungimento\"", "l'errore è definito dal Ministero della Salute come il \"fallimento nella pianificazione\"", "l'errore è definito come il \"fallimento nella pianificazione e/o nell'esecuzione di una sequenza di azioni\""], "a": 0}, {"id": 51, "m": 6, "n": 3, "q": "Come si classificano gli errori:", "o": ["skill-based behaviour, knowledge-based behaviour", "skill-based behaviour, ruled-based behavior, knowledge- based behaviour", "skill-based behaviour, ruled-based behavior", "skill-based behaviour, near misses"], "a": 1}, {"id": 52, "m": 6, "n": 4, "q": "Come si definisce il rischio clinico:", "o": ["la probabilità che un paziente sia vittima di un evento avverso, cioè subisca un qualsiasi danno o disagio imputabile, anche se in modo involontario, alle cure mediche prestate durante il periodo di degenza, e che sia causa di un prolungamento di tale periodo, di un peggioramento delle condizioni di salute o della morte", "La probabilità che un paziente sia vittima di un evento unitamente al Massaggiatore capo bagnino stabilimenti idroterapici"], "a": 0}, {"id": 75, "m": 8, "n": 7, "q": "L'esercente la professione sanitaria", "o": ["non è mai civilmente responsabile per gli illeciti compiuti nell'esercizio dell'attività professionale, nenche in caso di dolo o colpa grave", "è esposto all'azione di responsabilità amministrativa della struttura sanitaria, in caso di dolo o colpa grave, a seguito dell'avvenuto risarcimento, in virtù di un titolo giudiziale o stragiudiziale ed entro un anno dall'avvenuto pagamento", "non è mai responsabile per i danni cagionati nell'espletamento della propria attività professionale se coperto da polizza assicurativa", "può essere condannato per responsabilità amministrativa ad una somma non superiore al quadruplo del valore maggiore della retribuzione lorda o del corrispettivo convenzionale conseguito nell'anno di inizio della condotta causa dell'evento o nell'anno immediatamente precedente o successivo"], "a": 1}, {"id": 76, "m": 8, "n": 8, "q": "La riforma Lorenzin ha modificato l'art. 348 c.p. che disciplina l'esercizio abusivo di una professione:", "o": ["prevedendo la pubblicazione della sentenza di condanna e la confisca delle cose che servirono o furono destinate a commettere il reato, nonché la trasmissione, nel caso in cui il soggetto che ha commesso il reato eserciti regolarmente una professione o un'attività, al competente Ordine, Albo o Registro per l'interdizione da 1 a 3 anni dalla professione o attività regolarmente esercitata", "prevedendo che la pena sia attenuata in caso di possesso dei titoli abilitanti all'esercizio della professione, pur in mancanza dell'iscrizione all'albo professionale di appartenenza.", "derubricando la fattispecie in reato contravvenzionale, punito unicamente con pena pecuniaria", "prevedendo che tale reato sia punito con la reclusione da tre mesi a sei anni e la multa da 15.000 a 100.000 euro"], "a": 0}, {"id": 77, "m": 8, "n": 9, "q": "La riforma Lorenzin ha istituito:", "o": ["l'Ordine delle Professioni ed Arti ausiliarie, tecniche, della riabilitazione e della prevenzione", "l'Ordine dei tecnici sanitari di radiologia medica e delle professioni sanitarie ausiliarie", "l'Ordine delle professioni sanitarie della prevenzione, della riabilitazione e tecnico-sanitarie", "l'ordine dei tecnici sanitari di radiologia medica e delle professioni sanitarie tecniche, della riabilitazione e della prevenzione"], "a": 3}, {"id": 78, "m": 8, "n": 10, "q": "Gli accordi istitutivi di nuove professioni sanitarie dovranno individuare:", "o": ["il titolo professionale, l'ambito di attività di ciascuna professione, i criteri di valutazione dell'esperienza professionale, i criteri per il riconoscimento dei titoli equipollenti", "il titolo professionale, le eventuali attività esercitabili da più profili professionali, i criteri di valutazione dell'esperienza professionali, i criteri per il riconoscimento dei titoli equipollenti", "il titolo professionale, l'ambito di attività di ciascuna professione, i criteri di valutazione dell'esperienza professionale, i criteri per il riconoscimento dei titoli equivalenti", "l'istituzione di uno specifico corso di laurea, l'ambito di attività di ciascuna professione, i criteri di valutazione dell'esperienza professionali, i criteri per il riconoscimento dei titoli equipollenti"], "a": 0}, {"id": 79, "m": 9, "n": 1, "q": "Allo stato dell'arte, l'art. 32, co. 1, Cost., è inteso come:", "o": ["norma programmatica per il legislatore", "mero diritto sociale ad essere curati", "diritto composito tra diritto di libertà e diritto di \"credito\"", "diritto al benessere esclusivamente fisico"], "a": 2}, {"id": 80, "m": 9, "n": 2, "q": "L'attuale interpretazione dell'art. 32, co. 2, Cost. ha sancito:", "o": ["la concezione paternalistica del rapporto sanitario-paziente", "l'autoderdeterminazione terapeutica", "ruolo paritario tra medico e paziente per la scelta del trattamento sanitario", "la scelta del trattamento sanitario spetta esclusivamente all'operatore sanitario"], "a": 1}, {"id": 81, "m": 9, "n": 3, "q": "La liceità del trattamento sanitario trova il proprio fondamento giuridico nel:", "o": ["articolo 50 - consenso dell'avente diritto", "articolo 51 - esercizio del diritto o adempimento del dovere", "articolo 54 - stato di necessità", "adempimento del dovere con il presupposto del consenso informato"], "a": 3}, {"id": 82, "m": 9, "n": 4, "q": "Il consenso espresso dal paziente per considerarsi informato deve essere incentrato su:", "o": ["effetti del trattamento", "diagnosi, mezzi terapeutici disponibili, rischi della terapia ed effetti del trattamento", "rischi della terapia a cui va in corso", "sommarie informazioni del trattamento sanitario"], "a": 1}, {"id": 83, "m": 9, "n": 5, "q": "In caso di incapacità del paziente, l'espressione del consenso spetta:", "o": ["al paziente incapace se è idoneo a provvedere ai propri interessi in base alla natura della decisione che egli è chiamato ad assumere", "sempre al suo legale rappresentante", "al professionista sanitario", "al paziente incapace previo accordo con il rappresentante legale"], "a": 0}, {"id": 84, "m": 9, "n": 6, "q": "Secondo la dottrina maggioritaria, la responsabilità per difetto di informazione si verifica:", "o": ["quando l'obbligo di informazione viene compiuto in una fase antecedente all'eseguirsi del trattamento sanitario", "quando non si è assolto all'obbligo di informazione, ma il trattamento sanitario è perfettamente riuscito", "quando, pur rispettando l'obbligo di informazione, il trattamento sanitario non è perfettamente riuscito", "quando il paziente è stato informato di tutti i rischi/benefici e il trattamento sanitario è stato correttamente eseguito"], "a": 1}, {"id": 85, "m": 9, "n": 7, "q": "In relazione al principio del consenso, il rifiuto del trattamento sanitario è:", "o": ["l'estrinsecazione in chiave negativa delle medesime coordinate normative", "il principio contrario che si legittima per coordinate normative contrarie a quelle del consenso", "distinto ed autonomo e non ha alcuna correlazione", "altrimenti detto \"abbandono terapeutico\""], "a": 0}, {"id": 86, "m": 9, "n": 8, "q": "In caso di rifiuto di trattamento sanitario della madre in favore del concepito, se l'intervento medico è pregiudizievole per la salute della madre prevale:", "o": ["la volontà del madre a preferire la salute del concepito", "la discrezionalità del medico", "prevale il diritto alla salute della madre", "prevale sempre e comunque il diritto alla salute del concepito"], "a": 2}, {"id": 87, "m": 9, "n": 9, "q": "Secondo una recente evoluzione giurisprudenziale, la legittimità del rifiuto sanitario del paziente in condizioni di incoscienza si rinviene:", "o": ["nel potere di rappresentanza del tutore", "nella volontà del paziente", "nella valutazione del professionista sanitario", "nel \"best interest\", come volontà presunta del paziente"], "a": 3}, {"id": 88, "m": 9, "n": 10, "q": "Con la \"soggettivizzazione\" della valutazione medico- sanitaria, sancita in dottrina e giurisprudenza, il controllo dell'operatore sanitario deve essere:", "o": ["ex post, inteso come corretto espletamento del trattamento sanitario", "ex ante, incentrato sulla corretta manifestazione del consenso e dei presupposti legislativi", "completamente assente", "orientato in relazione ad una propria autonomia decisionale"], "a": 1}, {"id": 89, "m": 10, "n": 1, "q": "Lo Stato è intervenuto legislativamente nel tentativo di creare un sistema sanitario pubblico, incontrando come ostacoli:", "o": ["Le condizioni sociali ed economiche del Paese, le carenti condizioni igienico sanitarie ed un inesistente sostegno pubblico della Sanità, che hanno reso vano il tentativo dello Stato di costruire un sistema sanitario strutturato", "L'inadeguatezza delle condizioni sociali, economiche ed igienico-sanitarie del Paese, evidenziando l'inesistenza dell'assistenza sanitaria pubblica. I Governi del tempo, presieduti prima da Crispi e poi da Giolitti, iniziarono a strutturare una parvenza di intervento statale, istuendo Uffici e Servizi di sanità pubblica, tuttavia sempre minoritario e succedaneo a quello dei privati, garantendo una limitata assistenza alla popolazione", "Un poco strutturata sistema sanitario, sul quale, con adeguati interventi legislativi, lo Stato è intervenuto i modo organico, creando i presupposti per un sistema sanitario, fondato sull'assistenza, prevenzione e cura", "L'arretratezza delle condizioni socio-economiche del Paese, che hanno impedito un intervento legislativo efficace, che desse impulso alla formazione di un sistema saniario di tipo assistenzialistico"], "a": 1}, {"id": 90, "m": 10, "n": 2, "q": "L'intervento pubblico, prima dell'istituzione del regime fascista, si era limitato alla applicazione del T.U. n. 636/1907, non riuscendo a dare organicità al Sistema. Il Fascimo ha dato un nuovo impulso a tale azione attaverso:", "o": ["Un intervento di riordino e riorganizzazione della legislazione sanitaria, finalizzati a fornire assistenza alle categorie meno tutelate (infanzia, maternità, figli illegittimi abbandonati), per poi approvare il T.U. delle Leggi Sanitarie, su proposta di Mussolini, coordinanando le norme esistenti e a ristrutturando il comparto della sanità pubblica, con interventi in favore dei lavoratori, creando Enti mutualistici (come INPS, INAM, ENPDAP, IPAB) ed adottando una politica garantista dei luoghi di lavoro, lasciando notevole spazio alla beneficenza privata", "La ristrutturazione del Sistema Sanitario e l'introduzione di nuove norme ed un'adeguata applicazione del T.U. n. 636/1907", "La creazione di una Sanità pubblica fondata sulle Mutue private e Enti di assistenza pubblici", "La riorganizzazione della Sanità pubblica, con l'abbandono parziale dell'intervento privato e della Chiesa in materia di assistenza e cura a favore di un forte intervento statale, con un forte contributo finanziario"], "a": 0}, {"id": 91, "m": 10, "n": 3, "q": "Dopo il secondo conflitto mondiale, la Riforma dell'ordinamento sanitario nasce da:", "o": ["Una compiuta organizzazione del sistema sanitario pubblico che fonda le sue radici nel riconoscimento del diritto alla salute come principio consacrato nell'art. 32 della Costituzione Italiana", "Le criticità evidenziate nel periodo pre-bellico, che hanno indotto lo Stato ad intervenire sull'impianto legislativo esistente per ristrutturare tutta la sanità, partendo proprio dalla Carta costituzionale del 1948, individuando nell'art. 117 della stessa i principi fondamentali per decentrare competenze e funzioni", "Una profonda riorganizzazione della Sanità pubblica, che passa dal primario riconoscimento della salute quale diritto fondamentale dell'individuo ed interesse della collettività, consacrati nel combinato disposto dagli art. 32 e 117 della Costituzione Italian, che attribuisce alle Regioni un ruolo primario all'interno del sistema sanitario, in appilcazione al decentramento politico e amministrativo", "La necessità di adeguare la sanità pubbliche al nuovo contesto politico, sociale ed economico del Paese"], "a": 2}, {"id": 92, "m": 10, "n": 4, "q": "Con la L. n. 296/1958, il nostro legislatore, nel prendere atto della disorganizzazione e delle carenze evidenziate dal servizio sanitario, ha istituito:", "o": ["L'Alto Commissariato per l'Igiene e la Sanità Pubblica, in modo da sotrarre tutta la materia sanitaria al Ministero dell'Interno, attribuendo a tale organismo la tutela della salute pubblica, lnonchè il compito di coordinare e vigilare sulle organizzazioni sanitarie e sugli enti mutualistici cui era assegnata la funzione di contrastare e prevenire le malattie sociali", "Il Ministero della Sanità e l'Alto Commissariato per l'Igiene e la Sanità Pubblica, in modo da sotrarre tutta la materia sanitaria al Ministero dell'Interno, centralizzando sul primo la potestà legislativa in materia sanitaria e attribuendo al secondo l'azione esecutiva in ambito igienico-sanitario", "Il Ministero della Sanità, coadiuvato dall'Alto Commissariato per l'Igiene e la Sanità Pubblica, dal Consiglio superiore di sanità e dall'Istituto superiore di sanità, ripartendo, tra gli stessi, ruoli, funzioni e competenze", "Il Ministero della Sanità, riunendo in questa unica struttura ministeriale le competenze dell'Alto Commissariato e delle altre amministrazioni centrali preposte alla sanità pubblica, coadiuvato nelle sue funzioni, in ambito nazionale, dal Consiglio superiore di sanità e dall'Istituto superiore di sanità, ed in quello periferico dal Medico Provinciale e dagli Ufficiali sanitari comunali"], "a": 3}, {"id": 93, "m": 10, "n": 5, "q": "La Riforma ospedaliera posta in essere con la L. n. 132/68, la cd. Legge Mariotti, ha esteso a tutti i cittadini il diritto all'assistenza ospedaliera. Gli obiettivi raggiunti e le criticità evidenziate hanno costituito la premessa per:", "o": ["La nascita del Servizio Sanitario Nazionale (SSN). Con la Legge Mariotti venne superato il sistema assicurativo su base mutualistica della sanità pubblica, basato sulla assistenza e beneficenza caritatevole. Gli ospedali diventano enti autonomi, gli enti pubblici vengono sciolti e sostituiti dalle Casse Mutue, le quali, nel tempo, hanno privilegi per le classi di lavoratori e loro familiari che potevano fruire di cura e assistenza perché iscritti alla Mutua di riferimento. Con l'istituzione del SSN, si vuole porre rimedio a tali problematiche", "La nascita del Servizio Sanitario Nazionale. La legge Mariotti ha contribuito alla razionalizzazione delle strutture ospedaliere, diventate enti autonomi, che costituiranno le fondamenta per la riforma della Sanità pubblica", "La costituzione di un Servizio Sanitario Nazionale, scevro da implicazioni di natura privatistica e proiettato verso un'assistenza sanitaria garantista per utti i cittadini di ogni ordine e grado", "Per la riorganizzazione degli enti ospedalieri, diventati strutture autonome, capaci di assicurare assistenza, prevenzione e cura a tutti i cittadini"], "a": 0}, {"id": 94, "m": 10, "n": 6, "q": "La Legge istitutiva del SSN, la n. 833/78, ha introdotto e prodotto:", "o": ["Partendo dai principi costituzionali della salute quale diritto fondamentale dell'individuo ed interesse della collettività, servizi essenziali per tutti coloro stanziati nel territorio nazionale, razionalizzando l'organizzazione, sia centrale che periferica, e la spesa sanitaria, efficentando i servizi, anche con controlli economico-finanziari, promuovendo la salute dell'individuo in tutti i suoi aspetti", "Prendendo atto delle criticità della Legge Mariotti e dell'indebitamento degli Enti pubblici mutualistici, una riorganizzazione della sanità pubblica, riducendone la spesa, tentando di assicurare assistenza, prevenzione e cura a gran parte dei cittadini", "Servizi essenziali ai cittadini con l'obiettivo di assicurare assistenza sanitaria, a prescindere dall'indebitamento del sistema", "Una riforma strutturale dell'intero comparto della sanità pubblica, non riuscendo ad attuare i principi consacrati nel combinato disposto dagli artt. 32 e 117 della Costituzione Italiana"], "a": 0}, {"id": 95, "m": 10, "n": 7, "q": "Gli strumenti della Legge di Riforma del SSN risiedono:", "o": ["In un graduale abbandono del decentramento amministrattivo ed un accentramento di potere degli organi ministeriali", "Nel decentramento politico-amministrativo, con razionalizzazione di risorse, competenze e funzioni tra organi centrali (Ministeriali e Comitati) e periferici (USL) ed in una intensa e adeguata azione di pianificazione e programmazione (sempre a livello centrale e periferico) con l'istituzione sia di un Piano Sanitario Nazionale che Regionale (PSR)", "In una ridistribuzione delle competenze tra organismi centrali e su base territoriale, razionalizzando le risorse finanziarie messe a disposizione dal governo", "In un decentramento amministrativo, lasciando alle Regioni, individuate come Ente Locale primario, la responsabilità politico-economica per la struttuazione organizzativa ed amministrativa della Sanità pubblica, divenuta ormai periferica"], "a": 1}, {"id": 96, "m": 10, "n": 8, "q": "Il legislatore, negli anni '90, successivamente alla Legge di Riforma della Sanità Pubblica, è intervenuto per adeguare tutto il sistema sanitario alle mutate e mutanti condizioni politiche, socieli ed economiche del Paese, attraverso:", "o": ["La L. n. 833/78, il D.Lgs. n. 502/92, il D.Lgs. n. 517/93 ed il D.Lvo n. 229/99", "La legge di riforma della 833/78 ed il D.Lgs. n. 517/93", "Il D.Lgs. n. 517/93 e la Riforma Bindi", "Il D.Lgs. n. 502/92, in attuazione alla Legge delega del Governo Amato n. 421/92, cd. Riforma delle riforme, il D.Lgs. n. 517/93 ed il D.Lvo n. 229/99, la cd. Riforma Bindi, che introdussero l'aziendalizzazione delle USL. oramai regionalizzate e dotate di personalità giuridica, di propria autonomia organizzativa, amministrativa e finanziaria, ed i livelli uniformi di assistenza"], "a": 3}, {"id": 97, "m": 10, "n": 9, "q": "Le modifiche introdotte dal Titolo V della Costituzione hanno ridisegnato:", "o": ["Le competenze di Stato e Regioni nella sanità pubblica, attribuendo al primo una competenza esclusiva leglislativa in materia di assistenza, prevenzione e cura, ed ale seconde, in via subordinata, la pianificazione dell'attuazione di igiene e profilassi.", "Le competenze di Stato e Regioni in materia sanitaria, in un sistema di legilsazione concorrente, pur mantenendo in capo allo Stato \"una clausola di supremazia\", consentendo all'autorità statale di intervenire in materie non riservate alla legislazione esclusiva regionale in presenza di un interesse nazionale da tutelare. Fatti salvi i principi della Riforma, hanno previsto l'erogazione per tutti i cittadini di prestazioni e servizi ricompresi nei Livelli Essenziali di Assistenza (LEA).", "L'impianto della Sanità pubblica, nascondendo dietro una legislazione esclusiva concorrente tra Stato e Regioni, un accentramento di competenze e funzioni allo Stato. Ciò ha determinato una perdita progressiva di un azione coordinata tra organismi centrali e locali, non garantendo l'attuazione dei principi ispiratori della riforma.", "L'art. 117 della Costituzione, con il quale il legislatore ha inteso creare un federalismo solidale, garante di una applicazione uniforme di prestazioni e servizi in tutto il Paese"], "a": 1}, {"id": 98, "m": 10, "n": 10, "q": "Con l'istituzione del Ministero della Salute, L. n. 371/2001, il nostro ordinamento ha voluto garantire la tutela della salute ed il contenimento della spesa sanitaria, costituendo:", "o": ["I Livelli essenziali di assistenza (LEA), in concetto introdotti dalla legge di riforma costituzionale del Titolo V, la n. 3/2001, la cui determinazione è affidata alla legislazione esclusiva dello Stato. Aggiornati nel 2017, sono il nucleo del diritto alla salute e della sua tutela, ovvero l'insieme di prestazioni e servizi che il SSN fornisce sul territorio nazionale agli individui in esso stanziali, in via gratuita o dietro pagamento di una quota di partecipazione (ticket). La relativa copertura finanziaria è assicurata dal gettito fiscale. Le Regioni, con risorse proprie, possono garantire prestazioni ulteriori rispetto a quelle incluse nei LEA", "I Livelli minimi essenziali delle prestazioni concernenti i diritti civili e sociali che devono essere garantiti sul territorio Nazionale, individuati con legge dello Stato", "Una potestà legislativa esclusiva in capo alle Regioni, in applicazione al decentramento amministrativo di cui all'art. 117 dell Costituzione, in relazione alla individuazione dei livelli minimi essenziali delle prestazioni sanitarie", "In capo cittadini e associazioni di pazienti, alle istituzioni vigilate dal Ministero della Sanità, Aziende sanitarie e ospedaliere, Società scientifiche, IRCCS, Policlinici universitari, professionisti del SSN e loro associazioni, Aziende produttrici di tecnologie sanitarie e loro associazioni, l'individuazione dei livelli di assistenza minimi, ponendo interamente a carico del SSN i loro costi"], "a": 0}, {"id": 99, "m": 11, "n": 1, "q": "Il concetto di \"salute\" come bene primario è frutto di una lunga evoluzione storica e sociale:", "o": ["Che, pur avendo trovato consacrazione nell'art. 32 della Costituzione Italiana, non è riuscito ad affermarsi né negli ordinamenti europei e continentali né nei principali atti promanati dai più importanti organismi internazionali", "Che ha trovato la sua consacrazione nell'art. 32 della nostra Costituzione del 1948, diventandone principio cardine in duplice veste sia quale diritto dell'individuo, sacro ed inviolabile sia come bene comune. Tale principio, lo troviamo espresso anche nella Costituzione dell'Organzizzazione mondiale della Sanità e nella Dichiarazione Universale dei Diritti Umani delle Nazioni Unite, entrambe del 1948", "Che, inteso solo quale tutela della salute fisica dell'individuo, non ha trovato adeguato riconoscimento negli ordinamenti dei vari Stati europei e continentali", "Che ha trovato la sua consacrazione nell'art. 32 della nostra Costituzione del 1948, diventandone principio cardine in duplice veste sia quale diritto dell'individuo, sacro ed inviolabile sia come bene comune, ovvero un interesse collettivo, da garantire e tutelare"], "a": 1}, {"id": 100, "m": 11, "n": 2, "q": "L'art. 32 della Costituzione Italiana ha fatto assurgere la salute e la sua tutela come diritto, qualificandolo:", "o": ["Come principio di rilevanza e rango costituzionale. Con tale norma, il Costituente ha indicato il postulato ispiratore di tutta la materia, affermando l'assolutezza del diritto alla salute ed alla sua duplice rilevanza, individuale e collettiva, ponendo, al contempo, in capo alla Repubblica, l'obbligo di tutelare tale diritto, nei suoi diversi aspetti, assumendo addirittura carattere precettivo in riferimento alla tutela dei più bisognosi", "Quale fonte ispiratrice di tutta la sanità pubblica, lasciando tuttavia al la discrezionalità del legislatore l'adozione di norme finalizzate all'applicazione di tale diritto", "Come principio fondamentale, perno del sistema legislativo afferente la Sanità pubblica, finalizzato a garantire assistenza, prevenzione e cura ai cittadini capaci di produrre reddito. Tale norma avalla il concetto di salute quale interesse diffuso collettivo", "Malgrado il suo duplice aspetto di diritto individuale e bene collettivo, come un comune interesse collettivo, degno tuttavia di tutela"], "a": 0}, {"id": 101, "m": 11, "n": 3, "q": "Il nostro legislatore, nel tentativo di costruire nel periodo post-Costituzione un sistema sanitario adeguato ai tempi e condizioni politico-sociali del Paese, ha posto in essere diversi interventi legislativi caratterizzati:", "o": ["Dall'applicazione farraginosa dei principi costituzionali, non dando strutturazione organica alla Sanità pubblica", "Il sistema sanitario è diventato lo strumento per garantire assistenza, cura e prevenzione a tutti gli individui stanziati nel nostro territorio. Pertanto, la Sanità pubblica, accentrata al MInistero della Sanità, con la L. n. 296/58, è stata finalizzata a garantire tali principi, attraverso: la riforma ospedaliera del '68; la prima riforma della Sanità pubblica, L. n. 833/78; il dentramento politico-amministrativo di funzioni e competenze; la Riforma bis, la cd. Riforma delle Riforme, il D.Lgs. 502/92; la Riforma ter, D.Lgs. n. 229/99, meglio conosciuta come riforma Bindi", "Dalla volontà di rendere fruibili la salute e la sua tutela a tutti i cittadini", "Dalla necessità di strutturare un sistema sanitario capace di garantire assistenza, cura e prevenzione, attraverso strumenti quali il decentramento territoriale di competenze e funzioni nella materia, con la creazione delle USL comunali, in applicazione alla Legge di riforma di tutto il comparto, ovvero la n. 616/77"], "a": 1}, {"id": 102, "m": 11, "n": 4, "q": "Il Servizio sanitario nazionale, nell'esercizio delle sue attività istituzionali persegue:", "o": ["Il decentramento politico-amministrativo, attraverso l'interazione di Stato, Regioni ed enti locali, su competenze e funzioni ridefinite dalla normativa, avvalendosi, per la realizzazione di tali fini, di una struttura organizzata su tre livelli, statale, regionale e locale, in grado di offrire, gratuitamente o dietro pagamento di un ticket, per mezzo delle USL territoriali, eguali prestazioni assistenziali, curative e preventive a tutti gli individui stanziati nel Paese.", "Il superamento degli squilibri territoriali nelle condizioni socio- sanitarie del paese; La sicurezza del lavoro; La tutela della maternità e dell'infanzia;La realizzazione di adeguati servizi medico-scolastici per la tutela della salute nell'età evolutiva; La tutela sanitaria delle attività sportive; La tutela della salute degli anziani; La tutela della salute mentale", "Il principio dell'accentramento di competenze e funzioni allo Stato, che poi delega, con specifici interventi normativi, a Regioni ed Enti locali", "Una attività di pianificazione e programmazione, attraverso il Piano Sanitario Nazionale, che, stante la necessità di razionalizzare la spesa, determina gli strumenti attraverso i quali garantire l'assistenza, cura e prevenzione ai cittadini residenti nel Paese, produttori di reddito"], "a": 0}, {"id": 103, "m": 11, "n": 5, "q": "Con la modifica della Parte II del Titolo V della Costituzione, il legislatore ha inteso:", "o": ["Ridistribuire le funzioni in materia sanitaria, accentrandone la governance agli uffici statali", "Ridistribuire le funzioni in materia sanitaria, accentrandone la governance agli uffici comunali", "Ridistribuire le funzioni in materia sanitaria, accentrandone la governance agli uffici delle Province e Città Metropolitane", "Dare garanzia costituzionale al decentramento amminnistrativo della Sanità pubblica, ponendo sempre più la regione come fulcro organizzativo essenziale del SSN e responsabile del governo della Sanità"], "a": 3}, {"id": 104, "m": 11, "n": 6, "q": "Il Piano Sanitario Nazionale è:", "o": ["Il principale strumento di programmazione sanitaria, attraverso il quale, per un periodo temporale di tre anni, vengono definiti gli obiettivi da raggiungere attraverso l'individuazione di attività e strategie strumentali alla realizzazione delle prestazioni istituzionali del SSN, ovvero i LEA", "Il principale strumento di programmazione sanitaria, con il quale lo Stato, annualmente, individua i livelli essenziali ed uniformi di assistenzanza", "Uno strumento di programmazione del Ministero della Salute, correlato al Piano Generale Sanitario, attraverso il quale vengono individuati gli obiettivi del SSN", "Lo strumento della pianificazione sanitaria triennale del Ministero della Salute, che deve essere adottato seguendo le direttive e gli obiettivi individuati dai piani sanitari regionali"], "a": 0}, {"id": 105, "m": 11, "n": 7, "q": "Gli obiettivi del PSN, tutt'oggi in vigore, sono:", "o": ["L'aziendalizzazione degli ospedali e la radicalizzazione nel territorio dele USL, per consentire così l'accesso ad eguali prestazioni per tutti i cittadini", "la tutela della salute in tutte le sue forme; l'umanizzazione dell'ospedale e le cure palliative; la prevenzione e la presa in carico della malattie invalidanti; la tutela della salute nelle prime fasi di vita, infanzia e adolescenza; la tutela della salute mentale e la prevenzione e presa in carico delle dipendenze; la salute delle fasce sociali marginali", "la promozione della salute e la lotta alle malattie trasmissibili, alle grandi patologie, al dolore e alla sofferenza nei percorsi di cura; l'umanizzazione dell'ospedale e le cure palliative; la prevenzione e la presa in carico della non autosufficienza; la tutela della salute nelle prime fasi di vita, infanzia e adolescenza; la tutela della salute mentale e la prevenzione e presa in carico delle dipendenze; la salute delle fasce sociali marginali", "la promozion Codice dei Diritti Umani, sacri ed inviolabili, rimasto inosservato da gran parte degli Stati membri", "Un codice etico di importanza storica fondamentale, poiché per la prima volta nella storia dell'umanità vedeva la luce un documento che considerava tutti gli individui senza alcuna forma di distinzione, codificando che esistono diritti, sacri ed inviolabili, di cui ogni essere umano deve poter godere per la sola ragione di esistere", "Un codice etico, nato consuetudinario e fonte di successive Convenzioni, poiché per la prima volta nella storia dell'umanità vedeva la luce un documento che considerava tutti gli individui senza alcuna forma di distinzione, codificando che esistono diritti, sacri ed inviolabili, di cui ogni essere umano deve poter godere per la sola ragione di esistere"], "a": 3}, {"id": 112, "m": 12, "n": 4, "q": "I diritti umani sono classificati come:", "o": ["Diritti civili", "Diritti umani interdipendenti, caratteristica che li rende singolari perché riunisce in una sola denominazione, sia quelli civili che economici, sociali e culturali", "Diritti economici e socio-culturali", "Diritti civili e sociali"], "a": 1}, {"id": 113, "m": 12, "n": 5, "q": "Etica e Morale sono concetti simili perché:", "o": ["Attengono alla vita sociale di ciascun individuo, distinguendone i comportamenti , intrinsecamente legati ad aspetti normativi", "Costituiscono elementi del diritto consociario", "Contraddistinguono i comportamenti degli associati in materia economica", "Attengono alla vita sociale dei consociati"], "a": 0}, {"id": 114, "m": 12, "n": 6, "q": "I valori etici rappresentano:", "o": ["Regole sociali contraddistinte dalla non obbliegatorietà della loro osservanza per l'individuo", "Regole di condotta a cui ciascun individuo è libero di conformarsi", "Guide comportamentali che regolano la condotta di un individuo che, codificate in un modus operandi, assurgono a principi, da osservare per rendere fruibili a tutti i valori medesimi", "Guide comportamental cati", "la creazione della copia per immagine", "l'acquisizione di un documento informatico per via telematica o su supporto informatico", "la generazione o il raggruppamento di insiemi di dati o registrazioni provenienti da una o più banche dati"], "a": 1}, {"id": 123, "m": 13, "n": 5, "q": "Il sistema di gestione informatico dei documenti deve assicurare efficienza e sicurezza nella gestione, tali caratteristiche sono garantite da:", "o": ["analisi del rischio", "registrazione informatica", "corretto funzionamento delle fasi di registrazione", "generazione e raggruppamento di insiemi di dati"], "a": 0}, {"id": 124, "m": 13, "n": 6, "q": "Le schede cliniche delle R.S.A. devono esssere conservate per un periodo di:", "o": ["5 anni", "20 anni", "10 anni", "Illimitato"], "a": 2}, {"id": 125, "m": 13, "n": 7, "q": "Il manuale di conservazione prevede al suo interno:", "o": ["descrizione delle fasi del processo di gestione del documento informatico", "regole per l'utilizzo dei documenti informatici", "Unità Organizzative Responsabili delle attività di registrazione e archiviazione", "i dati dei soggetti che hanno assunto la responsabilità del sistema nel tempo"], "a": 3}, {"id": 126, "m": 13, "n": 8, "q": "Il manuale di conservazione non prevede al suo interno:", "o": ["i dati dei soggetti che hanno assunto la responsabilità del sistema nel tempo", "la struttura organizzativa e la descrizione dei documenti oggetto della conservazione", "le modalità di presa in carico e di gestione dei documenti che devono essere conservati", "generazione e raggruppamento di insiemi di dati"], "a": 3}, {"id": 127, "m": 13, "n": 9, "q": "L'analisi del rischio deve valutare:", "o": ["una procedure in caso di violazione dei dati personali", "le procedure più adatte a garantire la conformità ai principi generali in materia dei dati personali", "la disponibilità e la resilianza del sistema", "l'accesso ai dati personali in caso di incidente fisico o tecnico"], "a": 1}, {"id": 128, "m": 13, "n me dei bisogni"], "a": 0}, {"id": 249, "m": 26, "n": 1, "q": "Il processo di \"aziendalizzazione\" del settore sanitario sperimentato negli anni ottanta e novanta, ha portato alla modernizzazione della funzione amministrativa aziendale attraverso l'introduzione della managerialità. Tale riforma, quindi, ha portato all'introduzione di nuovi modelli gestionali caratterizzati per essere:", "o": ["improntati sui principi di efficienza, efficacia ed economicità - strutturati sul processo virtuoso di programmazione/controllo e programmazione - orientati su processi organizzativi, che si ispirano alla responsabilizzazione del management e alla valutazione dei risultati", "improntati sui principi di efficienza - strutturati sul processo virtuoso di programmazione/controllo e programmazione - orientati su processi organizzativi, che si ispirano alla responsabilizzazione del management e alla valutazione dei risultati", "improntati sui principi di efficacia - strutturati sul processo virtuoso di programmazione/controllo e programmazione - orientati su processi organizzativi, che si ispirano alla responsabilizzazione del management e alla valutazione dei risultati", "improntati sui principi di economicità - strutturati sul processo virtuoso di programmazione/controllo e programmazione - orientati su processi organizzativi, che si ispirano alla responsabilizzazione del management e alla valutazione dei risultati"], "a": 0}, {"id": 250, "m": 26, "n": 2, "q": "Al termine \"Performance\" possono essere assegnati almeno tre distinti significati:", "o": ["risultato ottenuto - modalità con le quali le azioni di un'organizzazione vengono percepite al suo interno e nel suo contesto operativo di riferimento", "risultato ottenuto - processo costruito per raggiungerlo - modalità con le quali le azioni di un'organizzazione vengono percepite al suo interno e nel suo contesto operativo di riferimento", "processo costruito per raggiungerlo - modalità con le quali le azioni di un'organizzazion const LS = 'quizmaster-v1';
const L = 'ABCD';
let S = load();
function load(){ try{ const s = JSON.parse(localStorage.getItem(LS)); if(s) return s; }catch(e){} return {stats:{}, manual:{}, cycle:[], cyclePos:0, cycleN:0, errCycle:[], errPos:0, mode:'all', useSugg:false}; }
if(S.useSugg===undefined) S.useSugg=false;
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function ansOf(q){ if(q.a >= 0) return q.a; if(S.manual[q.id] !== undefined) return S.manual[q.id]; if(S.useSugg && q.s !== undefined) return q.s; return -1; }
function badge(q){ if(q.a >= 0) return ''; if(S.manual[q.id] !== undefined) return ' · <span class="pill g">risposta impostata a mano</span>'; if(q.s !== undefined) return ' · <span class="pill w">risposta suggerita (fiducia ' + q.f + '), assente nel PDF</span>'; return ''; }
function ready(){ return RAW.filter(q => ansOf(q) >= 0); }
function st(id){ return S.stats[id] || (S.stats[id] = {ok:0, ko:0, last:[]}); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function byId(id){ return RAW.find(q => q.id === id); }
// contenitore errori: almeno un errore e non ancora due risposte giuste di fila
function inErrorBox(id){ const s = S.stats[id]; if(!s || !s.ko) return false; const l = s.last; return !(l.length >= 2 && l[l.length-1] && l[l.length-2]); }
function errorList(){ return RAW.filter(q => inErrorBox(q.id)).sort((a,b)=> st(b.id).ko - st(a.id).ko || (st(a.id).ok - st(b.id).ok)); }

// ---- giro random senza ripetizioni ----
function newCycle(){ S.cycle = shuffle(ready().map(q=>q.id)); S.cyclePos = 0; S.cycleN++; save(); }
function currentAll(){
  const ids = ready().map(q=>q.id);
  const extra = ids.filter(id => !S.cycle.includes(id));
  if(extra.length){ S.cycle = S.cycle.slice(0,S.cyclePos).concat(shuffle(S.cycle.slice(S.cyclePos).concat(extra))); }
  S.cycle = S.cycle.filter(id => ids.includes(id));
  if(S.cyclePos >= S.cycle.length){ newCycle(); }
  if(!S.cycle.length) return null;
  return byId(S.cycle[S.cyclePos]);
}
function currentErr(){
  const ids = errorList().map(q=>q.id);
  S.errCycle = S.errCycle.filter(id => ids.includes(id));
  ids.filter(id => !S.errCycle.includes(id)).forEach(id => S.errCycle.push(id));
  if(S.errPos >= S.errCycle.length){ S.errCycle = shuffle(S.errCycle); S.errPos = 0; }
  if(!S.errCycle.length) return null;
  return byId(S.errCycle[S.errPos]);
}

let answered = false, lastPick = -1;
function renderTrain(){
  const v = document.getElementById('v-train');
  const modeErr = S.mode === 'err';
  const q = modeErr ? currentErr() : currentAll();
  const tot = modeErr ? S.errCycle.length : S.cycle.length;
  const pos = modeErr ? S.errPos : S.cyclePos;
  let h = '';

  if(!q){
    h += '<div class="card">' + (modeErr ? 'Nessuna domanda nel contenitore degli errori. Torna a “Tutte le domande”.' : 'Nessuna domanda con risposta disponibile.') + '</div>';
    v.innerHTML = h; return;
  }
  const a = ansOf(q);
  h += '<div class="meta"><span>' + (modeErr ? 'Ripasso errori' : 'Giro n. ' + S.cycleN) + ' · domanda ' + (pos+1) + ' di ' + tot + '</span><span>Modulo ' + q.m + ', n. ' + q.n + badge(q) + '</span></div>';
  h += '<div class="prog"><i style="width:' + Math.round(pos/tot*100) + '%"></i></div>';
  h += '<div class="card"><p class="q">' + esc(q.q) + '</p>';
  q.o.forEach((o,i)=>{
    let cls = 'opt';
    if(answered){ if(i===a) cls += ' ok'; else if(i===lastPick) cls += ' ko'; if(i===lastPick) cls += ' sel'; }
    h += '<button class="' + cls + '" ' + (answered?'disabled':'') + ' onclick="pick(' + i + ')"><span class="l">' + L[i] + '</span><span>' + esc(o) + '</span></button>';
  });
  if(answered){
    h += '<div class="fb ' + (lastPick===a?'ok':'ko') + '">' + (lastPick===a ? 'Giusto.' : 'Sbagliato: la risposta corretta è ' + L[a] + '.') + '</div>';
    const s = st(q.id);
    h += '<div class="small" style="margin-top:6px">Su questa domanda: ' + s.ok + ' giuste, ' + s.ko + ' sbagliate.</div>';
    h += '<div class="bar"><button class="btn" id="nextBtn" onclick="next()">Avanti</button><span class="small">Tasto <kbd>Invio</kbd> o <kbd>Spazio</kbd></span></div>';
  } else {
    h += '<div class="small" style="margin-top:8px">Rispondi con i tasti <kbd>1</kbd>-<kbd>4</kbd> o <kbd>A</kbd>-<kbd>D</kbd>.</div>';
  }
  h += '</div>';
  v.innerHTML = h;
}
function setMode(m){ S.mode = m; answered = false; lastPick = -1; save(); renderTrain(); }
function pick(i){
  if(answered) return;
  const q = S.mode==='err' ? currentErr() : currentAll(); if(!q) return;
  const s = st(q.id); const a = ansOf(q);
  if(i===a) s.ok++; else s.ko++;
  s.last.push(i===a); if(s.last.length>10) s.last.shift();
  answered = true; lastPick = i; save(); renderTrain();
  const b = document.getElementById('nextBtn'); if(b) b.focus();
}
function next(){
  if(!answered) return;
  if(S.mode==='err'){ S.errPos++; } else { S.cyclePos++; }
  answered = false; lastPick = -1; save(); renderTrain(); window.scrollTo(0,0);
}
document.addEventListener('keydown', e=>{
  if(document.getElementById('v-train').hidden) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  const k = e.key.toUpperCase();
  if(!answered && k.length===1 && '1234'.includes(k)) pick(parseInt(k)-1);
  else if(!answered && k.length===1 && 'ABCD'.includes(k)) pick(L.indexOf(k));
  else if(answered && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); next(); }
});

// ---- errori frequenti ----
function renderErrors(){
  const v = document.getElementById('v-errors');
  const list = errorList();
  let h = '<div class="note">Qui finiscono le domande sbagliate almeno una volta, in ordine di quante volte le hai sbagliate. Una domanda esce dal contenitore da sola quando la azzecchi due volte di fila; puoi anche toglierla a mano.</div>';
  h += '<div class="bar" style="margin:0 0 14px"><button class="btn" onclick="setMode(\'err\');show(\'train\')" ' + (list.length?'':'disabled') + '>Allenati solo su queste (' + list.length + ')</button></div>';
  if(!list.length){ h += '<div class="card">Nessun errore registrato per ora.</div>'; v.innerHTML=h; return; }
  h += '<div class="card">';
  list.forEach(q=>{
    const s = st(q.id); const a = ansOf(q);
    h += '<div class="row"><div class="t">' + esc(q.q) + '</div>'
      + '<div class="s"><span class="pill">' + s.ko + ' ' + (s.ko===1?'errore':'errori') + '</span><span class="pill g">' + s.ok + ' giuste</span>Modulo ' + q.m + ', n. ' + q.n + ' · ultime risposte: ' + (s.last.map(x=>x?'✓':'✗').join(' ')||'–') + '</div>'
      + '<details><summary>Vedi risposta</summary><div class="ans g"><span class="l">' + L[a] + '</span>' + esc(q.o[a]) + '</div></details>'
      + '<div class="bar"><button class="btn sec" onclick="forgive(' + q.id + ')">Togli dal contenitore</button></div></div>';
  });
  h += '</div>';
  v.innerHTML = h;
}
function forgive(id){ const s = st(id); s.last.push(true,true); if(s.last.length>10) s.last = s.last.slice(-10); save(); renderErrors(); }

// ---- sfoglia ----
let bq = '', bm = 'all';
function renderBrowse(){
  const v = document.getElementById('v-browse');
  const mods = [...new Set(RAW.map(q=>q.m))];
  let h = '<div class="bar" style="margin:0 0 14px"><input type="search" placeholder="Cerca nel testo..." value="' + esc(bq) + '" oninput="bq=this.value;renderBrowse()" style="flex:1;min-width:200px"><select onchange="bm=this.value;renderBrowse()"><option value="all">Tutti i moduli</option>' + mods.map(m=>'<option value="' + m + '" ' + (bm==m?'selected':'') + '>Modulo ' + m + '</option>').join('') + '</select></div>';
  const f = RAW.filter(q => (bm==='all'||q.m==bm) && (!bq || (q.q+' '+q.o.join(' ')).toLowerCase().includes(bq.toLowerCase())));
  h += '<div class="small" style="margin-bottom:8px">' + f.length + ' domande</div><div class="card">';
  f.slice(0,300).forEach(q=>{
    const a = ansOf(q); const s = S.stats[q.id];
    h += '<div class="row"><div class="t">Modulo ' + q.m + ', n. ' + q.n + '. ' + esc(q.q) + '</div>';
    q.o.forEach((o,i)=> h += '<div class="ans ' + (i===a?'g':'') + '"><span class="l">' + L[i] + '</span>' + esc(o) + '</div>');
    if(q.a<0) h += '<div class="s">' + badge(q).replace(' · ','') + (S.manual[q.id]===undefined ? ' confermala o correggila nella scheda “Da completare”.' : '') + '</div>';
    else if(s) h += '<div class="s">Tue risposte: ' + s.ok + ' giuste, ' + s.ko + ' sbagliate.</div>';
    h += '</div>';
  });
  if(f.length>300) h += '<div class="small">Mostrate le prime 300: restringi con la ricerca.</div>';
  h += '</div>'; v.innerHTML = h;
  const inp = v.querySelector('input'); if(bq && inp){ inp.focus(); inp.setSelectionRange(bq.length,bq.length); }
}

// ---- da completare ----
function renderTodo(){
  const v = document.getElementById('v-todo');
  const list = RAW.filter(q=>q.a<0);
  const done = list.filter(q=>S.manual[q.id]!==undefined).length;
  let h = '<div class="note">Il PDF non segna la risposta corretta per ' + list.length + ' domande (quasi tutte negli ultimi moduli). Impostala tu dalla dispensa: appena salvata, la domanda entra nel giro di allenamento. Impostate: ' + done + ' su ' + list.length + '.'
    + '</div>';
  h += '<div class="card">';
  list.forEach(q=>{
    const m = S.manual[q.id];
    h += '<div class="row"><div class="t">Modulo ' + q.m + ', n. ' + q.n + '. ' + esc(q.q) + '</div>';
    q.o.forEach((o,i)=> h += '<label class="ans ' + ((m!==undefined ? m===i : q.s===i) ? 'g' : '') + '" style="display:block;cursor:pointer"><input type="radio" name="m' + q.id + '" ' + ((m!==undefined ? m===i : false)?'checked':'') + ' onchange="setManual(' + q.id + ',' + i + ')"> <span class="l">' + L[i] + '</span>' + esc(o) + '</label>');
    if(m!==undefined) h += '<div class="s"><span class="pill g">impostata: ' + L[m] + '</span>' + (q.s!==undefined && q.s!==m ? ' (il suggerimento era ' + L[q.s] + ')' : '') + ' <button class="btn sec" style="padding:4px 10px;font-size:13px" onclick="unsetManual(' + q.id + ')">Annulla</button></div>';
    else if(q.s!==undefined) h += '<div class="s"><span class="pill w">suggerita: ' + L[q.s] + ' · fiducia ' + q.f + '</span>' + esc(q.w) + ' <button class="btn" style="padding:4px 10px;font-size:13px;margin-left:6px" onclick="setManual(' + q.id + ',' + q.s + ')">Conferma ' + L[q.s] + '</button></div>';
    h += '</div>';
  });
  h += '</div>'; v.innerHTML = h;
}
function setManual(id,i){ S.manual[id]=i; save(); const y = window.scrollY; renderTodo(); window.scrollTo(0,y); }
function unsetManual(id){ delete S.manual[id]; save(); const y = window.scrollY; renderTodo(); window.scrollTo(0,y); }

// ---- statistiche ----
function renderStats(){
  const v = document.getElementById('v-stats');
  let ok=0, ko=0, seen=0;
  for(const id in S.stats){ ok+=S.stats[id].ok; ko+=S.stats[id].ko; if(S.stats[id].ok+S.stats[id].ko) seen++; }
  const tot = ready().length;
  let h = '<div class="stats">'
    + '<div class="stat"><b>' + tot + '</b><span>domande in gioco (su ' + RAW.length + ')</span></div>'
    + '<div class="stat"><b>' + seen + '</b><span>domande viste almeno una volta</span></div>'
    + '<div class="stat"><b>' + (ok+ko?Math.round(ok/(ok+ko)*100):0) + '%</b><span>risposte giuste (' + ok + ' su ' + (ok+ko) + ')</span></div>'
    + '<div class="stat"><b>' + errorList().length + '</b><span>nel contenitore errori</span></div>'
    + '<div class="stat"><b>' + RAW.filter(q=>q.a<0 && S.manual[q.id]===undefined).length + '</b><span>senza risposta nel PDF, ancora da impostare</span></div>'
    + '<div class="stat"><b>' + S.cycleN + '</b><span>giro in corso (' + S.cyclePos + ' di ' + S.cycle.length + ' fatte)</span></div>'
    + '</div>';
  const mods = {};
  RAW.forEach(q=>{ const m = mods[q.m] || (mods[q.m]={ok:0,ko:0,n:0}); m.n++; const s=S.stats[q.id]; if(s){m.ok+=s.ok;m.ko+=s.ko;} });
  h += '<div class="card"><div style="font-weight:600;margin-bottom:8px">Per modulo</div>';
  Object.keys(mods).forEach(k=>{ const m=mods[k]; const t=m.ok+m.ko; h += '<div class="row" style="padding:6px 0;display:flex;justify-content:space-between"><span>Modulo ' + k + ' (' + m.n + ' domande)</span><span class="small">' + (t?Math.round(m.ok/t*100)+'% giuste su '+t+' risposte':'mai fatto') + '</span></div>'; });
  h += '</div>';
  h += '<div class="bar"><button class="btn sec" onclick="if(confirm(\'Ricominciare il giro da capo, tenendo le statistiche?\')){newCycle();S.mode=\'all\';answered=false;renderStats();}">Nuovo giro</button><button class="btn danger" onclick="if(confirm(\'Cancellare tutte le statistiche e gli errori? Le risposte impostate a mano restano.\')){S.stats={};S.cycle=[];S.cyclePos=0;S.cycleN=0;S.errCycle=[];S.errPos=0;S.mode=\'all\';save();newCycle();renderStats();}">Azzera statistiche</button></div>'
    + '<p class="small">I dati restano salvati in questo browser su questo dispositivo.</p>';
  v.innerHTML = h;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function show(v){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  ['train','errors','browse','todo','stats'].forEach(k=>document.getElementById('v-'+k).hidden = k!==v);
  ({train:renderTrain, errors:renderErrors, browse:renderBrowse, todo:renderTodo, stats:renderStats})[v]();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
if(!S.cycle.length) newCycle();
show('train');
</script>
